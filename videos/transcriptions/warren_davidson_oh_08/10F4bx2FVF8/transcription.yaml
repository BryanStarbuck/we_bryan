  Video:
    Title: "Davidson on Washington Journal 7.22 Talks Politicized Military and Foreign Influence (Part 2)"
    Description: >-
      A call-in television programme appearance. The host introduces the
      member as an army veteran who served with the Old Guard, and raises a
      Washington Post report that Pentagon officials had defended the
      military's tradition of staying out of elections after a book reported
      that General Mark Milley, chair of the Joint Chiefs of Staff, feared
      President Trump would attempt a coup. The member says he has been
      concerned about Milley, asserts the chairman has politicised the
      military from the beginning, and says the West Point board of visitors
      on which he sits has not met since Joe Biden became president, which
      he characterises as the administration politicising the military while
      preventing members of Congress from observing. He objects to Milley
      reportedly being embarrassed by Trump's language about controlling a
      street, noting the protests concerned followed George Floyd's death
      rather than January 6, and recalls his own father being deployed from
      Fort Bragg to Andrews Air Force Base in the 1960s; he says using the
      military to secure the Capitol was not controversial on Inauguration
      Day. A caller from Georgia on the Democrats' line says foreign
      ownership of US farmland has gone from 15 million to 30 million acres
      in twenty years, that Ohio and Texas have no restrictions while no
      foreigners own land in Iowa, and asks why he worries about illegal
      immigration but not foreign investors buying prime agricultural land.
      He disputes her premise that he is unconcerned, points to the Foreign
      Investment Risk Review Modernization Act strengthening the committee
      on foreign investment's review of real estate purchases, says China in
      particular buys real estate and will sometimes buy a whole office
      building to use its infrastructure to steal data it cannot otherwise
      acquire, agrees a more holistic federal and state review is warranted,
      and says the response to China has been slow. He credits Donald
      Trump's emphasis on trade, says China's practices were crushing
      manufacturing, and accuses it of stealing intellectual property and
      shaping market access contrary to its World Trade Organization
      commitments. The coup report, the caller's acreage figures and the
      member's characterisations are each the claims of their own sources
      and are contested.
