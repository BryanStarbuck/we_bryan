Transcription:

  Video:
    Title: "Davidson talks Inflation, Crypto Taxes & Build Back Better"
    Description: >-
      A television interview covering cryptocurrency tax reporting,
      inflation and the Build Back Better bill. The member explains his bill
      to change the infrastructure law's definition of 'broker' for
      cryptocurrency, saying the IRS code uses the term differently than
      most people would, that the provision was inserted not to regulate the
      industry but as a way to raise taxes without passing a tax hike, and
      that it is not technically feasible to comply with the language. He
      describes a bill he has had since 2018, referred to as the token
      taxonomy bill, creating a bright-line test for whether something is a
      security, and criticises the approach under SEC Chairmen Clayton and
      Gensler of telling firms to come in and negotiate their own deal,
      which he says has taken years and provided little clarity. Asked
      whether he owns cryptocurrency, he says he does not currently. He
      calls a provision known as 6050I unconstitutional, explaining that the
      cash-transaction reporting rule, where failing to collect and report
      information on a sale such as a 25,000 dollar used car is technically
      a felony, is being applied to virtual transactions. On inflation he
      argues it results from policy choices rather than spreading like a
      virus or an earthquake, likens Federal Reserve tapering to applying
      brakes on ice, and says that roughly 6 trillion dollars put into the
      economy did not raise GDP by the same amount, so the remainder went
      into asset price inflation, growing the wealth gap. He says Chairman
      Powell was the best option Biden was considering and that he was
      disappointed by calls for more fiscal stimulus during 2020. He opposes
      Build Back Better, citing a Congressional Budget Office figure of 400
      billion dollars added to the debt plus 400 billion from the
      infrastructure bill, criticising ten-year scoring windows and
      straight-line modelling, and arguing the childcare provisions
      undermine the dignity of work because recipients need not work, study
      or volunteer. The economic claims and the readings of CBO scoring are
      his own.
