Transcription:

  Video:
    Title: "Davidson Breaks Down Landmark Crypto Hearing with Charles Payne"
    Description: >-
      A television interview following a House Financial Services Committee
      hearing on cryptocurrency. The host opens by noting Bitcoin and other
      cryptocurrencies continue to fall, from 68,000 dollars on November 10,
      with no relief from the hearing, and quotes Rep. Roger Williams of
      Texas on the risk of 'curveballs from Washington' undoing industry
      progress. The member calls the hearing historic with a top-tier panel,
      and contrasts it with the hostility and ill-informed questions he says
      met Facebook's Libra pitch two years earlier, saying the knowledge gap
      his colleagues have closed is impressive. Asked about proposals to
      regulate by restricting access to the wealthiest or by routing through
      products like mutual funds, he says the thing most in jeopardy is
      self-custody, the ability to own your own assets: the code is open
      source, anyone with an internet connection can run their own node,
      though a counterparty is still needed, and many use account-based
      systems such as Coinbase or FTX. He criticises a panel focus on what
      he calls surveillance capitalism, saying firms offering to spy on
      customers and report to the government soothed his colleagues'
      consciences, but that a business should not have to be a good spy to
      operate in America. Asked about the House voting 428 to 1 to ban
      imports from Xinjiang unless shown not to be made with forced labour,
      and about opposition from large American companies, he says it is the
      right thing to do, that the United States government rather than the
      SEC and publicly traded companies is the right place to apply the
      leverage, and that China is dehumanising and exploiting the people
      concerned. The characterisations of the panel, of colleagues and of
      China are his own.
