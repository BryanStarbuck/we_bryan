Transcription:

  Video:
    Title: "Davidson Questions CFPB Director about Payments and Privacy"
    Description: >-
      A round of questioning of the Director of the Consumer Financial
      Protection Bureau at a hearing on payments, consumer data and mortgage
      rules. The questioner thanks the Director for work protecting
      consumers and clarifying the law, but says a structural concern shared
      across the aisle is that everything depends on who the director is and
      that the structure should change. He says the previous director
      reflected poorly on Ohio through hiring practices, 'sue and settle
      schemes' and ways of making companies settle in spite of the law; that
      characterisation is his own and the person is neither named nor
      present to answer it. He argues most of the practices being criticised
      at the hearing are already against the law in every state and
      prosecuted by state attorneys general, and stresses consumer financial
      education and the effects of compounding interest. He asks whether the
      Bureau can assess the total transaction costs consumers pay to move
      money, including credit card fees, processing fees and money
      transmittal fees; the Director says he cannot answer directly but that
      the Atlanta Fed does extensive payments research and offers to follow
      up with summaries. On data privacy the member says Congress has failed
      in its duty to set a foundational standard, invokes the Fourth
      Amendment right to privacy as not updated for the electronic era, and
      asks about the impact on consumers when monetised personal data is
      compromised; the Director cites enforcement actions and notes
      jurisdictional lines, including that Congress explicitly removed the
      Gramm-Leach-Bliley safeguards from the Bureau's purview and gave them
      to the Federal Trade Commission and prudential regulators. The
      exchange closes on the qualified mortgage rule and the ability-to-
      repay requirement ahead of a rulemaking.
