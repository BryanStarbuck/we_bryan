Transcription:

  Video:
    Title: "Davidson Speaks Out Against Unconstitutional Background Check Bills"
    Description: >-
      A two-minute House floor speech opposing H.R. 8, a background check
      bill. The member opens on House process, thanking the body for
      preserving the chance to be heard from the minority, saying the
      minority cannot put bills on the agenda or often even get an amendment
      considered, and that the Rules Committee strips anything that would
      materially change a bill, a practice he calls bipartisan and not the
      mark of a functioning legislature. Turning to the bill, he argues
      every commercial firearm transaction already requires a background
      check, whether at a gun store, a gun show or anywhere else, because it
      goes through a federal firearm licence holder. He characterises the
      bill as reaching private transfers, saying that loaning a gun to a
      family member for a hunting trip would require a check and could
      criminalise the lender, and that in effect the government says a
      citizen cannot be trusted to sell a firearm without going through a
      licensed agent. He argues enforcement would require a registry and
      that a registry is the path toward seizure, while acknowledging it
      does not guarantee the government will do so, and draws an analogy to
      the Fourth Amendment, citing court-interpreted warrantless seizures
      for community caretaking and civil asset forfeiture as showing how a
      guarantee can be eroded. He urges opposition to H.R. 8. The account of
      what the bill would do is his own characterisation.
