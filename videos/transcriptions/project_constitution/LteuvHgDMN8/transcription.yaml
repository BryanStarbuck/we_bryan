  Video:
    Title: "‼️Teri Hourihan Is Running for Governor of Arizona as an Independent— She Sits Down with Us Live."
    Description: >-
      A 2 h 29 m live stream on the Project Constitution YouTube channel, hosted by Colin with two guest
      co-hosts he introduces as Kelvia and "KFC" Campbell, interviewing Teri Ann Hourihan, the No Labels Party
      nominee for Governor of Arizona, and her running mate for lieutenant governor, Angela Mohan. Hourihan
      tells her own story: an Arizona native and licensed trauma therapist who built a behavioral-health
      company, says the state placed it on a Medicaid payment-suspension list in 2023 over a fraud allegation
      she says took two years and seven days to clear, and says officials she later criticized publicly
      retaliated with a harassment injunction and licensing complaints; these are her accounts of disputes
      that are in litigation, and the officials she names are not present to answer. She describes being a
      lifelong Democrat, briefly registering Republican, then winning the No Labels primary against a
      better-funded opponent, and a 12 News clip of that primary is played. Mohan describes her background as
      a former U.S. Department of State diplomatic-security special agent and public-safety nonprofit leader.
      The hosts and guests are sharply critical of Turning Point USA and its affiliated entities, call for
      audits and transparency of them, and discuss the Charlie Kirk assassination and the Tyler Robinson
      prosecution in terms of due process; those characterizations are theirs. Hourihan argues that both
      opponents, Governor Katie Hobbs and Congressman Andy Biggs, are bad for Arizona, and makes claims about
      Biggs's legislative record and Epstein-file votes that are her own and contested. Later segments cover
      immigration and ICE, Medicaid and health-insurance costs, childcare and benefits reform, separation of
      church and state, the upcoming governor debate, and appeals to independent and former MAGA voters.
