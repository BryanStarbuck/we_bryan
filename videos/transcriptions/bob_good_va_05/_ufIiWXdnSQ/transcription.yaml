    Description: >-
      A short interview clip of Representative Bob Good on The Daily Signal,
      arguing against additional United States funding for Ukraine and
      objecting to pairing it with emergency funding for Hawaii, which he says
      has nothing to do with Ukraine. He gives several reasons: he does not
      regard it as a U.S. national security issue, he objects to the United
      States leading NATO in Europe and carrying what he calls the lion's
      share, and he says he does not know the exit strategy, what the result
      looks like, or the limit of U.S. involvement. He also says there is no
      accountability for roughly $113 billion already sent and that the money
      being sent is borrowed. He closes by asking why the country would
      exacerbate its own national security and military weaknesses by sending
      resources abroad. The $113 billion figure and the characterisations of
      NATO burden-sharing and of U.S. military weakness are his own
      assertions, offered in an interview setting with no opposing view
      present.
