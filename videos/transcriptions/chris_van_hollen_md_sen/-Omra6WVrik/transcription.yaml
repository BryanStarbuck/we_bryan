  Video:
    Title: "It's smoke and mirrors."
    Description: >-
      The speaker criticises a White House event at which the heads of AI
      companies were to sign a commitment not to pass the cost of building
      data centres, and the electricity they consume, on to consumers. He
      argues the document is not binding and not enforceable, calls it smoke
      and mirrors and "a lot of hoopla and a lot of make-believe", and says
      the president does not deliver on such announcements. He then points
      to his own bill, the Power for the People Act, S. 3682, which he says
      would require data centres to pay for the additional electricity they
      burn and would put data centres rather than households on the losing
      end of any resulting brownouts or blackouts. He ends by urging the
      president to have the White House call Republican leaders in both
      chambers to pass it. The judgements about the event's worth and the
      president's seriousness are the speaker's own; no company or
      administration representative appears.
