    Title: "He should not be representing our country."
    Description: >-
      A confirmation hearing exchange with a nominee to serve as United
      States ambassador to El Salvador. The senator notes that the nominee's
      former boss, Secretary Noem, called two people domestic terrorists and
      declined over two days of hearings to retract it, and asks the nominee
      a single question: whether he agrees that Rene Good and Alex Preddy
      are not domestic terrorists. The nominee declines to answer directly,
      saying the issue does not involve him and that the shootings happened
      after he left, and offers instead that any killing by law enforcement
      is a serious matter that should be evaluated through an investigation
      rather than predetermined. The senator replies that this is precisely
      his point, says he finds it astounding that a prospective ambassador
      cannot say the two American citizens were not domestic terrorists, and
      moves on. The account of the Minneapolis shootings and of the reaction
      to them is the senator's own characterisation; Secretary Noem is not
