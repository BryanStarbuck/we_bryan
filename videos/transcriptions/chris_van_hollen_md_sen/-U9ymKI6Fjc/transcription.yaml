    Title: "Republicans blocked our plan to keep the government open and protect Americans’ health care"
    Description: >-
      Senator Chris Van Hollen explains two votes he cast in the Senate:
      one against what he calls a one-way, entirely partisan Republican
      budget, and one for a Democratic proposal to keep the government
      open. He argues Senate Republicans say they want a bipartisan
      agreement but that Donald Trump is setting the terms, and that
      congressional Republicans have contracted out their votes to him. He
      says he will not write a blank check to what he calls a lawless
      president, and that guardrails are needed because the president is
      refusing to spend appropriated funds for health care at NIH and for
      public safety through FEMA. He then describes the health care
      element of the Democratic proposal: the Affordable Care Act premium
      tax credits expire at the end of the year, which he says will
      immediately cost millions of Americans their insurance and push
      premiums up across the board. He concludes that Republicans are
      heading toward a shutdown and that bipartisanship is the way to
      avoid it. The characterisations of Republican motives and of the
      president are his own and are contested.
