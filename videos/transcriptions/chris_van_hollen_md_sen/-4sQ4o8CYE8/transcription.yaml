Transcription:

  Video:
    Title: "Addressing the Long-Term Unemployment Crisis"
    Description: >-
      A recorded conversation hosted by Senator Chris Van Hollen in
      December 2020 on long-term unemployment, with Marc Morial, president
      of the National Urban League, and Melissa Young, senior director of
      research and policy at the Heartland Alliance. Van Hollen frames the
      problem — people out of work and seeking it for more than six
      months, whose prospects worsen the longer it lasts — and says the
      number rose from over a million before the pandemic to about 3.5
      million. The discussion is tied to legislation he introduced with
      Senator Ron Wyden, the Long-Term Unemployment Elimination Act.
      Morial describes the trajectory of a stably employed airline or
      hospitality worker laid off into foreclosure, food insecurity or
      eviction, argues the service sector jobs affected are
      disproportionately held by Black and brown workers and by young
      women with children, and says the stereotype of the long-term
      unemployed as unmotivated must be disavowed. He describes the
      National Urban League's individually assessed programs — addressing
      addiction, literacy or soft skills as needed — and argues their
      limitation is scale, saying such work is funded as pilots and
      demonstrations rather than at a size that moves the needle. Young
      argues the barriers are the same ordinary supports that let anyone
      work — transportation, jobs paying enough for rent and food — and
      adds that criminal records bar many from employment long after any
      involvement with the system. She recalls drafting subsidized
      employment provisions in the 2009 recovery act, says those programs
      placed roughly 260,000 people in red and blue states, and argues the
      lesson is that they ended too soon, so scope, scale and duration all
      matter. Morial cites his organisation's chief economics advisor on
      public service jobs as powerful stimulus because earnings are spent
      back into the economy, and recalls an Obama-era public service jobs
      initiative that got no traction. Van Hollen outlines the bill's
      mechanism — federal subsidy of employment costs on a sliding match,
      up to two-thirds when unemployment is low, over two years, across
      private, public and nonprofit employers, paired with supports like
      transportation — and says the aim is system-wide rather than grant-
      by-grant change. The three close on strategy: Morial suggests the
      airline and hospitality industries could be allies, notes a
      generational change among chief executives, and urges pushing for
      inclusion in early-2021 legislation; Van Hollen says members of the
      incoming administration's economic team have worked on the proposal.
      The political characterisations, including Morial's remarks about
      members of Congress still in the Reagan era, are the speakers' own.
