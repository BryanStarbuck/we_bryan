Transcription:

  Video:
    Title: "The GOP's little rule change they hoped you wouldn't notice"
    Description: >-
      A House floor exchange from the October 2013 government shutdown,
      recorded when Chris Van Hollen was a member of the House rather than
      a senator. He moves, under Clause 4 of Rule 22, that the House take
      up the Senate amendment and reopen the government, and is told the
      motion may be offered only by the Majority Leader or his designee
      under Section 2 of House Resolution 368. Through a sustained series
      of parliamentary inquiries he establishes on the record what that
      resolution did: he reads the standing rule aloud, gets the chair to
      confirm the House "altered the operation of that standing rule,"
      identifies H. Res. 368 of October 1st by name, and presses until the
      chair concedes the House adopted it. The chair repeatedly declines
      to give an advisory opinion on whether any member would otherwise
      have had the privilege. Van Hollen asks whether the Majority Leader
      or his designee is on the floor, renews his motion, is refused again
      on the same ground, and asks why the rules were rigged to keep the
      government shut down. He is told to suspend, and answers that
      democracy has been suspended. The characterisation of the rule
      change as rigging is his own.
    URL: "https://www.youtube.com/watch?v=0Jd-iaYLO1A"
