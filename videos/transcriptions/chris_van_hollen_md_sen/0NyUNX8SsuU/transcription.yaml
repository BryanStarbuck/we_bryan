  Video:
    Title: "Van Hollen, Maryland delegation call for end to Republican shutdown"
    Description: >-
      A 47-minute outdoor press conference by the Maryland congressional
      delegation on the first day of a federal government shutdown, followed
      by an extended question-and-answer session with reporters. Senator Van
      Hollen opens, thanking federal employees and contractors and saying
      the delegation wants to reopen the government without giving the
      president what he repeatedly calls a blank check, and without
      accepting the coming increases in health insurance premiums. Senator
      Alsobrooks, and Representatives Hoyer, Mfume, Raskin and Elfreth
      follow. Hoyer reads a series of dated quotations he attributes to
      Donald Trump about welcoming or taking responsibility for shutdowns;
      Raskin lists categories of federal workers he says have been fired
      over the preceding nine months and argues the administration is
      contending in court that the civil service itself is unconstitutional;
      Elfreth puts the coming Maryland premium increase at about 13 percent
      on average and the number of affected Marylanders at 190,000. Speakers
      describe relief measures including requests for forbearance from
      financial institutions and utilities and a bill to extend unemployment
      insurance to essential employees working without pay. Raskin also
      argues the shutdown is being used to delay swearing in Representative-
      elect Adelita Grijalva, which he says would supply the 218th signature
      on a discharge petition to release the Epstein files. In the Q&A the
      senators are asked about threatened firings, about Republican offers
      to discuss ACA subsidies later, and about Maryland's exposure.
      Throughout, the attribution of motive to Republicans and to the
      administration is the speakers' own and is contested; no Republican
      member or administration official appears to answer, and the assertion
      that the president's name appears in the Epstein files is presented as
      an inference, not as established fact. Diarization returned 74
      clusters across the event, which reflects a crowded outdoor podium
      with applause and many speakers rather than 74 distinct people.
