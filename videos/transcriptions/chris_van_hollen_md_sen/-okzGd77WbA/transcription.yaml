    Title: "He wouldn't answer."
    Description: >-
      A Senate hearing exchange between a senator and an administration
      witness responsible for ensuring that US arms transfers comply with
      the conventional arms transfer policy. The senator asks whether the
      witness was involved in assessing the risk that a transfer might
      contribute to violations of international humanitarian law in
      connection with a decision to invoke emergency powers, bypassing
      congressional review, to transfer more than 20,000 bombs to the
      Netanyahu government. The witness confirms the policy requires such
      consideration, says any foreign military sale falls under it, says he
      reviews and signs hundreds of arms sales, and says the emergency
      declaration was consistent with the law, without saying whether he
      personally reviewed this one. The senator also asks twice whether the
      witness is concerned by a reported statement from Israeli Defence
      Minister Katz about using the "Rafah model" in Lebanon; the witness
      says he is not familiar with the comment and agrees to look at it and
      respond. The exchange turns contested over whether the witness is
      addressing the question asked. Katz is not present and the quoted
      remark is not verified in the clip. Diarization returned eight
      clusters for what is audibly a two-person exchange, which is crosstalk
