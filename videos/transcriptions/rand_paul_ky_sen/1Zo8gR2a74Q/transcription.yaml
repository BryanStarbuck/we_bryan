  Video:
    Title: "Kelley Paul Appears on Morning Joe- April 15, 2015"
    Description: >-
      A 2015 Morning Joe segment with Kelley Paul, author of "True and Constant Friends" and
      wife of then-presidential candidate Rand Paul. She describes her grandmother, who came
      from Ireland in 1929 and worked as a live-in maid for the founders of Saks Fifth
      Avenue and for wealthy New York families, and a beaded purse the grandmother gave her
      at fifteen that she later carried to the White House. She explains the book grew out of
      asking the college friends she has met with for years which woman shaped who they
      were. The hosts also ask what it is like to be a candidate's wife and raise a New York
      Times headline saying her task is to make Rand Paul more approachable, which she
      rejects as a journalist's framing rather than her own view. It is a book and personal
      interview rather than a policy discussion.
