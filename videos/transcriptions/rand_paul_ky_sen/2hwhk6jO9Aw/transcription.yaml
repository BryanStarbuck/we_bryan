    Description: >-
      A May 2015 Fox News interview with Senator Rand Paul during his effort to block
      reauthorisation of the Patriot Act's bulk collection of phone, text and email records.
      Paul argues the program takes Americans' records without a warrant specific to an
      individual and without the suspicion he reads the Fourth Amendment to require, says
      more than a million people signed up at his campaign site in support, and notes that
      the second highest court in the land had ruled the program illegal. He says he will
      keep filibustering until the program is stopped or amended. The segment plays a clip
      of former Attorney General Michael Mukasey calling him completely off the wall and
      saying he is exploiting public confusion to fuel his presidential ambitions; Paul
      answers that this shows disrespect for the Bill of Rights. Both men's characterisations
      of the other are their own.
