Transcription:

  Video:
    Title: "Rand Paul: Audit The Fed"
    Description: >-
      A Senate floor speech advocating the Federal Reserve Transparency Act, the 'Audit the Fed' bill. The
      speaker argues the Fed operates with unchecked power to create money and choose which banks receive it,
      that creating money is a price control on interest rates, and that artificially low rates inflated the
      housing bubble that preceded the 2008 recession. He states the Fed's balance sheet grew from under $1
      trillion to $4.4 trillion, that from 2009 to 2012 the incomes of the top 1 percent rose 31 percent
      against 0.4 percent for everyone else, that white bread rose over 50 percent and eggs more than doubled
      over fifteen years, that San Francisco housing rose 58 percent in 25 years inflation- adjusted while
      real household income fell 10 percent, and that the Fed pays commercial banks some $12 billion in
      interest - figures he asserts and does not source in the speech. He quotes former Fed Governor Kevin
      Warsh calling easy money a 'reverse Robin Hood effect'. He argues the current GAO audit is futile
      because monetary policy deliberations, open market transactions and foreign central bank agreements are
      excluded, citing Chairman Bernanke declining to tell Representative Alan Grayson which countries
      received $500 billion and declining to answer Senator Bernie Sanders on $2.2 trillion, and the Dodd-
      Frank one-time audit that found $16 trillion lent to domestic and foreign banks. He rejects the claim
      that an audit politicizes the Fed, arguing the GAO is nonpartisan and that Chair Janet Yellen had
      already politicized it with a 2014 speech he says was riddled with Democratic talking points. The
      economic causation, the characterisations of Fed motives and the reading of Yellen's speech are the
      speaker's own and are contested.
