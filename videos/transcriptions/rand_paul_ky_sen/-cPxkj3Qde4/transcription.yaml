    Description: >-
      A single-speaker address arguing that the FBI's decision not to prosecute Hillary Clinton over her
      handling of classified information as Secretary of State means the country now has two sets of laws. The
      speaker says FBI Director James Comey's July 2016 press conference laid out a scathing rundown of
      wrongdoing and then announced no charges, argues that any career civil servant or military officer would
      have lost a security clearance and faced possible firing or criminal charges for the same conduct, and
      cites the ouster of an ambassador for using a private email server, the prosecution of NSA whistleblower
      Thomas Drake, and General David Petraeus's guilty plea as comparisons. He argues Comey changed the
      meaning of the statute by requiring intent to harm when the standard is gross negligence, notes that
      Bill Clinton met Attorney General Loretta Lynch privately three days before the announcement and says
      the appearance is terrible, and concludes that this should preclude Clinton from ever holding high
      office again. Every characterisation here is the speaker's own, made in 2016 while Clinton was a
      candidate, and is contested; Clinton, Comey and Lynch are not present and do not answer it, and no
      charges were ever brought.
