  Video:
    Title: "Damien Patton - 2018 Utah Solutions Summit"
    Description: >-
      Despite appearing on this senator's roster, the senator is not the
      speaker here. The remarks are delivered by Damien Patton, founder of
      the technology company Banjo, at the 2018 Utah Solutions Summit on the
      opioid epidemic, an event the speaker credits to Senator Mike Lee's
      initiative along with Utah Attorney General Sean Reyes and the DEA's
      Brian Besser. Patton opens by describing the sea of school buses from
      districts across the state and the thousands of high school students
      filling the arena that morning, and says the energy changed what he
      intended to say. He explains that a hat bearing the word "instead"
      from the attorney general's office drew him into the event. He
      describes his own background — law enforcement and two tours of
      military duty before Silicon Valley — and says someone close to him
      had to be resuscitated multiple times from opioids before the crisis
      was widely recognised. He says he has moved his company's headquarters
      to Utah, has committed it to a mission of saving human life and
      reducing suffering, and calls on technology leaders to be more
      altruistic, citing Pluralsight One's skills work and programmes at
      Facebook and Microsoft. He closes with an account of meeting a father
      at a barbecue whose son died of an overdose in his twenties, whose
      neighbours and colleagues could not reconcile it with the young man
      they knew, and who asked what someone on opioids is supposed to look
      like — the point being that there is no stereotype. He urges the
      business leaders present not to judge, and tells anyone in the
      audience who needs help that asking for it is the bravest thing they
      can do.
