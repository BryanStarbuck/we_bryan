  Video:
    Title: "Sen. Lee Calls on DOD to Help Family of Lt. Ridge Alkonis"
    Description: >-
      A Senate floor speech in which Senator Mike Lee asks the Department
      of Defense to act on behalf of the family of Lieutenant Ridge
      Alkonis, a Navy officer and Naval Academy graduate imprisoned in
      Japan. Lee recounts that in May 2021, while descending from Mount
      Fuji with his wife Brittany and their three children, Alkonis lost
      consciousness from what Lee describes as a rare and previously
      unknown medical condition, and the resulting crash killed two
      Japanese nationals. Lee expresses sympathy for the victims' families
      and says Alkonis does too, and states plainly that his purpose is
      not to criticise Japan's legal system — which he acknowledges
      differs from the American one and is Japan's own affair — but to
      address how the United States military has handled the case. The
      substance is a narrow statutory question: 37 U.S.C. 503 provides
      that a service member absent without leave forfeits pay and
      allowances unless the absence is excused as unavoidable, and Lee
      argues this is the case that provision exists for. He details the
      timeline of an exception-to-policy request filed in June and moved
      between offices, reaching the Secretary of Defense's office on
      September 3rd, and describes weeks of calls to Navy and Defense
      officials, including three weeks to reach Under Secretary Cisneros
      and three more to reach Secretary Austin, who told him on November
      29th the request would be denied. Lee asks that the decision at
      least be issued formally and publicly so Congress can examine it and
      legislate if necessary, and says it still has not been. He describes
      the family's position: accumulated leave running out within two
      weeks, a wife homeschooling three young children in Japan with no
      income, and a choice between staying without support or returning
      home and losing all contact, since Japanese rules bar even telephone
      calls. He quotes a tweet from Brittany Alkonis that day saying their
      pay and benefits would end in thirteen days. Lee acknowledges the
      Department's size and burdens and thanks officials for their time
      while saying they reached the wrong conclusion in the wrong way,
      ties the case to recruiting and morale problems, and says Congress
      will act if the Department does not. The medical characterisation of
      the crash and the judgement that no criminal act occurred are Lee's
      own account; the Japanese court's findings and the victims' families
      are not represented here.
