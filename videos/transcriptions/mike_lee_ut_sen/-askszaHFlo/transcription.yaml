Transcription:

  Video:
    Title: "Sen. Lee | Judiciary Cmte: The Importance of Parental Notification Laws"
    Description: >-
      Senator Mike Lee's questioning at a Senate Judiciary Committee
      hearing titled "Abortion Bans and Interstate Travel for Care After
      Dobbs." He argues the title is misleading because, he says, no state
      criminalizes or is planning to criminalize travel to obtain an
      abortion in another state, and that the only subject the hearing can
      actually concern is the transportation of minors across state lines
      without parental knowledge or consent. He frames the hearing's
      premise as an attempt to allow that. In support he recounts a
      Project Veritas undercover recording in Missouri in which, he says,
      an investigator posing as an adult sought an abortion for a
      thirteen-year-old girl without her parents' knowledge, and,
      according to court filings he cites, Planned Parenthood employees
      acknowledged it would be illegal in Missouri and offered to help
      transport her to a clinic in Kansas. He quotes a managing director
      saying "we never tell parents anything" and that this was "not their
      first rodeo," and says the director offered a school note with the
      letterhead removed and to arrange transport, lodging and payment. He
      asks a physician witness whether it is ethical to perform an
      elective surgical procedure on a minor without parental consent; she
      answers that it is a bedrock standard that minors cannot give
      informed consent and parental or guardian consent is needed. Lee and
      the witness then discuss the dangers of concealing a procedure from
      parents who could not respond to complications, the possibility that
      the pregnancy indicates statutory rape and abuse requiring child
      protective services and prosecution, and a linked Idaho case in
      which a woman and her adult son were charged after a fifteen-year-
      old was taken to Oregon, the son also charged with rape of a minor.
      Lee closes by asking about Troxel v. Granville and parental rights,
      and the witness answers that parental rights are sacrosanct. The
      account of the recording, the characterisation of other members'
      motives, and the reading of the precedent are Lee's own; Planned
      Parenthood and the individuals described are not present to answer.
