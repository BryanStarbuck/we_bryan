  Video:
    Title: "Why federalism is key to restoring civic connectedness and faith in the American government"
    Description: >-
      An address at the American Enterprise Institute arguing that
      federalism and localism are the route back to civic connectedness. The
      senator opens with a CNBC report paraphrasing Mark Zuckerberg to the
      effect that Facebook can fill a role churches and Little League once
      did, and with Zuckerberg describing two billion monthly users as a
      community. He argues that two billion people cannot be a community in
      any meaningful sense — it was the world's entire population in 1930 —
      because community consists of interpersonal relationships and there is
      a limit to how many of those a person can have. He then presents
      findings from the Joint Economic Committee's Social Capital Project
      and its report "What We Do Together: The State of Associational Life
      in America": births to single mothers rising from 11 percent of all
      births in 1970 to 40 percent in 2015, a majority of American children
      now expected to live with one parent at some point, sharply declining
      religious attendance and trust since the 1970s, falling participation
      in secular associations such as the Boy Scouts and Rotary, and
      increasing segregation by class, citing Charles Murray on affluent
      neighbourhoods and noting the largest cluster of them around
      Washington DC. He argues much of the blame lies with a federal
      government that has intruded on ground once held by civil society,
      citing Bradford Wilcox that almost a third of Americans know someone
      who did not marry for fear of losing a means-tested benefit, and the
      mid-century decline of fraternal societies that had provided
      insurance, health care and companionship. Drawing on Robert Nisbet, he
      argues people who cannot find community close to home seek it in
      political parties and mass movements, which supply belonging cheaply —
      and he applies that to both Make America Great Again hats and pink
      knit hats. He then makes three arguments for localism: that it lowers
      the stakes of political conflict, citing Tocqueville on proximity;
      that it allows states to function as genuine laboratories rather than
      lab rats; and that it restores dignity and self-government. As his
      policy illustration he offers Utah, which he says spends little per
      capita on public welfare yet whose largest population centre has the
      country's highest economic mobility, with 10.8 percent of Salt Lake
      City children born in the bottom quintile reaching the top, a rate he
      compares to Denmark; he attributes this partly to low fiscal capacity
      from federal land policy and partly to tight-knit communities often
      oriented around the Church of Jesus Christ of Latter-day Saints, while
      allowing it may not be easily replicable elsewhere. The statistics,
      attributions and causal claims are his own as delivered.
