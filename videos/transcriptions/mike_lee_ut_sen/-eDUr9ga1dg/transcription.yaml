Transcription:

  Video:
    Title: "Sen. Lee discusses TSA at Commerce hearing"
    Description: >-
      Senator Mike Lee questions a Transportation Security Administration
      witness at a Commerce Committee hearing. He opens on covert testing
      of TSA by the Department of Homeland Security Inspector General
      since 2014, saying the findings revealed alarming rates of failure
      from both human and technology causes, that the most recent testing
      of airport secure areas produced six recommendations, and that as of
      two months earlier all six remained open. The witness says TSA
      concurred with the recommendations, is working to close them, and
      views them as connected to a wider insider-threat problem, offering
      further detail in a different setting. Lee then makes a civil-
      liberties argument: that screening deprives people of privacy and
      liberty and that the overwhelming majority of those stopped and
      inconvenienced are innocent, so whatever is done must work and must
      be minimally invasive. He asks about the timeline for facial
      recognition and, specifically, whether images are used for anything
      beyond identity verification and how long data is retained. The
      witness describes two pilots — one with Customs and Border
      Protection matching travellers against a pre-positioned gallery of
      existing passport photos rather than screening against large data
      sets, and one at McCarran Airport matching a traveller to the photo
      on their own driver's license — and says images are retained only
      long enough to perform the match and for initial auditing. Lee
      closes by asking whether centralizing new officer training at the
      Federal Law Enforcement Training Center produced budget savings; the
      witness says the gain has been consistency of training and cross-
      airport relationships rather than savings.
