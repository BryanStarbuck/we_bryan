  Video:
    Title: "Flavors of Utah 2020"
    Description: >-
      Despite appearing on a senator's roster, this video has essentially
      no political or legislative content: it is a promotional piece for a
      Utah food showcase. Senator Mike Lee introduces the event, which he
      says began as a way to celebrate Pioneer Day in Washington, D.C. by
      serving homemade root beer and grew into an annual showcase of Utah
      food producers known on both ends of the Capitol and in both
      parties. Because of the pandemic, that year's edition was redirected
      into donating gift bags to doctors, nurses and first responders at
      accredited hospitals across the state, and Lee thanks the producers
      and the medical workers. The remainder is a series of short self-
      introductions by Utah business owners describing their products and
      their state: the CEO of Creminelli Fine Meats on Italian charcuterie
      made in Salt Lake City; the owner of a caramel company on using
      local dairy and five ingredients; two representatives of a family
      food business in Richmond describing the Cache Valley and a sense of
      community during COVID-19; the head of a fourth-generation saltwater
      taffy company; the president of the Utah Food Industry Association
      on why the group chose to participate rather than skip the year; and
      the president of Zions Bank, who also sits on a hospital system
      board, thanking caregivers. Note that the automatic transcription
      renders the event name as "Laborers of Utah," which does not match
      the video's own title.
