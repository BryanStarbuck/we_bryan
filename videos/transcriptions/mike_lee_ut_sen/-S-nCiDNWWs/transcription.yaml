Transcription:

  Video:
    Title: "Sen. Mike Lee Speaks in Support of S.J.Res 54: The Yemen War Powers Act"
    Description: >-
      A Senate floor speech supporting the discharge motion on S.J.Res. 54,
      which would remove United States armed forces from the Saudi-led war
      in Yemen. The senator recalls filing the motion in March of that year
      with Senators Sanders and Murphy, and that the Senate tabled it after
      the Foreign Relations chairman, Senator Corker, asked for time and
      committed to bring forward legislation; eight months on, he says, a
      hearing was held and a separate bill introduced but nothing further
      has happened. He argues Article I, Section 8 places the power to
      declare war with Congress alone, citing Federalist 69 and the
      founders' concern about power concentrated in few hands, and argues
      the 1973 War Powers Act does not authorise this involvement because
      Yemen poses no threat to American safety and the emergency time limits
      have long since passed. He describes the support provided as mid-air
      refuelling, surveillance, reconnaissance and target selection
      assistance, and quotes Defence Secretary Mattis in December 2017
      saying the US was helping the Saudis make certain they hit the right
      thing, arguing that this plainly constitutes hostilities. He cites
      more than 10,000 civilians killed and 40,000 wounded since 2015, a
      bomb dropped on a school bus that killed 40 boys and wounded 56 more,
      15 million people without clean water and sanitation and 17 million
      without food, and a 2016 State Department terrorism report finding the
      conflict helped al-Qaeda in the Arabian Peninsula and the ISIS branch
      in Yemen expand. He says intelligence suggests the Saudi Crown Prince
      himself ordered the murder of Jamal Khashoggi despite repeated
      denials, and concludes the intervention is unauthorised,
      unconstitutional and immoral. The figures, the constitutional reading
      and the attribution to the Crown Prince are as delivered on the floor.
