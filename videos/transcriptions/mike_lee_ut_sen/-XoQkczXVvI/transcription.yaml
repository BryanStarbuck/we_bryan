Transcription:

  Video:
    Title: "Remarks on the The Bipartisan Budget Act of 2015"
    Description: >-
      A Senate floor speech by Senator Mike Lee opposing the Bipartisan
      Budget Act of 2015. His objection is as much to process as to
      substance: he calls the bill the product of an unfair and
      undemocratic process of closed-door negotiation and rushed passage
      without amendments, and says this is exactly what a Republican
      Congress had promised to end. On substance he says the bill suspends
      the debt limit for seventeen months and raises spending without
      reforms toward fiscal sustainability. He then takes apart the claim
      that it rescues the Social Security Disability Insurance trust fund
      from insolvency, which the trustees then projected for 2016 with
      roughly a 20 percent across-the-board benefit cut. He says the bill
      pushes that deadline to 2022 by transferring $150 billion from the
      retirement trust fund, which he characterises as solving the
      disability program's insolvency by raiding the larger retirement
      program, and describes other offsets drawing on the Crime Victims
      Fund and the Asset Forfeiture Fund, plus Medicaid reimbursement
      provisions he calls price controls on generic drugs. He credits two
      genuine reforms — closing a Social Security design loophole he says
      would save significantly over a 75-year window, and increased fraud
      penalties, pilot programs and a bar on felon doctors submitting
      medical evidence — while saying they fall far short. He lists
      alternative proposals from colleagues, including Coats on fugitive
      felons receiving benefits and Hatch on simultaneous receipt of
      unemployment and disability insurance, and his own to expand private
      disability insurance. He closes on what his party should be — the
      party of ideas, reform and fiscal responsibility — and says it
      cannot be while amendments are blocked and Congress governs by
      crisis and cliff. The characterisations of the offsets as gimmicks
      are his own.
