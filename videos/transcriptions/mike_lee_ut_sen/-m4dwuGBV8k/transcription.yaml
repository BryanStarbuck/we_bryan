Transcription:

  Video:
    Title: "Sen. Mike Lee Debates the FORMULA Act."
    Description: >-
      An extended Senate floor exchange in which the senator seeks unanimous
      consent to pass his FORMULA Act, S. 4261, during the 2022 infant
      formula shortage, and Senator Casey of Pennsylvania objects four
      times. The senator describes parents scouring shops and online sellers
      and some infants being hospitalised for want of formula, and says the
      national out-of-stock rate rose from 43 percent to 73 percent in May
      alone and reached 88.9 percent in Utah, the state with the highest
      birth rate. His bill has three parts: suspending for six months the
      tariff on imported formula, which he puts at at least 17.5 percent and
      up to roughly 35 percent; temporarily allowing imports from countries
      whose regulators are comparable to the FDA and from which the US
      already imports pharmaceuticals; and allowing WIC recipients to buy
      whatever brand is in stock rather than only the brand named on the
      voucher. He argues the personal importation of formula is already
      lawful, so the bill makes it affordable rather than legal, and notes
      his bill retains the FDA's recall authority. Senator Casey objects,
      saying the shortage began with a recall that followed as many as nine
      infant deaths from contaminated formula, citing FDA adverse-event
      records from 2016, 2017 and 2019 involving foreign formula and the
      American Academy of Pediatrics' longstanding warnings against imported
      European formula, and pointing to Operation Fly Formula's 32 flights
      and 19 million eight-ounce bottle equivalents plus about 220 million
      more admitted through enforcement discretion, as well as use of the
      Defense Production Act. He argues bipartisan committee work is the
      better route and that safety standards cannot be compromised. The
      senator from Utah replies that about 13 million bottles is a day and a
      half against a nine-million-bottle daily average, that the adverse
      events cited reflect symptoms common when infants switch formula
      rather than defects in the product, and that an FDA investigation
      traced the contamination to bottled water the parents mixed with the
      formula rather than to the formula itself. He then modifies his
      request three times — dropping the FDA regulatory waiver, then
      dropping the WIC provision, then shortening the tariff suspension from
      180 days to 90, matching the administration's proposed gas tax holiday
      — and Casey objects each time, the last two on the narrower ground
      that the Democratic side has not yet reviewed the amendments. The two
      men directly contradict each other on what caused the contamination
      and on what the adverse-event reports show; both accounts are as
      delivered on the floor and neither is resolved in the exchange.
