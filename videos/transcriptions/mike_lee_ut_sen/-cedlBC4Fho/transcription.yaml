Transcription:

  Video:
    Title: "Sen. Lee questions ATF Director Nominee Canterbury"
    Description: >-
      A Senate Judiciary Committee hearing in two parts. The senator first
      apologises for missing the opening statements because of a competing
      hearing, notes that Judiciary is his favourite committee, and delivers
      on Senator Paul's behalf a statement introducing Justin Walker of
      Kentucky for a federal district judgeship, adding his own endorsement
      of several years' acquaintance. He argues that while trial and
      deposition experience is the more obvious qualification, writing
      experience is just as important and rarer, because the hardest part of
      a district judge's work is disposing of motions to dismiss under Rule
      12(b)(6) and for summary judgment under Rule 56 — skills he says
      cannot simply be taught or acquired on the job. He then questions ATF
      director nominee Chuck Canterbury about a 2013 piece Canterbury wrote
      in the Fraternal Order of Police Journal noting the FOP's standing
      1993 resolution supporting the 1994 assault weapons ban, and asks
      whether he personally supports such a ban. Canterbury answers that the
      delegates overturned that standing rule at the last national
      conference, that as an FOP advocate his position has been to represent
      what the members voted, and that as ATF director his job would be to
      enforce the laws Congress passes. Asked in turn about magazine size
      limits, universal background checks and waiting periods, he gives
      organisational positions, says he would need to see exact legislative
      language, and emphasises getting accurate information into the NICS
      system. The senator presses on whether the nominee holds any position
      analytically distinct from the FOP's, noting that an ATF director
      wields enormous discretion to promulgate and change regulations that
      effectively change the law. Canterbury says he would have personal
      opinions from his experience but would work through ATF career staff
      and the Department of Justice policy process, and states he is a
      strong supporter of the Second Amendment. The senator notes his time
      has expired and reserves further questions for a second round.
