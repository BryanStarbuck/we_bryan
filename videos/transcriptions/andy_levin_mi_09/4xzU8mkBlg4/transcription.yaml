  Video:
    Title: "Rep. Andy Levin Speaks on House Floor about his PFAS Action Act Amendment"
    Description: >-
      House floor debate from January 2020 on the speaker's amendment to H.R. 535, the PFAS Action Act (per
      the title and transcript). The amendment would require the EPA to report to Congress within five years
      on PFAS cleanup: sites to be remediated, chemicals present, and differences between federal and
      non-federal sites. He also highlights his PFAS Safe Disposal Act, co-sponsored with Rep. Khanna, which
      prohibits unsafe incineration of PFAS. He asserts that industry studies showed adverse health effects as
      early as 1950, that the EPA has recognized the risks since at least 1995 yet still allows new PFAS
      chemicals onto the market, and he calls this decades of EPA failure; those characterizations are his. A
      member from Illinois claims time in opposition and reserves without arguing, and Speaker Nancy Pelosi is
      yielded one minute and briefly praises the amendment. Diarization splits the exchange into seven
      clusters, and the chair's and the members' lines are mixed across them.
