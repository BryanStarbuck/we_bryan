  Video:
    Title: "#PassTheProAct Part 1"
    Description: >-
      Part 1 of a March 2021 livestream from Rep. Andy Levin's channel, recorded while the House debated the
      Protecting the Right to Organize (PRO) Act. The host says he has just come from the floor rebutting what
      he calls 'ridiculous Republican amendments' meant to undermine the bill, then interviews a guest he
      introduces as Tom Lutz, Executive Secretary-Treasurer of the Michigan Regional Council of Carpenters.
      They discuss the ban on secondary boycotts and picketing, which the host traces to a 1947 law passed
      over President Truman's veto and calls a throwaway to corporate bosses. They also discuss
      misclassification of construction workers as independent contractors, which the guest says is used to
      avoid unemployment insurance, workers' compensation and Social Security contributions. The host says the
      bill's ABC test would solve that. Both argue the bill restores good jobs and helps good employers
      compete with bad ones; these are advocates' characterizations of contested labor legislation, and no
      opponent speaks. Diarization returned 22 clusters for what sounds like two voices, and neither speaker
      self-identifies.
