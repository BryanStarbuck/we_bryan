    Title: "Rep. Andy Levin on Countering a Resurgent Russia"
    Description: >-
      Rep. Andy Levin's questioning at a House Foreign Affairs hearing on countering Russia, posted May 2019.
      Citing Brookings fellow Alina Polyakova, he asks the panel about Russian interference in Ukraine's
      elections. A witness he addresses as Ms. Nuland (rendered 'Newland' by the ASR) says Russia's playbook
      in Ukraine was backing favored candidates and oligarchs rather than voter influence campaigns, and that
      Zelensky's large margin swamped any manipulation. A witness also says Zelensky must prove his
      anti-corruption promises because he has done business with oligarchic figures, and that U.S. aid should
      be tied to reform; that is the witness's characterization. Witnesses discuss oligarchic ownership of
      media, support for independent journalism, and Russian pressure around the Kerch Strait (mangled by the
      ASR). Levin then quotes a New York Times report that Mick Mulvaney told Kirstjen Nielsen not to raise
      Russian election interference with President Trump, and asks whether the U.S. stays vulnerable until the
      president acknowledges it. Witnesses answer that presidential leadership is critical and can be
      separated from the partisan dispute over the Mueller report. The claims about the White House are the
      Times's, as he quotes them. Diarization returned 12 clusters and none self-identifies.
