  Video:
    Title: "CNN: Rep. Andy Levin Discusses Iran"
    Description: >-
      A CNN interview from June 2019, after Iran shot down a U.S. drone, in which the anchor (addressed as
      'Aaron' in the ASR) questions Rep. Andy Levin of the House Foreign Affairs Committee. Levin says he has
      not yet had a classified briefing on where the drone was. The segment plays President Trump saying he
      believes someone under Iran's command made a mistake that he finds hard to believe was intentional. The
      anchor contrasts Iran's published coordinates, placing the drone inside Iranian airspace, with the
      Pentagon's, placing it in international waters, and says Iran's response shows it was not a mistake.
      Levin argues the U.S. should stop escalating, that the president has no congressional authorization for
      war with Iran (he cites his AUMF Clarification Act), and that withdrawing from the nuclear agreement and
      what he calls ratcheting by Bolton and Pompeo brought things to this point. Those are his
      characterizations and were contested by the administration. He says intelligence briefers have been more
      factual with Congress than civilian Pentagon and State Department leadership. Diarization fragments the
      three voices and the Trump clip into 17 clusters, and none is self-identified.
