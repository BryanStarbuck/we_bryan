  Video:
    Title: "Reps. AOC, Lee, and Paris Hilton Host Press Conference Calling for House Passage of DEFIANCE Act"
    Description: >-
      A Capitol press conference, posted January 2026, calling for House passage of the DEFIANCE Act, which
      would give victims of non-consensual sexually explicit deepfakes a federal civil right of action; the
      speakers say it had just passed the Senate by unanimous consent. The first several minutes are informal
      chatter before the event starts. Rep. Ocasio-Cortez, the House co-lead, says over 90% of AI deepfake
      images are non-consensual pornography and 90% of those target women, describes being targeted herself,
      and urges Speaker Johnson to schedule a vote. Those figures are hers and no source is given. Co-lead
      Rep. Laurel Lee describes the bill's civil remedy, statute of limitations and privacy protections. Paris
      Hilton says an intimate video of her was shared without consent when she was 19, and puts the number of
      explicit AI deepfakes of her at over 100,000. Francesca Manny, 17, says she was targeted at her New
      Jersey high school at 14 and cites damages up to $250,000 and a 10-year statute of limitations; her
      mother also speaks. In Q&A a reporter raises First Amendment concerns attributed to Judiciary Chairman
      Jim Jordan; Lee says they were addressed and that the bill targets individuals, not tech platforms, and
      leaves Section 230 alone. All speakers are advocates for the bill and no opponent speaks. Diarization
      returned 121 clusters for roughly six voices plus reporters; two speakers self-identify.
