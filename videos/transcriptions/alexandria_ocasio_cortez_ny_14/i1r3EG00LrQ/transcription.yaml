Transcription:

  Video:
    Title: "Homes Act Press Conference"
    Description: >-
      An outdoor Washington press conference, posted September 2024, introducing the HOMES Act, co-led by
      Senator Tina Smith of Minnesota and Rep. Ocasio-Cortez. The opening minutes are pre-event chatter and
      crowd chants ('Housing is a human right', 'the rent is too damn high', 'landlord greed has got to go',
      which the ASR renders as 'Landlord Greedo'); one 16-second chunk was rejected by the transcriber as a
      repetition loop. Smith argues the private market cannot meet the housing crisis, blames underinvestment,
      restrictive zoning and private equity buying starter homes, and praises the Harris-Walz housing plans.
      She describes the bill as a public option that finances permanently affordable social housing, built by
      union labor through local governments, land trusts and nonprofits. Ocasio-Cortez recounts her parents
      buying a Parkchester apartment for $45,000 and her family nearly losing its home to foreclosure after
      her father's death. She says the bill would invest $300 billion over its first decade in more than 1
      million units, over 850,000 of them for low and extremely low income families, and create over 150,000
      union construction jobs a year; she cites FDR's New Deal housing authority as precedent. Her figures on
      minimum-wage hours, rent burden and all-cash purchases are her own and unsourced in the clip. Rep.
      Ayanna Pressley later puts the bill at 1.25 million units and 400,000 jobs, and calls the crisis
      man-made. Noah Hobbs of One Roof Community Housing in Duluth, Makia Griffin of the Rondo Community Land
      Trust in St. Paul, and Co-op City resident Aisha Hernandez Ahmed also speak in support. All speakers are
      advocates for the bill, no opponent speaks, and the crowd resumes chanting at the end. Diarization
      returned 111 clusters.
