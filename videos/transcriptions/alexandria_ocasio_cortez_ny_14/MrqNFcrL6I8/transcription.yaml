    Title: "Antisemitism and the Fight for Democracy"
    Description: >-
      A June 2024 livestream titled 'Antisemitism and the Fight for Democracy', hosted by a speaker the guests
      address as 'Congresswoman' (the video is from Rep. Ocasio-Cortez's channel). She interviews Stacy
      Burdett, introduced as a former senior Anti-Defamation League staffer and former director at the U.S.
      Holocaust Memorial Museum, and Amy Spitalnik, introduced as CEO of the Jewish Council for Public
      Affairs. The host argues that antisemitism is real and rising, that criticism of the Israeli government
      or of Zionism is not inherently antisemitic, and that bad-faith political actors weaponize false
      accusations of antisemitism against women of color. That last point is her own characterization. Burdett
      describes antisemitism as a conspiracy theory that blames Jews for society's ills, citing the Pittsburgh
      synagogue shooter's motives. Spitalnik describes antisemitism on the right, including replacement
      rhetoric she says runs 'from Trump on down', and antisemitism in progressive spaces since October 7,
      such as celebrating the attack and excluding Zionists. She cites polls that about 90% of American Jews
      have a relationship with Israel, and says she and Burdett received abusive messages over this event. The
      host notes the three hold different positions on the Gaza war, and they close on allyship across
      disagreement. No critic of the panel's views takes part. Diarization returned 26 clusters and none
      self-identifies.
