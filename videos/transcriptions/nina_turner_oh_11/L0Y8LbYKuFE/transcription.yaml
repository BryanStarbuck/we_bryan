Transcription:

  Video:
    Title: "Let's Resist with Jennifer Farmer"
    Description: >-
      An episode of Nina Turner's podcast 'Hello Somebody' with the
      communications strategist and author Jennifer Farmer, introduced as
      the PR whisperer and host of the podcast The First and Only, joined by
      Turner's special advisor J3. The conversation is built around Farmer's
      forthcoming book, also called The First and Only, which Turner
      describes as a love letter to Black women. Much of the episode is the
      story of their own relationship: they first met in the Ohio Senate,
      where Turner was a state senator and Farmer was deputy chief of staff,
      and they work through the arithmetic of how long ago that was,
      settling amiably on nineteen years. They discuss Farmer's career arc
      across two stints in the Senate, her decision to start her own firm,
      Spotlight PR, and her earlier book on doing public relations on a
      budget for small businesses and individuals who cannot afford a
      specialist. The tone is warm and mutual throughout, ending on an
      exchange of affection and the show's Patreon and credits. It is a
      career and craft interview with a strong personal register rather than
      a policy or campaign discussion.
    URL: "https://www.youtube.com/watch?v=L0Y8LbYKuFE"
