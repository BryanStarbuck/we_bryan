  Video:
    Title: "Let’s Get Substance For Our Sole"
    Description: >-
      An episode of Nina Turner's podcast 'Hello Somebody' in which she
      interviews the independent hip-hop artist Famous, born Robin Lee
      Dorsey Jr., of Jamaica, Queens and currently living in Queensbridge.
      Turner opens by inviting listeners to a Patreon Ask Me Anything, then
      takes the conversation through the meaning of his stage name — Famous
      is the meaning of Robin — his upbringing in Queens, his vocation as a
      rapper and his life as a father and independent artist. The episode is
      a cultural and personal interview rather than a policy discussion: it
      is about an artist's craft, faith, family and the choice to stay
      independent. It closes with a surprise performance of an original
      verse written for Turner, built around unity, resisting hatred and an
      acrostic on her name, ending on the show's sign-off that we will not
      be neutral. Politics enters only as encouragement and framing, not as
      argument about candidates or legislation.
