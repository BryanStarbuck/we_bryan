Transcription:

  Video:
    Title: "BATTLE FATIGUE"
    Description: >-
      A guest-takeover episode posted on Nina Turner's 'Hello Somebody'
      feed: an entire episode of the podcast 'Battle Fatigue', hosted by
      Daylin, a writer, activist and voice actor from Seattle, and AJ, who
      describes himself as a historical scavenger hunter and systems
      agitator. They thank Senator Turner for lending them the feed and
      state their show's premise, that there is no wrong way to be Black.
      The episode has two halves. The first is a personal tribute to
      Chadwick Boseman, with both hosts recounting in detail where they were
      and how they learned of his death at 43, the texts they exchanged, and
      what Black Panther meant to their friendship. The second is an
      extended discussion of the HBO series Lovecraft Country, which they
      use to talk about what happens when Black creators are given large
      budgets, and a rambling, comic conversation about love and
      relationships. Nina Turner is not the speaker here beyond the framing;
      this is cultural commentary and personal storytelling rather than
      political content, and the roster priority that selected it does not
      describe what is in it.
    URL: "https://www.youtube.com/watch?v=DdJRY8TPBSQ"
