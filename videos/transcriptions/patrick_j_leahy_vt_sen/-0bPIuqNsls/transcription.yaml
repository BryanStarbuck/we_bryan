    Title: "Sen. Patrick Leahy Speaks at Mines Advisory Group's 25th Anniversary."
    Description: >-
      Senator Patrick Leahy speaks at the Mines Advisory Group's 25th anniversary about
      landmine clearance and the Leahy War Victims Fund. He recounts visiting minefields
      with his wife, a registered nurse, and tells at length of a legless man in southern
      Vietnam who stared at him throughout an introduction and whom he then lifted into a
      wheelchair himself. He notes the Leahy Law bars exporting landmines from the United
      States and that a resolution on it drew all 100 senators, but that the U.S. still
      has not signed the landmine treaty under either President Bush or President Obama —
      he says he has pressed both. His argument is asymmetry: mines can be laid in
      seconds and take weeks to lift, and "there are no happy endings when you're facing
      a landmine." He leaves for a roll call vote.
