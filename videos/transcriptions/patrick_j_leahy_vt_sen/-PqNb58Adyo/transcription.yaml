      Cuban private entrepreneurs — cuentapropistas — speak at a Washington event about
      how the 2014-16 loosening of U.S. policy affected them. The main speaker recounts
      obtaining visas so relatives who left Cuba in 1968 could be reunited with family in
      Miami for the first time, and says her ten-year-old daughter cannot make sense of
      talk of distance and walls. She says increased flights, more American travellers
      and easier commerce made their businesses grow, and appeals directly to
      President-elect Donald Trump not to reverse the opening: "No nos den la espalda" —
