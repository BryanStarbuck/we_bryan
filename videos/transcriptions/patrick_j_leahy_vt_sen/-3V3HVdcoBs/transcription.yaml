    Title: "Leahy: The Costly Effects Of A Government Shutdown"
    Description: >-
      A Senate floor speech by Senator Patrick Leahy during the October 2013 government
      shutdown. He says Vermonters are angry, that the Senate passed a budget and a
      continuing resolution, and blames "a small group of Republicans" in the House for
      refusing anything short of everything they want — his characterisation, and the
      House members he refers to are not present to answer it. He reports that the
      Director of the National Security Agency told the Judiciary Committee that morning
      that the jeopardy to national security grows with each day of shutdown. He names
      SNAP, which he says supports 100,000 Vermonters, and Head Start for another 1,600
      children and families, rejects an agency-by-agency reopening, and calls for going
      to conference on appropriations in regular order: "we're elected to make decisions
      here, not to do slogans."
