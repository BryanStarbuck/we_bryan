  Video:
    Title: "Rep. Walter Jones Talks about Wasteful Spending in Afghanistan"
    Description: >-
      A House floor speech by Representative Walter Jones of North Carolina
      on waste in U.S. spending in Afghanistan, posted to Thomas Massie's
      channel. Jones reads at length from a World Affairs Journal article
      titled 'Money Pit: The Monstrous Failure of USAID to Afghanistan',
      quoting the Special Inspector General for Afghan Reconstruction that
      roughly $100 billion in non-military funds had been appropriated since
      2002 with a further $16.5 billion for reconstruction, and arguing this
      has produced no sustainable institution or program. He cites fuel
      supplied to the Afghan military without any determination of how much
      was actually needed, and a shower and bathroom facility built without
      plumbing holes and with crumbling cinder blocks. The figures and
      characterisations are quoted from that article and from the Inspector
      General's reports rather than independently established here. His
      procedural point is that the Afghan parliament was allowed to vote on
      the bilateral strategic agreement while the House has not debated it,
      and he notes a bipartisan letter he signed with Congressman Jim
      McGovern asking leadership for that debate. He closes asking a
      blessing on service members and their families.
