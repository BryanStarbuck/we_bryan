Transcription:

  Video:
    Title: "Rep. Massie: If E-Verify Is Fast and Accurate, Shouldn't It Be Used for Federal Welfare Benefits?"
    Description: >-
      A markup exchange in which Representative Thomas Massie offers, argues
      for, and then withdraws an amendment to the E-Verify portion of an
      immigration bill. His amendment would bar federal benefits to a person
      whose work authorization has not been confirmed through E-Verify, on
      the argument that it should not be harder to get a job than to get
      welfare. He grounds it in pandemic stimulus payments, saying thousands
      went to foreign nationals not in the country, and recounts a personal
      acquaintance in Norway — by his account not resident in the United
      States for forty years and holding no green card — who received
      $1,200, $600 and $1,400 payments totalling $3,200, and says he was
      fact-checked after raising it. That account is his own and is not
      independently established in the exchange. His point is that
      colleagues describing E-Verify as instant and accurate should be
      willing to use it for benefits, and he says he doubts those claims
      himself. He withdraws the amendment, joking about losing Democratic
      support, but gives the real reason as the parliamentarian's ruling
      that it is not germane to the underlying bill. A colleague offers to
      co-sponsor it as a standalone bill and says he is glad Massie now
      acknowledges E-Verify is workable; Massie reclaims his time to say he
      only repeated what was claimed about it.
    URL: "https://www.youtube.com/watch?v=-V7Ywp5iFeM"
