Transcription:

  Video:
    Title: "Congressman Thomas Massie On Supporting Airport Infrastructure: 3/23/23"
    Description: >-
      Representative Thomas Massie's five minutes of questioning at a March
      2023 hearing on airport infrastructure. He asks an airport executive
      to lay out airports' revenue sources beyond federal Airport
      Improvement Program grants, and the witness describes AIP, passenger
      facility charges and retained airport revenue totalling roughly $13
      billion a year against a stated $30 billion annual infrastructure
      need, with the PFC losing value to inflation since it was set at $3 in
      1990 and raised to $4.50 a decade later. Massie draws the distinction
      that a passenger facility charge is a genuine user fee rather than a
      tax euphemism, because the money goes from the user to the airport and
      never into federal coffers, and asks what airports would do with a
      higher cap. The witness explains PFCs give flexibility for terminal
      and landside work that AIP does not fund, reduces debt and costs
      passed to carriers, and cites differing needs in New Orleans, St.
      Louis and San Antonio. Massie then asks a second witness whether
      reported near misses on takeoff and landing are actually increasing;
      the witness says the incidents are troubling and attributes the added
      risk to controller staffing shortages, six-day weeks and ten-hour
      days, with NTSB investigations under way.
