  Video:
    Title: 'Rep. Massie: "Biden is Committing Violence on the American People" with Vaccine Mandate 11-10-21'
    Description: >-
      A November 2021 cable interview between host Stephanie Hamill and
      Representative Thomas Massie about COVID-19 vaccine mandates and
      speech about vaccines. The segment opens with a clip of Pfizer's CEO
      saying professionals who deliberately circulate misinformation are
      criminals; the host questions how misinformation would be defined and
      criticises a Pfizer social media post. Massie argues that claims he
      regards as supported — natural immunity after infection, waning
      protection, vaccinated people transmitting the virus — risk being
      labelled misinformation, and asks whether stating them would make him
      a criminal. He says Congress gave CDC a billion dollars to promote the
      vaccine, raises a former FDA director sitting on Pfizer's board, and
      says FOIA-obtained emails show CDC changed its definition of
      vaccination shortly before the mandate was announced. The strongest
      language in the segment is his: he says President Biden is committing
      violence on the American people, calls the mandate tyranny and the act
      of a dictator, and says believing a president can mandate a medical
      treatment is morally bankrupt and constitutionally illiterate. Every
      one of those claims and characterisations is his own, sharply
      contested, and made with no one present to answer them. He also
      discusses childhood vaccination messaging and myocarditis risk in the
      young, his lawsuit with Marjorie Taylor Greene and Ralph Norman over
      House floor mask fines, and religious exemptions under the 1993
      Religious Freedom Restoration Act. The host's framing is sympathetic
      throughout; this is an opinion interview, not an adversarial one.
