Transcription:

  Video:
    Title: "Rep. Massie to DHS Secretary Mayorkas: Is it Illegal to Undermine Trust in U.S. Government? 7/26/23"
    Description: >-
      A committee exchange in which Representative Thomas Massie questions
      Homeland Security Secretary Alejandro Mayorkas about a February
      National Terrorism Advisory System bulletin that cited an online
      environment filled with mis-, dis- and malinformation. Massie asks him
      to define malinformation and puts it to him that the term describes
      true information inconvenient to government narratives — a
      characterisation Mayorkas rejects. Massie then presses repeatedly on
      whether it is illegal to undermine public trust in U.S. government
      institutions, suggesting that pointing out failures is itself healthy.
      Mayorkas answers each time that the Department is ideology-neutral,
      embraces First Amendment protections, has a statutory Office for Civil
      Rights and Civil Liberties, and becomes involved only where there is
      connectivity to violence. Massie asks whether specific COVID-19 claims
      — natural immunity, vaccines not stopping transmission, mask
      ineffectiveness, a lab leak — were the false narratives meant, and
      asks for one example of a narrative that inspired a violent attack.
      Mayorkas offers the claim that COVID-19 is caused by 5G towers and a
      resulting attack on a cell tower. Massie calls that ridiculous and
      yields back; the chair does not allow Mayorkas a closing answer. Both
      men's characterisations are their own and the exchange is adversarial
      throughout.
