  Video:
    Title: "AG Ellison testifying at the House Subcommittee on Immigration field hearing in Minnesota"
    Description: >-
      Roughly four minutes of opening testimony by Minnesota Attorney General
      Keith
      Ellison at a House Subcommittee on Immigration field hearing held in
      Minnesota.
      He thanks Congresswoman Jayapal and the visiting members for attending,
      then
      argues that the Trump administration's deployment of federal immigration
      agents
      to Minnesota and the Twin Cities — which he refers to as Operation Metro
      Surge —
      is not about public safety, fraud or immigration enforcement. His stated
      reason
      is vindictiveness over an election result: he says Trump believes he won
      the
      state three times and did not win it, and Ellison is explicit that he is
      quoting
      Trump rather than characterising him. He lists what he says has followed:
      over
      3,000 agents surged, attacks on high schools, warrantless searches,
      killings and
      shootings, reduced economic activity, children kept from school, and
      increased
      overtime costs for the cities. He then explains the lawsuit he has brought
      jointly with Minneapolis and St. Paul, drawing a distinction he says
      matters:
      they are not suing because ICE is present in Minnesota — ICE was there
      last year
      and ten years ago without a suit — but over this particular activity,
      which he
      calls unjustified, unconstitutional, an interference with state
      sovereignty, and
      a violation of the Administrative Procedure Act as arbitrary and
      capricious. He
      defends local law enforcement as maintaining order and says any breakdown
      is
      caused exclusively by the federal surge, adding that with the Insurrection
      Act
      under contemplation what Minnesota needs from federal authorities is for
      them to
      stop. He closes by naming the family of Renee Nicole Good and others he
      says
      have been thrown to the ground, beaten, harassed or subjected to
      warrantless
      searches. Every factual and causal claim above is Ellison's own testimony
      as a
      litigant in the case he describes; the administration's position is not
      put
      here, and the allegations he makes are contested and unadjudicated.
