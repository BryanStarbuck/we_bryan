      overtime,
      breaks, minimum wage, final wages, tips or off-the-clock work, plus
      unauthorised
      deductions and misclassification). The stated reason for the programme is
      to let
      workers report labour conditions without fear of deportation or
      retaliation by
      an employer. It closes by directing viewers to a trusted advocate, an
      immigration
      lawyer or a government investigator, and gives the Minnesota Attorney
      General's
      office phone number and website. This is explanatory outreach about an
      existing
      federal programme rather than argument or advocacy; the description of the
      programme is the AG office's own.
