Transcription:

  Video:
    Title: "#1 Affording Insulin w: Nicole Smith Holt"
    Description: >-
      The first episode of 'Affording Your Life', a podcast hosted by Minnesota
      Attorney General Keith Ellison, with guest Nicole Smith-Holt on the cost
      of
      insulin. Ellison opens with a disclaimer that the show is consumer
      information
      and not legal advice. The bulk of the episode is Smith-Holt's account of
      her son
      Alec: diagnosed with type 1 diabetes in 2015 at 24, able to afford insulin
      at
      roughly $300 a month out of pocket while on her insurance; aged off that
      plan at
      26 in 2017; and unable to afford a marketplace replacement at about $450 a
      month
      with a $7,600 deductible. She says he chose to pay cash, miscalculated,
      and was
      told at the pharmacy that a month's insulin and supplies would cost $1,300
      when
      he had about $1,000. He left without the medication and began rationing —
      which
      she says roughly a quarter of type 1 diabetics have done — and was found
      dead
      five days later of diabetic ketoacidosis. Asked why he did not call for
      help, she
      explains that the brain is among the first organs affected, causing
      confusion and
      disorientation. She then tells Ellison a second Minnesotan, a 21-year-old
      working
      two jobs, had just been found dead the same way. The conversation turns to
      the
      history and the industry: the discovery of insulin, the inventors' refusal
      to
      take a patent in their names, the one Canadian dollar each they accepted,
      and the
      wards where children once waited to die. She says the University of
      Toronto
      lacked the capacity to mass-produce it, Eli Lilly stepped in, and that
      since
      Humalog's 1996 introduction its price has risen 1,200 per cent with no
      change to
      the formula and no R&D justification. She describes buying, on an advocacy
      caravan to Canada, the same Eli Lilly vial that costs about $340 in the US
      for
      under $30, and says the group spent roughly $2,000 to save about $20,000.
      She
      notes that three companies — Eli Lilly, Novo Nordisk and Sanofi — sell
      about 96
      per cent of the world's insulin and have raised prices in lockstep.
      Ellison
      responds in his official capacity, saying he has a responsibility to
      prevent
      anti-competitive practices such as illegal price fixing, that his office
      is suing
      generic drug manufacturers and has filed one insulin lawsuit, and that
      Smith-Holt
      co-chairs his drug pricing task force alongside Senator Jensen. They
      discuss the
      Alec Smith Emergency Insulin Act, which she describes as a safety net
      providing a
      three-month emergency supply rather than a price fix, and which died in
      the final
      minutes of a special session; she states as her personal opinion that Novo
      Nordisk lobbying swayed the votes. She closes saying the campaign
      regrouped,
      doubled in size and will not stop. IMPORTANT: the claims about
      pharmaceutical
      company conduct, pricing motives and the cause of the bill's failure are
      the
      speakers' own — Smith-Holt is a bereaved parent and an advocate, Ellison
      is a
      litigant against these companies, and the named companies do not appear
      here to
      answer. The lawsuits described are allegations that had not been
      adjudicated.
    URL: "https://www.youtube.com/watch?v=1K-tLrM0-oY"
