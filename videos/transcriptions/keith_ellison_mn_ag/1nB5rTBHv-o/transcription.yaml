  Video:
    Title: "8.18.25: How to spot text message scams with Parker"
    Description: >-
      A 2.5-minute consumer-protection explainer from the Minnesota Attorney
      General's
      office. The speaker introduces himself as Parker Mertz, manager of the
      Consumer
      Action Division, and walks through one real scam text message to show how
      to
      spot the tells. The message claimed to come from Apple about a transaction
      on
      the recipient's account, and he notes it was well constructed: it carried
      an
      Apple ID case number, a date and time for the supposedly illicit
      transaction,
      and a phone number and link that both looked official. He makes the point
      that
      awkward wording used to be the giveaway but that, with AI now in everyday
      use,
      nothing in the language of this one stood out — he had to go to Apple's
      own
      website to establish that the link was not affiliated with Apple and that
      the
      phone number was not Apple's published customer-service line and had been
      flagged on scam-reporting sites. His advice is to click no links and call
      no
      numbers from such a message, to go directly to the Apple website and check
      the
      account there, and, if information or payment has already been given out,
      to
      report it to the Internet Crime Complaint Center at ic3.gov, which he
      describes
      as affiliated with the FBI and other law-enforcement agencies. He closes
      with
      the Minnesota Attorney General's office phone number, saying a live person
      will
      answer. This is practical consumer guidance rather than political
      argument.
