  Video:
    Title: "Protect the Minnesota Dream Act"
    Description: >-
      A 2.5-minute direct-to-camera message from Keith Ellison, who identifies
      himself
      as Minnesota Attorney General, about his office's defence of the Minnesota
      Dream
      Act. He describes the law as allowing a person who attended Minnesota
      schools
      for years, and who came to the country as a child because their parents
      brought
      them, to attend a Minnesota college at in-state tuition — adding that
      anyone who
      moves to Minnesota and makes it their home can do the same. He says the
      federal
      government is suing Minnesota over the law and, in his characterisation,
      is
      'falsely accusing us of discrimination'; that framing is his own and the
      federal
      case is not represented here. The second half of the video is Ellison
      reading
      thank-you cards sent to his office by students affected by the law,
      including
      one in Spanish which he translates on camera, and two in English. He
      closes by
      arguing that these are Minnesota kids who grew up in the state and that
      the
      federal action would make higher education much harder for them to reach.
      The
      video is advocacy for a state law by the official defending it in court,
      and
      carries no response from the opposing party in that litigation.
