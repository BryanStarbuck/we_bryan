    Title: "Charlie Kirk and 9/11 - Two Tragedies with Anniversaries One Day Apart - Ep 173"
    Description: >-
      A live episode (Ep 173, 9 September 2026, the eve of the first
      anniversary of Charlie Kirk's killing and two days before the 25th
      anniversary of 9/11) of Baron Coleman's solo YouTube show on the Tyler
      Robinson prosecution; he speaks alone for nearly four hours, and the
      second half is viewer comments. His opening statement compares the two
      events: the shock each caused, what he calls the tidy official
      narratives that followed, and the persistent questions each left,
      which for 9/11 he lists as World Trade Center building 7, free-fall
      collapse, reported thermite and airline short-selling, and for the
      Kirk case as ballistics, DNA, the arrest timeline, gaps in released
      footage, the missing wound exit, the missing microphones and necklace,
      and the conduct of several named Kirk associates at the scene. He
      argues that people who ask such questions are shamed rather than
      answered, while saying the parallel does not prove either official
      account false. He then walks through newly released higher-quality
      campus footage, posted by the creator Trigger Smart, of a figure on
      the Losee Center roof, arguing the figure's pauses, lack of a limp and
      simple step over a railing do not match the prosecution's
      descriptions; discusses a rarely seen photo, first posted on X in
      September 2025, that appears to show Robinson after surrendering; and
      compares the autopsy wounds of the Butler, Pennsylvania gunman with
      Kirk's to argue that a .30-06 round should have exited. He questions
      why Arizona state senator Jake Hoffman, a past Turning Point USA
      contractor, said on local news that he was monitoring a live stream of
      the event, and closes the content with alarm about artificial-
      intelligence risk, reading resignation posts by AI researchers and
      criticising a Peter Thiel interview answer. The doubts about 9/11 and
      the insinuations about named individuals are Coleman's own, are
      contested, and those named are not present to respond. He says he is
      emotionally drained and may not broadcast on the anniversary; comments
      cover viewers' 9/11 memories, sobriety, faith and a hot-dog debate.
