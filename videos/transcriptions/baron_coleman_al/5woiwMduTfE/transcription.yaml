Transcription:

  Video:
    Title: "Why Does Audio after Charlie Kirk Event Not Support Fed Slop Narrative? - #65"
    Description: >-
      Episode 65 of Baron Coleman's solo livestream, 3.7 hours, examining police
      radio
      audio recorded after the shooting of Charlie Kirk at Utah Valley
      University. READ
      THE CAUTION AT THE END BEFORE RELYING ON ANY CLAIM IN THIS VIDEO.
      The central segment is the host playing dispatch and officer radio traffic
      and
      arguing, clip by clip, that it does not fit the official account. His two
      main
      observations: first, that roughly fifty minutes after the shooting
      dispatch was
      still describing the suspect as wearing all black with a black long gun,
      black
      tactical helmet, black mask, possibly a tactical vest and jeans — a
      description
      he argues cannot be reconciled with Tyler Robinson, and elsewhere with
      radio
      descriptions mentioning shoulder-length hair and aviator sunglasses.
      Second, he
      plays audio of an officer on the Losee Center roof describing an imprint
      in the
      gravel — knee, head, what looks like an elbow — and reporting no visible
      casings,
      and argues the same officer would have been expected to mention a
      screwdriver he
      says is visible in scene imagery. He also notes early radio traffic in
      which
      someone reports having a photograph and a full video of the person being
      sought,
      and asks what became of them. He anticipates the counterargument himself,
      stating
      the 'fog of war' objection aloud before rejecting it.
      A second segment revisits an aircraft timeline he presented the previous
      night,
      assigning names to particular flights — placing Erika Kirk on a 9 a.m.
      flight he
      identifies by tail letters — and he is explicit that this is his
      supposition,
      saying 'I'm not married to this timeline. I'm open to being wrong.'
      The final hour is audience questions, in which he declines several: he
      says he
      cannot answer a question about timestamps, tells a viewer that satellite
      imagery
      does not work the way they assume and that he holds only two static images
      from
      before the event, and gives a sceptical answer on a question about whether
      a fall
      could have broken vertebrae. He suggests viewers file public-records
      requests for
      dash-camera footage and predicts the request will be refused as part of an
      open
      investigation. The show closes with membership promotion and a religious
      sign-off.
      CAUTION — THIS IS ONE COMMENTATOR'S INTERPRETATION OF AN OPEN CRIMINAL
      MATTER.
      The radio audio he plays may well be genuine, but the inferences drawn
      from it —
      that the descriptions cannot be reconciled, that an absent screwdriver is
      significant, that the timeline implies anything about any named person —
      are the
      host's own argument and are contested. Tyler Robinson was a criminal
      defendant
      whose case had not been tried; nothing here establishes anything about his
      guilt
      or innocence, and nothing here establishes that any official account is
      false. No
      investigator, official or named individual appears to respond. The flight
      timeline is expressly labelled supposition by the host himself. None of
      this
      should be repeated as established fact.
