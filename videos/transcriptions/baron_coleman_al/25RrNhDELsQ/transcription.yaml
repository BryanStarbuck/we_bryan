  Video:
    Title: "Did They Have Other Plans for Tyler Robinson? - #96"
    Description: >-
      A live episode (#96, 12 April 2026, Divine Mercy Sunday) of Baron
      Coleman's solo YouTube show on the prosecution of Tyler Robinson for
      the killing of Charlie Kirk; he speaks alone for nearly four hours,
      the last part being viewer comments. His opening statement tells the
      story of the 1950s Chicago-area UFO group the Seekers, whose flood
      prophecy failed and who reinterpreted the failure as success, and
      explains Leon Festinger's theory of cognitive dissonance; he then
      applies it to people who, in his view, ignore evidence against the
      official account. He argues that an arrest record listing Robinson as
      arrested at 10 p.m. on September 11 by a Utah State Bureau of
      Investigation agent cannot be reconciled with a later search warrant
      saying Robinson arrived at the Washington County Sheriff's Office at
      10:26 p.m., given the roughly three-and-a-half-hour drive, and says
      this supports his earlier claim that Robinson was read his Miranda
      rights at 6:25 p.m. that day. The core of the episode compares the
      text messages quoted in the charging document with those in a newly
      released search warrant: he points to messages present in one and not
      the other, argues that the messages fall into two distinct writing
      styles (formal, capitalised messages that confess and casual lower-
      case ones that do not) and suggests some were written by someone else,
      questions why a handwritten note was photographed and then burned,
      notes a Discord username that differs from an earlier report, and
      highlights new messages in which Robinson appears to contemplate
      ending his life and in which his roommate says he is at his parents'
      house and needs an excuse to leave. From this he argues that Robinson
      was meant to be a dead 'patsy' and that the story changed because he
      surrendered alive, while saying he is not married to that theory and
      would reconsider given contrary evidence. These theories are Coleman's
      own speculation, are unproven, and the people and agencies he names
      are not present to respond. He also asserts, without detail, that the
      Artemis II mission's re-entry was faked. Comments cover viewer
      theories, faith, sobriety, family news and merchandise.
