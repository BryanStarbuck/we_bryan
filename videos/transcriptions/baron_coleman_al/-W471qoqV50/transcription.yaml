  Video:
    Title: 'The Cars Following "The Tylers"  Around Orem - Ep 144'
    Description: >-
      Episode 144 of Baron Coleman's solo livestream, 3.8 hours, continuing his
      commentary on the prosecution of Tyler Robinson and on Turning Point USA.
      READ
      THE CAUTION AT THE END BEFORE RELYING ON ANY CLAIM IN THIS VIDEO.
      The stated centrepiece, and the source of the title, is a review of
      surveillance
      and dashcam-style video released in the case, in which the host points to
      several
      vehicles that appear near Robinson at different times around Orem and asks
      who
      was driving them. He is explicit that neither the prosecution nor the
      defence
      made anything of these vehicles, and his position is an open question —
      'who were
      those people?' — rather than a stated answer.
      A second, longer strand is private-aircraft tracking. Working from flight
      records
      he attributes to TPUSA-affiliated aircraft, he says Erika Kirk's plane, a
      Gulfstream, arrived the evening before the event, around 7:50 p.m.,
      landing at
      Ogden rather than Salt Lake City or Provo, which he notes is well outside
      town.
      He is notably even-handed here, saying he does not fault her for staying
      far from
      town or for using a side entrance, describing both as sensible for safety,
      and
      explaining that he withheld the information until she was home so as not
      to put
      anyone at risk. He then observes that the aircraft continued to Kalispell,
      Montana, and argues that the frequency of TPUSA-linked private flights to
      a town
      that small is 'uncanny' — again posing it as a question he cannot answer
      rather
      than asserting a conclusion.
      The remainder is audience interaction and running commentary: an extended
      riff on
      the colour of a public figure's nail polish as a supposed coded signal,
      which he
      presents jokingly; promotion of a clips channel and paid membership,
      including
      advice to subscribe via a browser rather than the YouTube app to avoid a
      $3
      platform fee; and a response to a viewer asking what happens if Robinson
      dies
      before trial, where the host argues that would be 'supremely problematic'
      because
      it would coincide with a case he believes is falling apart, and speculates
      that
      this is why he thinks the case is being publicly presented as bulletproof.
      He
      also discusses whether AI could reproduce handwriting, observing that such
      output
      would be printer ink rather than pen.
      CAUTION — THIS CONCERNS AN UNTRIED CRIMINAL CASE AND NAMED LIVING PEOPLE.
      The
      host's readings of vehicle footage, flight patterns and prosecutorial
      motive are
      his own inference and speculation, offered on his own programme; several
      are
      posed as questions and he says so. Nothing here establishes that any
      vehicle was
      following anyone, that any flight signifies anything, or that the
      prosecution's
      case is weak or strong. Tyler Robinson had not been tried. Erika Kirk,
      TPUSA and
      the prosecutors do not appear and give no response. The 'coded signals'
      material
      is not serious evidence and is not presented as such. None of this should
      be
      repeated as established fact.
