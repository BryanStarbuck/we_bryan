  Video:
    Title: "Who is Judge Tony Graf?  - Ep 171"
    Description: >-
      A live episode (Ep 171, holiday weekend, early September 2026) of
      Baron Coleman's solo YouTube show, which covers the prosecution of
      Tyler Robinson for the killing of Charlie Kirk; Coleman, a defense
      lawyer, speaks alone for nearly three hours, and the second half is
      him reading and answering viewer comments. His opening statement
      concerns Ryan Fournier of Students for Trump: Coleman says the account
      keeps posting dozens of times a day although Fournier is reportedly
      held in a DC jail on an assault charge (he stresses the presumption of
      innocence), recounts the reported 2019 arrangement under which Turning
      Point USA ran the Students for Trump accounts and the 2023 falling-out
      over removing Trump's branding, and argues that free speech loses
      meaning when the public cannot tell who is actually speaking. The main
      segment examines Judge Tony Graf, who presides over the Robinson case.
      Coleman says he is not criticising the judge's handling of the case so
      far, walks through his published career as a prosecutor specialising
      in special-victims and sex-crimes cases in Salt Lake, Utah and Davis
      counties and a term on the Tooele County council, and questions why a
      lawyer with little history in Utah County was appointed there in
      August 2025 and then assigned this case, citing the Utah
      Constitution's residency rule. He then points to the special-victims
      background of the detective who signed the first search warrants, the
      arrest of George Zinn on obstruction and child-material charges, and
      to several people and charities around Turning Point USA involved in
      anti-trafficking or child-protection work, and speculates aloud that
      Robinson could have been a 'patsy' compromised through that kind of
      material. He repeatedly labels this speculation, says he is not
      accusing Robinson, the judge or the FBI of anything, and says he
      doubts the official account that a .30-06 shot caused the wound. The
      insinuations about the judge's selection and about the named
      individuals and organisations are Coleman's own, are unproven, and
      none of those named is present to answer them. The comment segment
      touches on the Netflix series Death of a Pastor's Wife, Formula 1, his
      family, merchandise and memberships.
