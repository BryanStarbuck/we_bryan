    Title: "There's Something about that Necklace - #91"
    Description: >-
      A live episode (#91, Holy Thursday, 2 April 2026) of Baron Coleman's
      solo YouTube show on the killing of Charlie Kirk; recovering from
      losing his voice, he skips his usual opening statement and speaks
      alone for about three and a half hours, the second half being viewer
      comments. He first shows a September 10 aerial image of a car in a
      McDonald's lot across from Utah Valley University that he says
      resembles Tyler Robinson's Dodge Challenger apart from an apparent
      sunroof, and repeats his view that decoys were involved. The core of
      the episode, which he calls 'necklace gate', starts from a defense
      filing's dates (autopsy photos taken September 10, report completed
      September 16, produced to the defense in November, photos in March)
      and the state's stated plan to introduce the autopsy report without
      supporting expert testimony. He plays behind-the-stage footage he says
      shows Kirk's chain snapping and whipping over his head, and contrasts
      that with statements by Erika Kirk and Andrew Kolvet that medics
      ripped the necklace off, Kolvet's claim that Kirk never took it off,
      Erika Kirk's later account that it was left in the bathroom the night
      before, and Frank Turek's account of finding it draped over his bag in
      the SUV. He argues a .30-06 round would not stop in the neck or snap
      the chain, questions why Erika Kirk asked about the necklace rather
      than the missing ring, points to a local TV interview with a man who
      said Kirk was shot in the heart and that he knew George Zinn, and
      speculates that a charm or the necklace may have been rigged to
      simulate a chest shot, while calling this a question rather than a
      conclusion. He then argues that the audio played at AmericaFest of
      Kirk naming his wife as successor was spliced, notes that a nonprofit
      CEO cannot appoint a successor, criticises Blake Neff's reply to
      Candace Owens in harsh personal terms, and treats a Turning Point USA
      director's remark about a pre-death executive retreat on a five-year
      plan as suspiciously convenient. These theories and insinuations about
      named people are Coleman's own speculation, are unproven, and those
      named are not present to respond. Comments include viewer theories,
      merchandise, Easter wishes and a joke AI clip of Kirk 'appointing'
      Coleman.
