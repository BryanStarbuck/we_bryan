  Video:
    Title: "Real Eyes Realize Real Lies - Ep 114"
    Description: >-
      A live episode (Ep 114, mid-May 2026) of Baron Coleman's solo YouTube
      show on the prosecution of Tyler Robinson for the killing of Charlie
      Kirk; Coleman speaks alone for about three and a half hours, and
      roughly the second half is him reading and answering viewer comments.
      His opening statement retells the 1954 Sam Sheppard murder case and
      the 1966 Supreme Court decision Sheppard v. Maxwell on prejudicial
      publicity, and compares it with the Robinson case: he cites defense
      survey figures that most potential Utah County jurors already believe
      Robinson guilty and discusses Judge Tony Graf's ruling allowing
      cameras with limits, arguing the case must be decided in court rather
      than in public opinion. He then repeats his contention that Robinson
      was arrested and read his Miranda rights on the evening of September
      11, pointing to a Washington County Attorney's Office Facebook post
      and to the county's handling of a records request for surveillance
      video of the surrender, and argues that if he is right it raises the
      question of who wrote a later Discord message; he acknowledges he may
      be wrong about the date. The largest segment plays clips from a video
      by the YouTuber Nissi and adds his own examples to argue that Erika
      Kirk has repeatedly told untrue stories about her life: her absence
      from a Turning Point USA event with Vice President JD Vance, how and
      when she met Charlie Kirk (including a Tyler Bowyer interview
      describing an earlier meeting at a gym), her pageant history, how long
      she played college basketball, her degree, honours and a claimed
      doctorate, when she first read the Bible, and the size of her
      nonprofit. He says this is criticism of her honesty rather than of her
      grief; these are his characterisations, several are contested, and she
      is not present to respond. He also reads and rebuts an X post by a
      small account, amplified by some Turning Point USA staff, accusing him
      of profiting from Kirk's death, and says those closest to Kirk show
      little interest in investigating the killing. Viewer comments cover
      his illness and recovery, merchandise, faith and sobriety milestones,
      widows' reactions to Erika Kirk, his speculation about her appearance,
      and an upcoming members-only interview.
