  Video:
    Title: "I am a MORFAR! Back as a GRANDDAD after a Week Off! Revisiting the Paved Over Crime Scene - Ep 116"
    Description: >-
      Episode 116 of Baron Coleman's solo livestream, 3.9 hours, his first show
      after a
      week away. READ THE CAUTION AT THE END BEFORE RELYING ON ANY CLAIM IN THIS
      VIDEO.
      The first stretch is personal: he explains he and his wife took time away
      ahead of
      their 25th anniversary, and — the source of the title — announces he has
      become a
      grandfather, using the Scandinavian word 'morfar'. He says he wants to set
      out
      how his family is actually composed because he has been receiving
      congratulations
      for things that are not so.
      The substance of the episode is an argument that the site where Charlie
      Kirk was
      shot at Utah Valley University was destroyed rather than preserved. He
      lists what
      he says happened: people standing on blood-stained chairs to retrieve
      camera SD
      cards; spectators and others permitted to walk across the scene, which he
      says a
      viewer captured on video; grass and dirt ripped up; the area paved over on
      the
      fourth day; tiles replaced in a tunnel under the Hall of Flags; the tent,
      chairs
      and tables not preserved and unaccounted for; a necklace not taken into
      evidence;
      and the SUV used to take Kirk to hospital cleaned, repaired and sold. He
      sets
      this in a pattern he draws from three earlier cases, each stated as his
      own
      reading: the RFK shooting, where he cites a count of 13 or 14 documented
      shots
      against eight in Sirhan Sirhan's revolver and a medical examiner's finding
      that
      the fatal shot came from behind the right ear while witnesses placed
      Sirhan in
      front; the King assassination, where he says a tree limb reported as
      obstructing
      the line of sight was cut down the same day and shrubbery behind Jim's
      Grill
      levelled the next morning; and the Butler attempt on Trump, where he says
      the FBI
      hosed down the scene and released it within three days. His conclusion is
      that
      rapid destruction of a scene is what one would expect if the official
      account of
      a lone gunman were untrue. He is careful in one place to distance himself
      from a
      theory circulating among his own audience, saying for the record that he
      does not
      believe anything happened under an alleged trap door.
      CAUTION — THIS IS ONE COMMENTATOR'S INTERPRETATION OF AN OPEN CRIMINAL
      MATTER.
      The inference that a scene was destroyed to conceal something, and the
      historical
      parallels offered to support it, are the host's own argument and are
      contested.
      Some underlying details may be checkable and some of his figures are
      disputed by
      other accounts; this transcript verifies none of them. No investigator,
      agency or
      official named here appears to respond, and the case against the charged
      defendant had not been tried. Nothing in this transcript should be
      repeated as
      established fact.
