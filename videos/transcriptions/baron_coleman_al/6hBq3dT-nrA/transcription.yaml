  Video:
    Title: "Lying Liars Who Lie - Erika Kirk and TPUSA - #76"
    Description: >-
      Episode 76 of Baron Coleman's solo livestream, 3.6 hours, continuing his
      commentary on Turning Point USA and the death of Charlie Kirk. READ THE
      CAUTION
      AT THE END BEFORE RELYING ON ANY CLAIM IN THIS VIDEO.
      The substantive core is a credential audit of Erika Kirk (Frantzve).
      Working from
      her LinkedIn education section with a researcher he calls Daisy, the host
      says
      they checked several claims and could not verify them: a bachelor's from
      Arizona
      State in political science and international relations, where he says the
      university did not offer an international relations major at the time so
      it could
      not have been a double major; a summa cum laude designation which he says
      was
      absent when they obtained a copy of the commencement programme from the
      university; and a doctorate in education in Christian leadership dated
      2022, for
      which he says a search of Liberty University's graduate listings returned
      no
      entry under either Frantzve or Kirk. He raises the same question about
      summa cum
      laude on a juris master and about a single year at Loyola Marymount,
      noting one
      cannot graduate summa cum laude in a single year. He describes the method
      used —
      calling the institution, obtaining the programme, searching the graduate
      portal
      under both surnames — which is checkable, though the conclusions are his.
      A second section concerns TPUSA succession. He plays and replays interview
      clips
      in which colleagues say Charlie Kirk joked that if something happened to
      him he
      wanted Erika as his successor, and that he believed she could be president
      one
      day, and the host dwells on the phrasing and on who is advancing it.
      A third, unrelated section is a long anti-war argument against a US war
      with
      Iran. Here he is arguing rather than alleging: he predicts the destruction
      of
      Iranian infrastructure, deaths he puts at one to three million, mass
      refugee
      flows, damage to desalination and oil infrastructure across the UAE,
      Qatar, Oman
      and Jordan, closed shipping lanes and a fuel-price rise he characterises
      as
      equivalent to a tax hike — and argues that no politician states this
      honestly
      because the public would refuse to support it. He ties this to Charlie
      Kirk,
      arguing Kirk had more influence over Americans under 35 than anyone else
      and was
      telling the truth on this subject.
      The opening monologue is part of a running series on 'patsies', in which
      the host
      speculates about how young men are recruited or entrapped by federal
      agents.
      CAUTION — SEVERAL CLAIMS HERE ARE UNEVIDENCED AND CONCERN LIVING PEOPLE.
      The
      credential findings are the host's own account of research he says he and
      an
      associate performed; this transcript contains no documents and is not
      verification of them, and Erika Kirk does not appear and gives no
      response. More
      seriously, in the 'patsy' segment the host speculates on air that Tyler
      Robinson
      — the man charged in Charlie Kirk's killing, whose case had not been tried
      — and
      another named individual came to the attention of federal agents because
      they
      were 'probably' viewing illegal material involving minors. He states twice
      in the
      same breath that he does not know this and is not accusing them, and
      offers no
      source whatever. That is unsupported speculation about a criminal
      defendant and
      must not be repeated as fact. The broader claims about FBI entrapment, and
      the
      predictions about an Iran war, are likewise the host's own opinion and
      forecast.
      Nothing in this transcript establishes any of it.
