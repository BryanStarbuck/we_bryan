  Video:
    Title: "Senator Collins Talks About Benghazi on Hardball With Chris Matthews"
    Description: >-
      A Hardball interview in which Chris Matthews asks Senator Susan Collins whether UN
      Ambassador Susan Rice knowingly covered up a national security breach at Benghazi.
      Collins does not adopt that framing: she says her purpose is to understand the
      security failure, what the public was told and how to keep personnel safer. She
      says Rice herself has conceded the Sunday-show information was inaccurate in
      several crucial respects, and adds her own view that Rice "chose to emphasize some
      aspects and downplay others" and should have declined the appearances to preserve
      her credibility. Asked about the underlying intelligence, Collins says she has
      reviewed tapes, classified material and hours of briefings, concedes the reporting
      was conflicting, but maintains there was no protest preceding the assault and that
      this was known before September 16. The characterisation of Rice's motives is
      Collins's own opinion, contested at the time, and Rice is not present to answer it.
