  Video:
    Title: "Chairing Subcommittee, Senator Warren Highlights Potential Consequences of Child Care Funding Cliff"
    Description: >-
      Senator Warren's opening statement chairing a subcommittee hearing on
      child care after the pandemic and the macroeconomic effects of policy
      on it. She introduces three witnesses — a child care centre operator,
      the co-founder of an infant formula company, and a labor economist —
      and frames the hearing around a federal funding cliff arriving when
      most pandemic child care relief expires at the end of September, ten
      days out. She recounts the $50 billion Congress provided during the
      pandemic, says providers used it for rent, safety, wages and
      shortfalls, and argues it kept the industry afloat without solving
      every problem. Her stated stakes are analysts' estimates that 70,000
      programs will close, nearly a quarter of a million child care workers
      could lose jobs and over three million children could lose care, with
      parents, especially mothers, pushed out of a tight labor force; those
      are analyst estimates she cites rather than measured outcomes. She
      points to a letter she joined with Senators Kaine and Smith and 27
      colleagues seeking $16 billion in emergency funding, notes White House
      support, says she will work with any Republican willing to help, and
      argues the must-pass government funding and supplemental package is
      the vehicle.
