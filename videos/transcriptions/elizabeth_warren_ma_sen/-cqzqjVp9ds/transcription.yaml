  Video:
    Title: "Senator Warren's Floor Speech on Military Nominations"
    Description: >-
      A Senate floor speech by Senator Warren opposing a blanket hold on
      senior military nominations. She explains the ordinarily invisible
      mechanism: the Senate must approve thousands of military promotions
      each year, normally in batches and usually without a recorded vote.
      She states that the senator from Alabama — Tommy Tuberville, whom she
      refers to by state throughout — has placed a hold on all senior
      military nominations, freezing promotions for 184 top-level leaders.
      Her argument for the harm is both material and strategic: pay
      increases cannot take effect, families cannot decide about moving or
      school enrollment, and special-needs families face delays. She quotes
      the Army Chief of Staff and Secretary Austin on readiness effects. She
      names among the blocked posts the next commanders of the Fifth and
      Seventh Fleets, the next military representative to NATO, the Director
      of Intelligence for Cyber Command, and the former chief of staff of
      Operation Warp Speed, and says the hold covers eleven three-star
      commanders, three Silver Star recipients and three Purple Heart
      recipients. She acknowledges the underlying dispute is over the
      Department of Defense policy on travel to access abortion care, says
      plainly that she disagrees with him on that issue, and argues the
      remedy is to seek votes and change the law rather than to hold
      nominations, calling the tactic extortion rather than democracy. The
      characterisations of motive and consequence are hers; the senator she
      is addressing is not present to answer them.
