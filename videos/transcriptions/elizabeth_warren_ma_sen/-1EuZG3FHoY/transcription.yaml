Transcription:

  Video:
    Title: "At Hearing, Bank CEOs Agree on Need to Enforce Anti-Money Laundering Rules Against Crypto Companies"
    Description: >-
      Senator Warren's questioning of the CEOs of the largest U.S. banks at
      a Senate Banking Committee hearing, on illicit finance and
      cryptocurrency. She first establishes that each bank runs anti-money-
      laundering programs, getting a yes from Bank of America's Brian
      Moynihan, a qualified yes from JPMorgan's Jamie Dimon that no system
      is foolproof, and a show of hands from the rest. Her argument is that
      those programs exist because of the Bank Secrecy Act rather than
      goodwill, that the law was updated after 9/11 when terrorists found
      ways around it, and that cryptocurrency is the current route around
      it. She cites an estimated $20 billion in illicit crypto transactions
      in the prior year, says North Korea has funded at least half its
      missile program including nuclear weapons through crypto crime, and
      says Israeli officials confirmed Hamas received millions including
      large sums from Iran; these are figures and attributions she puts on
      the record rather than findings established at the hearing. Dimon says
      he has always been deeply opposed to crypto, calls its only true use
      case criminal, and says if it were up to him he would close it down.
      Each CEO agrees crypto firms should follow the same anti-money-
      laundering rules as banks. Warren closes by pointing to her bill with
      Senator Marshall and 18 colleagues.
