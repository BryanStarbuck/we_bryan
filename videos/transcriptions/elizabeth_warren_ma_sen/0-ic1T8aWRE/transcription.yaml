  Video:
    Title: "Senator Warren's Floor Speech on Chief of Staff Jon Donenberg"
    Description: >-
      A Senate floor tribute by Senator Warren to her departing chief of
      staff, Jon Donenberg, delivered with him present on the floor by
      consent. She traces their work together from her 2012 campaign through
      his six years as her legislative director, his role as senior advisor
      and policy director on Warren for President, and his last four years
      as chief of staff. She describes him as one of the sharpest minds on
      economic policy she knows, credits him with helping her build an
      agenda beyond the commercial law she arrived expert in, and
      characterises their working relationship as combative in a productive
      way, giving him a 50/50 lifetime record in their arguments while
      saying her own thinking sharpened every time. She highlights his
      debate-prep work for her and other senators, his earlier service as
      chief counsel to Senator Blumenthal, health law advisor to
      Representative Henry Waxman, and a legal fellowship with Senator Ted
      Kennedy, and reads a short tribute from Waxman. A substantial passage
      is given to his mentorship of junior policy staff and to his image of
      Senate work as running face-first at a brick wall until it breaks. He
      is leaving to be deputy director of the National Economic Council. The
      speech is personal tribute rather than policy argument.
