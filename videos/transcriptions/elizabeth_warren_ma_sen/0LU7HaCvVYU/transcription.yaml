  Video:
    Title: "Donald Trump's presidential library is one more way he can wallow in corruption."
    Description: >-
      A television interview in which Senator Elizabeth Warren discusses a
      bill she has introduced, with co-sponsors including Senator
      Blumenthal, to put guardrails on donations to presidential libraries.
      Her argument is that the problem predates Donald Trump — sitting
      presidents have long taken library donations while still able to issue
      pardons, cut tariff deals or approve mergers — and that the current
      gap is the absence of any rules at all: no disclosure requirement, no
      caps, and no limits on who may give, including foreign governments and
      people seeking pardons. Her bill would bar a sitting president from
      soliciting or accepting funds for a future library. She characterises
      Donald Trump as having put the practice on steroids, citing a $400
      million airplane from Qatar and the settlement of a lawsuit she calls
      bogus; those characterisations are hers and are contested, and Trump
      is not present to answer them. She notes a similar bill was introduced
      on a bipartisan basis in the House with Representative Moskowitz and
      never got a vote in the Senate, and argues the effort should be
      bipartisan. The interviewer closes by predicting she will struggle to
      win Republican support.
