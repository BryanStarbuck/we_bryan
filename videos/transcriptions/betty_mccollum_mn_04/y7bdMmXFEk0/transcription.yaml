    Title: "Supreme Court Rebukes Trump"
    Description: >-
      Representative Betty McCollum, recording away from Minnesota while on
      what she describes as oversight work in a warmer region, reports that
      the Supreme Court has ruled the president's use of tariffs
      unconstitutional. She grounds the ruling in Article One of the
      Constitution, which she says assigns that responsibility to Congress.
      She characterises the president's subsequent news conference as ranting,
      raving and uncontrollable, and as an argument that the Court was wrong
      and that he is always right. She then makes her substantive point:
      tariffs are not fees, as she says he calls them, but taxes ultimately
      borne by consumers through the higher prices companies charge to offset
      them. She closes by thanking the Court for protecting the Constitution.
      The account of the ruling, the characterisation of the news conference,
      and the claim about who bears the cost are hers; the administration is
      not represented and does not answer them.
