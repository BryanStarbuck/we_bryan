  Video:
    Title: "Senator Hawley Calls for Accountability over Biden's Failures on Afghanistan & Ukraine"
    Description: >-
      A contentious Senate floor sequence in which Senator Josh Hawley,
      having been denied a colloquy and objected to by another senator,
      speaks about the Biden administration's policy on Ukraine and
      Afghanistan. He rejects what he describes as a White House
      explanation that shortfalls in Ukraine are a Defense Department
      logistics problem, saying the cause is policy. He says President
      Zelensky asked for planes and the administration answered first yes,
      then maybe, then no, and states that the Secretary of Defense
      testified that day that less than a third of $3 billion in
      appropriated lethal aid had been delivered, quoting him as saying
      "we are giving them what we think they need." He says the Secretary
      also confirmed intelligence had not been fully shared with Ukrainian
      forces and that policy would have to change. He argues the
      administration denied Ukraine military assistance a year earlier
      while green-lighting a Russian pipeline and throttling American
      energy production, listing the Keystone cancellation, an ANWR
      leasing halt, a pause on new federal oil and gas leases and permits,
      and new methane and emissions regulations, which he says raised
      Russian production and revenues. He cites Biden's remark that "this
      man cannot remain in power" as leaving the war aims unclear, and a
      further remark to service members as another gaffe. Turning to
      Afghanistan, he says thirteen service members were killed at Abbey
      Gate including one from Missouri, describes being asked by that
      man's father to hold the administration accountable, and asks
      whether anyone has been fired or relieved of command. He concludes
      by saying he will ask that regular order be observed on senior
      defense nominations until there is accountability and a change in
      policy. The chain of causation and the attributions of motive are
      his own and are contested; the administration officials he
      criticises are not present to answer.
