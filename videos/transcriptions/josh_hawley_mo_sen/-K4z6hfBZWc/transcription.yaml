  Video:
    Title: "'Why does this Smithsonian director still have a job? Why isn’t she fired?': Hawley on Ingraham"
    Description: >-
      A cable news segment about the Smithsonian in which a host plays
      resurfaced footage of the director of the National Museum of
      American History describing an "equity-based, justice-forward,
      community-driven" approach to public history and calling history a
      prime tool of social justice. The host also describes an organised
      effort by volunteers who photographed tens of thousands of gallery
      items, characterising it as preserving a narrative rather than
      protecting artifacts. Senator Josh Hawley responds that Americans do
      not want tax money going to people who he says hate the country or
      to exhibits about how terrible America is, calls the director's
      remarks anti-American propaganda, and asks why she still has a job
      and why she should not repay the taxpayer money she has received.
      The host explains the Smithsonian's governance — that only the
      Secretary of the Smithsonian could remove her, absent action by the
      Board of Regents, whose membership she describes as including the
      Chief Justice and the Vice President. Hawley suggests Congress may
      need to change the governing statute, calls the arrangement a scam
      by which he says the left has captured institutions, and says the
      leadership should be replaced by people with an objective view of
      history who love the country "flaws and all." The characterisations
      of the museum's staff and their motives are the speakers' own; the
      director is quoted only from the played clip and does not answer
      them.
