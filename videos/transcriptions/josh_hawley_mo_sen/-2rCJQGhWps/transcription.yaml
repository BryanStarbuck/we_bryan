    Description: >-
      An exchange at a Senate committee hearing in which Senator Josh
      Hawley questions a Justice Department witness about the collection
      of phone records belonging to eight United States senators. Hawley
      asserts the Department sought to track senators' cell phones without
      criminal predicate, without notice to the senators, and without
      legal process served on them, and says the collection covered
      incoming and outgoing calls, call metadata, location and duration.
      He includes himself among those targeted and says several sit on the
      committee. The witness does not accept the characterisation: he
      replies that what is being described is a grand jury subpoena for
      cell phone records, and that under the justice manual and 18 U.S.C.
      2703 such a subpoena requires specific and articulable facts and
      does not get served without them. The factual dispute is left
      unresolved in the clip.
