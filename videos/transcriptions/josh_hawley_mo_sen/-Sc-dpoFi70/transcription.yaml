  Video:
    Title: "Sen. Hawley Questions Female Sports Advocate Riley Gaines On Competing Against Transgender Athletes"
    Description: >-
      Senator Josh Hawley questions Riley Gaines at a Senate Judiciary
      Committee hearing. He begins with an incident at San Francisco State
      University, displaying a photograph and asking her to confirm his
      account of it. Gaines says she was held for three and a half hours
      by protesters who she says demanded money before she could go home,
      that she was assaulted after protesters rushed the room and turned
      off the lights, and that while she accepts the right to protest she
      objects when it turns violent. She says local law enforcement failed
      to remove her safely and that officers indicated it was not ideal to
      be seen as anything other than an ally to the community. Hawley then
      asks about the substance of her remarks. Gaines describes competing
      against a transgender swimmer in her senior year and learning only
      on entering the locker room that she would be undressing alongside a
      person she describes as a six-foot-four biological man; she recounts
      an official telling her the rules had been changed to make locker
      rooms unisex, and argues that this both conceded a difference of sex
      and meant any man could have entered without warning. She says her
      objection is that the privacy of women and girls was dismissed
      easily, and responds to Senator Durbin's question about the message
      sent to transgender people by asking what message is sent to young
      women. She describes Harvard advising swimmers not to discuss the
      subject, says teammates of Lia Thomas were required to attend weekly
      LGBTQ education meetings and were told they could lose scholarships,
      jobs and friendships and could be held responsible for any harm
      coming to Thomas, which she calls emotional blackmail. Asked to
      respond to Thomas's public statement that advocates use the guise of
      feminism to push transphobic beliefs, Gaines says the meaning of
      feminism has not changed and calls the criticism a man explaining
      feminism to women. The entire account is the witness's sworn
      testimony as she gives it; the university, the NCAA, Harvard and Lia
      Thomas are all absent and none answers it here.
