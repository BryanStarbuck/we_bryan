  Video:
    Title: "'It's Time We Stood For What Is Right In America': Hawley at Teamsters 31st International Convention"
    Description: >-
      Convention remarks to the Teamsters, thanking the union for 123 years
      of fighting for working people and saying it has made the nation
      better. The senator argues that no amount of profit justifies
      destroying working families or whole working communities, and that the
      central problem in the American economy is that too many of the people
      running large corporations have forgotten right from wrong. He states
      that he is for the free market, free enterprise and capitalism, but
      above all for right and wrong, and that it is right to pay a working
      man what he deserves, to fight for decent working conditions and to be
      treated as one deserves. He calls for protecting workers and giving
      them rights over AI in the workplace, saying technology will not be
      allowed to replace workers and must be made to work for them instead.
      He closes on the theme that the country was built on the promise that
      a working person given a shot and their liberty under God can do
      anything, and that the Teamsters built the American economy. The
      speech is applause-punctuated and makes a values argument rather than
      citing figures.
