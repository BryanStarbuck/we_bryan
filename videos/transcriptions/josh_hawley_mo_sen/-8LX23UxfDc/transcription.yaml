Transcription:

  Video:
    Title: "Hawley Asks Former Democrat Congresswoman If She Can Leave Politics Out Of The U.S. Postal Service"
    Description: >-
      A confirmation hearing exchange with a nominee to the Postal Service
      Board of Governors, a former Democratic member of Congress and former
      police chief. The senator says the post is non-partisan and puts two
      of her past statements to her: that Kamala Harris believes in
      democracy and Donald Trump does not, which he calls incredibly
      irresponsible rhetoric; and that the Fourteenth Amendment bars those
      who tried to overthrow the government, said in reference to the cases
      seeking to remove the former president from the ballot, which he notes
      the Supreme Court rejected 9-0 on the ground that the choice belongs
      to the people. He asks how she sees the role and whether she can serve
      under a president she described that way. The nominee replies that as
      a law enforcement officer, a member of Congress and a member of the
      board she has held opinions about people on both sides of the aisle
      but that her political views will not negatively affect the bipartisan
      work of the board; that she attended the 2017 inauguration though
      Trump was not her candidate, because the American people had spoken
      and she believed it was a free and fair election; that she was in the
      House chamber on January 6th and was expressing an opinion coming out
      of a difficult time; and that she respects the will of the people and
      is committed to strengthening service for rural areas. The exchange is
      cordial and both sides speak at length.
