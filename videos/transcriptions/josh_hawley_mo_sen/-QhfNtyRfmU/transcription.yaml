    Title: "Senator Hawley Delivers Opening Statement at Judge Jackson's Supreme Court Nomination Hearing"
    Description: >-
      The senator's opening statement at the Supreme Court confirmation
      hearing for Judge Ketanji Brown Jackson. He congratulates her and her
      family, says he appreciated how candid she was in their private
      meeting, and says he wants to be equally candid about what concerns
      him so she knows exactly what he intends to raise. He then walks
      through seven child-pornography cases from her time on the federal
      district court, naming each and stating the sentencing guideline
      range, the sentence prosecutors recommended and the sentence imposed:
      Hawkins, Chazin, Cooper, Downs, Stewart, Sears and Savage. He says
      these represent, as near as can be told, all of her cases of this type
      in which she had sentencing discretion, and that in every one she went
      below both the guidelines and the prosecution's request. He cites a
      2019 New York Times report of more than 45 million reported images and
      videos in a year and a National Center for Missing and Exploited
      Children figure of 85 million files in 2021, and says he does not
      accept the argument that the guidelines are too harsh or outmoded. He
      states explicitly that this argument is not one Judge Jackson has
      made, that she has not yet had the chance to respond and deserves it,
      that he is not interested in trapping her or playing gotcha, and that
      he expects she has a coherent explanation he wants to hear. The case
      characterisations and figures are his own as delivered; Judge Jackson
      does not speak in this clip and her answers came on later hearing
      days.
