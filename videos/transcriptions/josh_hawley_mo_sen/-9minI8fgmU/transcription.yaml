  Video:
    Title: "Fox Outnumbered Discusses Senator Hawley's Stance on Masculinity"
    Description: >-
      A daytime panel show segment reacting to a Washington Post opinion
      column by Jonathan Capehart titled "Josh Hawley's Problem with
      Masculinity," which the hosts quote as calling Hawley a manhood-
      obsessed hypocrite selling a vision of masculinity to white America
      that has more to do with prejudice than manliness. Hawley himself
      does not appear; the segment is entirely about him. The panelists
      reject the column's racial framing, one arguing that invoking racism
      is a sign of having lost an argument and that strong male role
      models benefit children across racial lines, another invoking
      grandfathers who fought in the Second World War, and several asking
      when masculinity became a bad thing while affirming that society
      needs both men and women and needs fathers in the home. A portion of
      the segment is banter about Hawley's appearance. One panelist reads
      the column's praise of an alternative model of masculinity that
      treats vulnerability as a virtue and argues it describes what Hawley
      is already advocating, and objects that the column's references to
      labor organizing and marriage are proxies for ideology. The claims
      about the column's content are the panel's characterisation of it,
      and its author is not present to respond.
