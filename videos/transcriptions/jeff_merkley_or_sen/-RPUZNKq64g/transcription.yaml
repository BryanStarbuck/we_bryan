    Title: "Merkley: Russian Hacking is an Attack on Democracy"
    Description: >-
      A television interview with Senator Jeff Merkley, introduced as a
      former national security analyst at the Pentagon, recorded in
      December 2016 about Russian interference in the presidential
      election. Merkley calls it "the political equivalent of 9/11,"
      saying a hostile foreign power attacked the core process behind the
      presidency, and calls for declassification and for a bipartisan
      independent commission modelled on the 9/11 Commission. He cites New
      York Times reporting that the hacking extended to congressional
      races. The interviewer presses him on the gap between his tone and
      the outgoing president's more measured remarks; Merkley replies that
      the president feels a responsibility to a gracious transition while
      the Senate's role is to recognise the system was hacked, and says it
      compromises the legitimacy of the incoming presidency. Asked whether
      the leaks were definitive in the outcome, he declines to go that
      far, citing other late factors including the FBI director's actions,
      whom he says history will judge one of the worst directors ever for
      not briefing the DNC about the hacking and for intervening eleven
      days before the election. Asked to answer Republicans who call this
      sour grapes, he says a patriotic American cares when America is
      attacked. The judgements throughout are his own and are contested.
