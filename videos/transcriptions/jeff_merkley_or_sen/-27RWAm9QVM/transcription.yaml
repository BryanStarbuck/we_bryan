    Title: "Loan Shark Week: A Vortex of Debt"
    Description: >-
      A Senate floor speech built around a Shark Week metaphor, using a prop
      or graphic of a payday loan shark and an American family in choppy
      financial waters. The senator describes a family taking a two-week
      loan to cover rent, medical expenses or a car repair, and argues the
      loan functions as a life raft that becomes a vortex of debt. He puts
      the annual interest rate at 300 to 500 percent, says a $1,000 loan
      becomes $5,000 in a year and $25,000 in two, and says four out of five
      families cannot repay in two weeks and must roll the loan over into a
      larger one, sinking further until they reach default and bankruptcy.
      He notes that military leaders judged these loans destructive enough
      to military families that they were made illegal for them, and argues
      the same protection should extend to everyone, calling for caps on
      interest rates as many states have done and for support for the
      Consumer Financial Protection Bureau as it acts against payday
      lenders. The figures are his own as delivered on the floor and no
      lender is represented. The transcript ends with a stray "visit
      www.fema.org" line that does not fit the subject and appears to be a
      mis-transcription.
