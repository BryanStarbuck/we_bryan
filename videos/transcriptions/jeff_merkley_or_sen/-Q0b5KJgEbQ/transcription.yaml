Transcription:

  Video:
    Title: "Senator Merkley Presses Army Corps on Key Oregon Water Projects"
    Description: >-
      A hearing exchange with Secretary Connor and General Spellman of the
      Army Corps of Engineers about Oregon projects. The senator opens by
      commending the Portland District office for advancing the 27-mile
      Portland Metro levee system along the Columbia River and says he looks
      forward to seeing it reach construction. He then raises the Cole
      Rivers Hatchery on the Rogue River, which he says is named for a
      person rather than a river and supports many native fish populations
      across several rivers plus rainbow trout for area lakes, and describes
      it as in serious trouble from a lack of clean water, disease risk and
      roughly 30 years of wear; he asks for and receives a commitment to
      work on identifying capability to restore it. Most of the exchange
      concerns tribal housing on the Columbia, where the senator says the
      town rebuilt after the dams inundated it was the one for white
      residents while the native villages were never rebuilt. The Corps
      witness describes shifting from a single consolidated village to
      separate sites for each tribe, says they are about six months into
      real estate development and identifying needs and locations, and says
      relations with the affected tribes are better than in the past. The
      senator notes that the Confederated Tribes of the Warm Springs
      Reservation and of the Umatilla Indian Reservation have expressed
      appreciation for the level of engagement, observes that the easy land
      on both banks is long since developed so remaining sites will be
      expensive and difficult, and secures agreement to expedite
      displacement assessments for the John Day and McNary pools alongside
      those already further along for Bonneville and The Dalles.
