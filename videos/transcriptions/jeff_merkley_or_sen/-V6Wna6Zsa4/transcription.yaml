Transcription:

  Video:
    Title: "Merkley Takes Aim at Opponents of Health Care Reform"
    Description: >-
      A 2009 Senate floor speech in which Senator Jeff Merkley argues that
      arguments being made against health care reform in the chamber are
      drawn from a political messaging document rather than from the
      substance of the legislation. He reads from what he identifies as a
      Frank Luntz memo on how to oppose health care legislation, quoting
      its advice that denial stories from Canada and other countries
      resonate if humanized, and its explicit recommendation of the phrase
      "government takeover" over "government run" or "government
      controlled" because it sounds scarier. He then quotes the minority
      leader using that phrasing on the floor. He does the same with
      further talking points about delayed and denied treatment and about
      bureaucrats in Washington, noting the memo was written about a plan
      that had not yet been drafted, and matches them to floor remarks
      about being forced by bureaucrats into a Washington-run plan and
      waiting two years for surgery. He calls the use of poll-tested
      language irresponsible given 50 million Americans without coverage,
      and says the chamber's task is to lay out a plan for affordable,
      accessible care. The attribution of the floor remarks to the memo is
      Merkley's argument; the colleagues he quotes do not respond here.
    URL: "https://www.youtube.com/watch?v=-V6Wna6Zsa4"
