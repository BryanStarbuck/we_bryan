Transcription:

  Video:
    Title: "2020 Marion County Town Hall"
    Description: >-
      Senator Jeff Merkley's town hall in Woodburn, Marion County, Oregon,
      in March 2020 — introduced as his 22nd town hall that year and his
      418th overall. The mayor and a state representative open with local
      introductions. Merkley notes the turnout is much smaller than usual
      and begins with a recognition of Willamette Valley Vineyards, whose
      representative describes Rogue Valley growers left with smoke-
      affected grapes their buyer refused days before harvest and no
      insurance, and how Willamette Valley winemakers jointly produced an
      "Oregon Solidarity" wine that paid growers cash for the fruit and
      returned the net proceeds; Merkley presents a flag flown over the
      Capitol. He then gives a briefing on the coronavirus as it stood
      that morning, describing transmission and hand hygiene, reporting
      Oregon's cases rising from three to seven and national identified
      cases going from 26 to 120 to more than 300 within a week while
      cautioning that expanded test-kit distribution accounts for much of
      the rise, and relaying that experts at a Thursday briefing disagreed
      on lethality, one estimate putting it at flu-like and another up to
      ten times worse. The remainder is a numbered-ticket question period.
      A constituent challenges him on foreign wars and bombing campaigns;
      Merkley says Afghanistan should have meant destroying training camps
      rather than occupation, calls the Iraq war a false-pretenses
      mistake, argues the 2001 and 2002 authorizations have been stretched
      beyond their text and cannot justify war with Iran, and says he
      would move money from a wasteful defense budget into health care,
      housing, education and infrastructure. Asked about executive power,
      he warns about a court ruling limiting congressional subpoenas of
      the executive branch and calls the loss of that check a path to an
      imperial presidency. Asked about a born-alive abortion bill he voted
      against, he says such decisions belong between a woman, her partner,
      her religious advisor and her doctor rather than with the federal
      government, and declines a follow-up. A constituent describing half
      a million dollars in family student loan debt asks him to work to
      overturn the 2005 bankruptcy law's bar on discharging private
      student loans; Merkley responds on refinancing at the rate banks
      pay, expanding Pell grants and debt-free public university, citing
      Oregon's community college pathway. On checks and balances he sets
      out the For the People Act — independent redistricting commissions,
      restoring the Voting Rights Act, automatic registration, early
      voting, paper ballots, equal polling place staffing, an end to
      partisan roll purges, and disclosure of dark money, while noting
      Citizens United itself cannot be overturned by statute — and argues
      the Senate's supermajority practice and the majority leader's
      control of the floor have concentrated power against the founders'
      design, quoting Hamilton and Madison. Further questions cover bills
      stalled in the Senate including the Equality Act, renewable energy
      research and fossil fuel subsidies, reauthorization of the Violence
      Against Women Act and its tribal provisions, Oregon's urban growth
      boundary and farmland protection, and the role of superdelegates. He
      declines a question about endorsing a presidential candidate as too
      partisan for a community gathering. All the historical and causal
      claims are Merkley's own; the transcript garbles some proper names.
    URL: "https://www.youtube.com/watch?v=-AMuS42F7Zw"
