    Title: "Members of Congress were elected to serve the people—not to line their own pockets."
    Description: >-
      Senator Jeff Merkley argues for an amendment barring members of
      Congress and their spouses from trading individual stocks. His case
      is about the appearance and the psychology of conflict: he says that
      a member holding a concentrated portfolio inevitably has "a voice in
      your head" weighing how legislation would affect those holdings,
      offering renewable energy tax credits, bank stocks and fossil fuel
      holdings as examples. He notes public regard for Congress is very
      low and that articles about well-timed trades ahead of public action
      recur every few months. He draws on his own record as Speaker of the
      Oregon House, where he says the chamber adopted a gift rule known as
      the $10 standard that permitted small items but barred trips and
      event tickets, and which he credits with changing the culture and
      leading Oregon to adopt a similar law. He acknowledges the amendment
      would not reach the House, credits a colleague from Georgia with
      driving the issue this year, and asks that the measure be debated
      and voted on rather than tabled.
