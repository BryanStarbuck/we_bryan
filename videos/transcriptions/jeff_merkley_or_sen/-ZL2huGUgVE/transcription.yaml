  Video:
    Title: "Climate Disruption Quiz Episode 3"
    Description: >-
      The third episode of a recurring Senate floor segment the senator
      calls the Climate Disruption Quiz, delivered as five multiple-choice
      questions with answers and explanation. After an opening framing
      climate disruption as the defining challenge of the generation and
      listing effects on farms, forests, fisheries, glaciers, permafrost and
      coral, he asks: why American Airlines cancelled 57 flights between 20
      and 22 June, with the answer given as extreme temperatures, because
      hotter air is thinner and provides less lift, echoing 18 cancellations
      in Phoenix in 2013; how long the recent run of record-setting months
      lasted, given as 16 months from May 2015 through August 2016, with a
      back-of-envelope probability calculation offered to argue it did not
      happen by chance; where the world's largest floating solar project is,
      given as Lulong, China, at 40 megawatts and enough for 15,000 homes,
      sited on a lake formed by collapsed abandoned coal mines, with smaller
      projects noted in India, Australia and Brazil; what share of new car
      sales in Norway were plug-in hybrid or fully electric, given as 37
      percent against a global average under 1 percent, up from 6 percent
      three years earlier, which he attributes to fees on petrol and diesel
      cars plus subsidies; and what killed billions of baby oysters in
      Oregon in 2007 and 2008, given as rising ocean acidity rather than red
      tide, a virus or sea lice, with intake water at the Whiskey Creek
      hatchery now buffered before it reaches the vats. He states that
      burning fossil fuels has increased ocean acidity by 30 percent over
      150 years. All figures are as delivered in the speech. He closes by
      inviting question suggestions by tweet and quoting a line he
      attributes to Thoreau about the use of a home without a tolerable
      planet to put it on.
