  Video:
    Title: "Rep. Justin Amash - Floor speech honoring former First Lady Betty Ford"
    Description: >-
      A one-minute House floor tribute to former First Lady Betty Ford
      following her death, delivered on behalf of West Michigan. The speaker
      recounts that she spent most of her life in Grand Rapids, graduated
      from Central High School, worked in a downtown department store and
      was a dance instructor, and that she taught dance to children who were
      physically disabled, deaf and blind. He notes a mutual friend
      introduced her to Gerald Ford in 1947, when the future president, a
      successful lawyer and former University of Michigan football star, was
      not yet in public life, and that no one could have foreseen the
      circumstances that brought the Fords to the White House. He describes
      her speaking publicly about her breast cancer in the 1970s at a time
      when it was not often discussed, and applying the lessons of her
      battle with alcoholism in the 1980s to found institutions helping
      others with the condition, closing that she honoured West Michigan
      with her public service, humour and grace.
