  Video:
    Title: "Rep. Justin Amash - Floor speech on Ron Paul's Audit the Fed (H.R. 459) (July 24, 2012)"
    Description: >-
      A one-minute House floor speech supporting Ron Paul's Federal Reserve
      audit bill, H.R. 459. The member thanks Chairman Issa and
      congratulates Ron Paul for decades of work on the issue, then asks
      what the Federal Reserve is, suggesting many members of the body could
      not answer, and argues Congress has delegated its constitutional
      authority to 'this committee of bankers and presidential appointees'.
      He says no institution in the country's history has been given so much
      power while Congress knew so little about it, notes that as the
      central bank it manages inflation and can therefore change the value
      of Americans' life savings, retirement accounts and mortgages, and
      points to its role as lender of last resort and its unprecedented
      market interventions, buying mortgages when investors would not and
      stepping in when creditors became wary of congressional spending. He
      notes the existing audit statute prevents an audit of monetary policy,
      and quotes government accountants as saying they could not
      satisfactorily audit the system without authority to examine the Fed's
      largest assets. He urges vigilance against unaccountable groups and
      asks the body to pass the bill. The constitutional argument is his
      own.
