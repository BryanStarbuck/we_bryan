Transcription:

  Video:
    Title: "Rep. Justin Amash - Oversight hearing questioning Postmaster General | 1 of 2 (March 27, 2012)"
    Description: >-
      A round of questioning of Postmaster General Donahoe at a House
      oversight hearing. Asked when the Postal Service last made a profit,
      Donahoe says 2006 or 2007. He puts first-quarter 2012 losses at about
      3.3 billion dollars given the pre-funding requirement, and full-year
      losses in the vicinity of 14 billion, of which 11 billion is pre-
      funding covering both this year and last, adding that revenues are
      slightly ahead of plan and staff have held costs down. Asked what the
      annual uncertainty over whether the payment must be made does to
      planning, he says it has to be resolved and that customers worried
      about mail delivery and cash flow will start considering alternatives.
      The member quotes Donahoe's November 2011 National Press Club remark
      that 'the lack of speed will kill the Postal Service' and asks why the
      Service then self-imposed a five-month moratorium on facility closures
      and consolidations; Donahoe says senators asked for it to preserve
      stability for employees and customers while legislation moved, that he
      did not think the request unreasonable, and that consolidations will
      be done carefully over the following year. Asked which parts of H.R.
      2309 the Service supports, he names the FERS refund, the ability to
      consolidate the network, and moving from six-day to five-day delivery.
      On a Postal Service-sponsored health care program worth over 7 billion
      dollars in annual savings, he says they would competitively bid it
      like any company, using a large administrator and HMOs to fill gaps,
      and expects a plan could be ready by 2014.
