Transcription:

  Video:
    Title: "Rep. Justin Amash - Floor speech on Libya Amendment"
    Description: >-
      A House floor speech supporting the Amash-Kucinich amendment, which
      would prohibit funds from being used for military force against Libya.
      The member thanks Rep. Kucinich for his leadership and says bipartisan
      support is growing. He argues the United States has been at war
      against Libya for nearly four months, having dropped bombs on Libyan
      buildings and flown sorties over Libyan airspace, with reports that
      Gaddafi himself was targeted, and that the Constitution vests Congress
      with the exclusive power to declare war while the President has not
      sought authorization. He mocks the description of the operation as
      'limited' by analogy, saying constituents would be surprised if
      Congress established a limited religion, imposed limited cruel and
      unusual punishment, or quartered soldiers only for a limited time. He
      rejects a UN Security Council resolution and an invitation from an
      organization of Arab states as sources of constitutional authority,
      and calls the administration's claim that the strikes do not amount to
      'hostilities' transparently strained, asking whether the same bombing
      of American infrastructure would be viewed as hostile. He says a
      member of the other chamber called the arguments 'cute' and that he
      would call them embarrassing, but that Congress doing nothing would be
      more embarrassing still. He states his view that the use of force is
      already illegal absent authorization and that the amendment, effective
      from the start of the fiscal year on October 1, merely reinforces
      Congress's constitutional position without implicitly authorizing
      anything. The legal analysis is his own argument to the chamber.
