Transcription:

  Video:
    Title: "Rep. Justin Amash - Oversight hearing on postal service (March 2, 2011)"
    Description: >-
      A five-minute round of questioning at a House oversight hearing on
      Postal Service finances, with Postmaster General Donahoe and other
      witnesses on the panel. The member asks whether the Postal Service
      would break even without the retiree health pre-funding requirement;
      Donahoe says the plan shows an operating income loss of about 900
      million dollars but that with administrative cost reductions of 750
      million and other changes the goal would be to make 100 million this
      year if forgiven the prepayment. The member then introduces a
      September 2004 letter from the Office of Personnel Management to
      former Postmaster General John Potter rejecting the claim that the
      Postal Service overpaid into the Civil Service Retirement System,
      including a statement from the CSRS Board of Actuaries that OPM had
      appropriately and accurately determined the obligations, and asks
      Donahoe to respond. Donahoe says he disagrees with the letter, citing
      the Inspector General and external actuaries estimating a 75 billion
      dollar overpayment, while a Postal Regulatory Commission witness says
      its own outside actuaries estimated 50 to 55 billion and describes its
      analysis as objective and free of preconceptions. The member then asks
      a GAO witness whether the Postal Service should be able to renegotiate
      collective bargaining agreements; the witness suggests Congress
      reconsider whether binding arbitration should take the Service's
      ability to pay into account, and says liabilities and obligations now
      exceed 100 billion dollars, making this the time for hard decisions
      about the organization's future footprint. The competing overpayment
      figures are the witnesses' own and are in open disagreement with one
      another.
