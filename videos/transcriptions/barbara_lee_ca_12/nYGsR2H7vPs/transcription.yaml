  Video:
    Title: "NPR on Oakland"
    Description: >-
      An April 2013 NPR 'Code Switch' radio report, reposted on Rep. Barbara Lee's channel. Barbara Lee does
      not speak in it. Reporter Shereen Marisol Meraji examines demographic change in Oakland, California,
      once a center of West Coast Black culture. She reports a drop of nearly 25 percent in Oakland's Black
      population over two decades, attributed in the piece to rising rents and violent crime. The report talks
      with comedian Chris Riggins about 'New Oakland' versus 'Old Oakland', and with Dave Ward about his
      father 'Sweet Jimmy' Ward's nightclub, whose investors included Huey Newton. It also hears from New
      Parish club owner Michael O'Connor and from a high-school student who listens to music by Pacific
      Islander artists from Oakland. The automatic transcript contains a long run of repeated 'Oak-' syllables
      where the audio is a chant or music bed.
