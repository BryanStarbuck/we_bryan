    Title: "Rep. Barbara Lee testifies on NDAA priorities before the House Armed Services Committees"
    Description: >-
      Rep. Barbara Lee's testimony to the House Armed Services Committee in May 2013 on what she wants in the
      Fiscal 2014 National Defense Authorization Act. After the chair recognizes 'Ms. Lee', she asks the
      committee to keep the long-standing ban on permanent U.S. military bases in Afghanistan. She says there
      is no military solution there and calls for withdrawing all troops and contractors as soon as it is
      safe. She argues the Pentagon should face the same sequestration limits as other agencies, and opposes
      any expansion of the 2001 Authorization for Use of Military Force. She recalls casting the lone vote
      against it on September 14, 2001, calls it a 'blank check', and urges its repeal. She closes by asking
      for financial consequences unless the Pentagon passes an audit. Her figures for losses to waste, fraud
      and abuse are her own assertions.
