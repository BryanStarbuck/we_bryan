    Description: >-
      An April 2013 segment of the TV program 'What America Thinks with Scott Rasmussen', in which the host
      presents polling on whether the economy and the justice system are fair to middle-class and low-income
      Americans, then interviews Rep. Barbara Lee, a Democrat from California. She says the numbers reflect
      generations of unfairness, and praises the president's budget over the Ryan budget while opposing its
      chained-CPI Social Security cut. She defends the earned income tax credit, the child tax credit, SNAP
      and job training as pathways out of poverty. She calls for a regional living wage indexed to inflation,
      which she puts at about $25 an hour in California. On criminal justice she recounts voting against
      California's three-strikes law. She criticizes the crack/powder sentencing disparity and the bars on
      housing, Pell Grants and food aid for people with records. Diarization returns 22 clusters for what is
      essentially a two-person interview, so no cluster is mapped to either speaker.
