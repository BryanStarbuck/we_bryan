Transcription:

  Video:
    Title: "How Tommy Chong Encouraged Jordan Belfort to Write “The Wolf of Wall Street”"
    Description: >-
      An interview segment in which Jordan Belfort tells Tucker Carlson how
      he came to write 'The Wolf of Wall Street'. He describes going to
      prison at 41 on a 22-month sentence, the difficulty of telling his
      children, and being celled with Tommy Chong, who was serving a year
      and a day for selling bongs. Chong pressed him to write a book after
      checking his stories were true. Belfort recounts teaching himself to
      write in the prison library by using Tom Wolfe's 'Bonfire of the
      Vanities' as a textbook, writing about a hundred pages, tearing them
      up, and starting again after release; a book agent asked whether Tom
      Wolfe had written his first pages. He describes the year of eighteen-
      hour days that produced the manuscript, cutting it from a thousand
      pages to five hundred over seven edits, a bidding war between Brad
      Pitt and Leonardo DiCaprio, and the five-year delay from the writers'
      strike that let the film's third act be rewritten as a comeback story
      after he rebuilt his wealth speaking and training salespeople. The
      closing portion turns to drugs and sobriety, including Quaalude
      withdrawal and his view that someone has to be ready to get sober
      regardless of where they are. This is a personal and career narrative
      with no political content.
