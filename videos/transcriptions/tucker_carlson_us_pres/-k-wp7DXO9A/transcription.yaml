  Video:
    Title: "Curt Mills: Trump Can Save America or Wage Another War, but He Can’t Do Both. Here’s Why."
    Description: >-
      An 85-minute interview by Tucker Carlson with Curt Mills, recorded in late
      January in the days after Donald Trump's second inauguration and just
      before
      Tulsi Gabbard's confirmation hearing. The framing question is whether the
      Trump
      administration's foreign-policy appointments represent a genuine break
      with what
      both men call the neoconservatives, or whether that establishment will
      reassert
      control. Mills opens on Pete Hegseth's confirmation as defense secretary
      on a
      50-50 vote, arguing that while clips from a decade ago show a conventional
      Republican, the people Hegseth has chosen to surround himself with are
      'stark
      departures' from that earlier position, and that he did not need those
      picks to
      be confirmed. Carlson characterises the Pentagon as the largest
      bureaucracy on
      earth, existing to serve itself, with an abysmal record of winning wars
      and a
      great one of spending money. The longest and most consequential stretch is
      Mills'
      reading of Israeli domestic politics, and all of it is his own analysis
      rather
      than reporting of established fact: he argues Benjamin Netanyahu's
      position is
      unstable, that a supermajority of Israelis want him to resign, that he
      will not
      because doing so may expose him to prison, and that on that logic only
      wartime
      conditions sustain him in office. From that premise he lays out what he
      sees as
      the remaining options — a return into Gaza once hostages are exchanged, or
      annexation and settlement of the West Bank — and states as the 'unstated
      thing'
      that the population there would be exported or eliminated. Carlson calls
      this
      terrifying, and Mills' stated concern is that the United States
      underwrites it as
      arms supplier and bears the reputational cost. The third option he
      discusses is
      Iran, which he says Israel cannot strike without US participation. Both
      men also
      describe a years-long atmosphere of mistrust between Trump and Netanyahu
      dating
      at least to the 2020 election and the Soleimani strike. A further section
      praises
      Steve Witkoff as a non-professional negotiator who secured a ceasefire
      quickly,
      notes reporting that he was given 'the Iran file', and argues Trump should
      follow
      his first-term withdrawal from the JCPOA with a Trump-Iran deal; Mills
      invokes
      Obama's 2008 position on meeting Iranian leaders and Trump's own meetings
      with
      Kim Jong-un as precedent. They also discuss Pakistan's nuclear programme
      and its
      export of technology, which Mills attributes to a Nixon-era tilt away from
      India,
      and argue about US non-reaction to it. Carlson's stated position
      throughout is
      that American power has limits and that priorities must be ranked against
      domestic needs. The interview ends with Carlson saying he expected to be
      more
      depressed by the conversation and instead feels heartened, followed by a
      Black
      Rifle Coffee read, a promo for a documentary about Anthony Fauci, and a
      closing
      appeal claiming YouTube is suppressing the channel. IMPORTANT: the
      assessments of
      Netanyahu's motives, of what Israel intends in the West Bank and Gaza, and
      of
      what any official privately believes are the speakers' own contested
      analysis and
      speculation. No official or government named here appears to answer, and
      none of
      this should be read as established fact.
