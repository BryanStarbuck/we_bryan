Transcription:

  Video:
    Title: "Tucker and Roseanne Barr React to Her Viral Trump Speech"
    Description: >-
      An 11-minute interview in which Tucker Carlson talks with Roseanne Barr,
      prompted by a viral clip of a speech she gave at a Trump rally. Carlson
      opens by
      saying that attempts to silence Barr recur every few months and are not
      working,
      and that after nearly forty years in public life she is more influential
      than
      ever. Barr's own account runs through the conversation: the cancellation
      of her
      show relaunch while it was rating first, which she says taught her that
      television is always personal; her refusal to go away afterwards; and her
      sense
      that she is now, in her words, 'a lady citizen journalist for my old age'.
      A
      long digression has her trying to recall the name of a 1950s interviewer
      she
      admired — she eventually lands on Mae Brussell, whom she says her father
      watched
      and called a woman of integrity. She describes herself as a deeply
      religious Jew
      and recounts a conversation she says she has had with God since the age of
      three
      from an Orthodox upbringing, including an exchange about why God does not
      simply
      fix the world ('Because I don't have fingers, Roseanne, but you do'). She
      lists
      the labels she says have been thrown at her from both the left and the
      right over
      the years — Nazi, antisemite, racist, transphobe, Zionist, and earlier a
      cow and
      a man-hater — and says none of it was ever true. The rally clip itself is
      played,
      in which she leads a crowd in obscene chanting against 'the deep state'
      and calls
      on Trump to 'kill that goddamn bull'. Asked what she thinks of Trump
      personally,
      she says he is the only person in her Hollywood career who ever returned a
      favour, credits him with integrity and comic timing, and describes a week
      spent
      at Mar-a-Lago. She also states, as her own view, that people should stop
      having
      sex unless married and able to raise the resulting children. Every
      characterisation here — of Trump, of her critics, of why her show was
      cancelled —
      is Barr's or Carlson's own and is contested; nobody they describe is
      present to
      answer. The video ends with a promotional read for TuckerCarlson.com.
