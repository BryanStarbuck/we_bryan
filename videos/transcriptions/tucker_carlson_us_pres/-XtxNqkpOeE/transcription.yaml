    Title: "Tucker’s Heated Debate With Kevin O’Leary"
    Description: >-
      A 79-second clip of a heated on-camera exchange over a large data-centre
      project proposed for rural Utah. One speaker argues that the United States
      is
      copying China's surveillance apparatus — he calls China 'a panopticon'
      that
      grants its citizens no real rights — and says the plan amounts to taking
      40,000
      acres in Utah and making it possible for the government to know where a
      person
      is at all times and what they are thinking. The other side of the
      argument,
      which the transcript attributes to Kevin O'Leary, is that the United
      States has
      to beat China on compute power and should then use its own laws to keep
      that
      power in check; he says he will not 'put down my shovel'. The exchange
      turns on
      the county approval: O'Leary points to a three-to-zero vote by the Box
      Elder
      County commissioners and calls that the will of the county, and his
      challenger
      replies that three elected commissioners are easy for Amazon, Google and a
      $15 billion investor to bring onside. O'Leary's closing line is that the
      county
      'asked us to come, they asked us to bring $15 billion'. Every
      characterisation
      here is the speakers' own and is contested between them; the clip is an
      argument,
      not a finding, and no county official appears to answer for the vote.
