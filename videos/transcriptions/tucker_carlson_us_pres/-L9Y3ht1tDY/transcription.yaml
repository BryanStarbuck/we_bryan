  Video:
    Title: "Political Assassinations, the Unexpected Player in the Iran War and Israel's Latest Bombing Campaign"
    Description: >-
      A long interview between Tucker Carlson and retired Colonel Lawrence
      Wilkerson, former chief of staff to Secretary of State Colin Powell,
      on the war involving the United States, Israel and Iran. Wilkerson's
      opening argument is that the conflict has players beyond the obvious
      ones and that China's role was forced on it: he says a recently
      completed Belt and Road railroad running from China's Pacific ports
      overland toward the Persian Gulf and the Caucasus is now being bombed
      by Israel and the United States, and takes that as evidence there is
      more to the war than is publicly known. He describes what he presents
      as the Chinese strategic view — that they intend to win without a war,
      and that a recent Xi Jinping edict declares China dominant in every
      element of global power except financial control, which it now means
      to take by substituting the renminbi for the dollar, dismantling the
      Bretton Woods system, eliminating SWIFT and ending American sanctions
      power. He also asserts that U.S. sanctions since the turn of the
      century have killed 38 million people, a figure he compares to
      Stalin's purges and the Cultural Revolution. The conversation goes on
      to Israeli bombing campaigns in Lebanon and Gaza, the assassination of
      Charlie Kirk and his complaint that the FBI has been unforthcoming,
      and Netanyahu's conduct. Every one of these claims, figures and
      attributions of motive is Wilkerson's own; they are strongly
      contested, several are not independently verifiable, and the people
      characterised are not present to answer them. The transcript is a
      record of what he argued, not an endorsement of it.
