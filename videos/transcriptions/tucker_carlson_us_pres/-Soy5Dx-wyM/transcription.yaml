  Video:
    Title: "Catturd on Trump's VP Pick, Animal Rescues, and Why He Hides His True Identity"
    Description: >-
      A long-form Tucker Carlson interview with the anonymous X account
      Catturd, who appears on camera but keeps his legal name private.
      Carlson's monologue opens the episode with a sustained attack on Joe
      Biden, whom he calls actually evil, dishonest and cruel — his
      characterisation, stated in his own voice, about a person not present.
      He then recounts a public clash between Catturd and former
      Representative Adam Kinzinger, whom he mocks at length, and frames the
      segment around the question of why an anonymous poster provokes so
      much establishment anger. Catturd gives an unusually candid personal
      history: raised in Georgia, now in the Florida panhandle, he enlisted
      at 17, spent his eighteenth birthday in basic training, was injured in
      Germany, had back surgery and took an honourable medical discharge. He
      describes drifting through jobs, two failed marriages, a stint as a
      professional musician and a hippie period, drug and alcohol problems
      into his forties, then steady work in fiber optics, and says he first
      joined Twitter at 54 with no social media experience and picked the
      name on a whim, never expecting a hundred followers. The conversation
      also touches Trump's vice presidential pick, his animal rescue work,
      and why he protects his identity. It closes on Carlson's line that
      free speech is bigger than any one person and that societies are
      defined by what they will not permit.
