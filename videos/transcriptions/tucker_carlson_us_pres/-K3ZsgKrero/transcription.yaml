  Video:
    Title: "Tucker’s Neighbor on Rural America, Overcoming Addiction, and Donald Trump"
    Description: >-
      A 42-minute studio interview by Tucker Carlson with Esau Cooper, an
      excavator,
      logger and lawnmower-racing champion from a small town in the Western
      Maine
      mountains. Carlson explains in the opening that he met Cooper buying pizza
      at a
      general store during hunting season and that Cooper asked to be
      interviewed. The
      first stretch is about rural work and sport: how a ride-on mower is made
      to do
      25-30 mph by changing the pulleys and removing the governor, why logging
      stops
      during mud season when the roads are posted, and the death of a friend of
      Cooper's the previous year who cut a second tree in the line of a hung-up
      one.
      The longest section is Cooper's account of addiction and recovery, told in
      detail: his father's death when he was six, moving to Andover at ten and
      running
      away on his ten-speed, the death of one of his two closest friends in a
      car crash
      when he was nineteen, a first attempt at rehab at thirteen that he
      refused, a
      detox at fifteen after taking too many Valium, being expelled from a
      28-day
      programme on day 21 for throwing a lighter at a nurse, seven years laying
      natural
      gas pipelines with what he describes as cocaine in his morning coffee and
      smoking
      crack through the night, and finally deciding at 31 — after a drive east
      where he
      chose home over the next job, afraid his mother would attend his funeral —
      to
      walk into a 12-step meeting. He says he has been sober twenty years in
      March,
      credits a sponsor named Kip Cummings with teaching him 'how to be a
      grown-up',
      and says he continued smoking marijuana for years afterwards while feeling
      like a
      hypocrite, quitting that on 13 March 2021. He voted against legalisation
      in
      Maine, and argues from his own experience that marijuana is insidious
      precisely
      because its harm is mild and hard to see. He describes his faith in God
      and Jesus
      Christ as what replaced the substances. The closing third is politics, and
      all of
      it is Cooper's stated opinion: that his freedoms are being taken away
      daily, that
      what is being done to Trump is political persecution and 'lawfare', that
      the
      country has turned from God and is cursed, that Trump is popular in rural
      America
      because it is blue-collar and has few 'educated elites', that Trump is
      pro-business and 'anti-swamp' because a bureaucracy's first job is to
      enlarge
      itself, and that there is no free press left because only Republicans are
      held
      accountable. He says he stopped watching Fox News entirely on the day
      Carlson was
      fired, on principle, and now watches Newsmax. He objects to Maine's
      Secretary of
      State over the attempt to remove Trump from the primary ballot, describes
      a
      liberal friend he stays friendly with, and accepts the label 'sexist' when
      she
      applies it. He also recounts being turned down by the Army before Desert
      Storm
      after answering a general's questions honestly about his partying. He ends
      by
      saying he would shake Trump's hand, offer to help, and give him his vote.
      Every
      political claim here is one rural voter's own opinion, offered as such,
      and
      nobody he criticises appears to answer; the interview is a portrait of a
      person
      rather than a report on the events he describes. The video closes with a
      promotional read for TuckerCarlson.com.
    URL: "https://www.youtube.com/watch?v=-K3ZsgKrero"
