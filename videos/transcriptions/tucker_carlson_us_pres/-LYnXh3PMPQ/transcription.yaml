  Video:
    Title: "Jordan Belfort: Wall Street Is Evil. But Here's Why We Need It."
    Description: >-
      A 51-minute interview (posted 30 December 2023) in which Tucker Carlson questions Jordan Belfort, the
      former stockbroker whose securities fraud became the film 'The Wolf of Wall Street', about how ordinary
      people should invest and about the parts of the market he says are rigged. Belfort's advice is that the
      individual investor cannot beat the market and should buy a broad index such as the S&P 500, hold for
      decades and reinvest dividends rather than trade, time the market or pick stocks; he is scathing about
      televised stock tipping and says he criticises Jim Cramer at length in his book. He then draws a line
      between outright insider trading of the kind depicted in 'Wall Street' and what he describes as a large
      grey area in which hedge funds buy near-inside research, and he argues that lobbyists briefing funds on
      what is happening inside companies sits close to that line. Asked about members of Congress
      outperforming the index, Belfort says he does not believe it is possible without non-public information
      and that legislators should be barred from trading individual stocks; he names Nancy Pelosi, and both
      men go on to make accusations about Joe Biden and his family, including Belfort's remark that Biden is
      'great at laundering money'. Those characterisations are the speakers' own, are contested, and the
      people named are absent and unable to answer them; no evidence for them is offered in the conversation.
      Belfort also says his own fraud conviction was deserved while arguing that almost nobody was jailed
      after the 2008 crisis, discusses Martha Stewart and Sam Bankman-Fried, and describes his addiction to
      Quaaludes and other drugs, the escalating combination he was taking before his arrest, and getting
      sober in 1997 after rehab. He recounts teaching himself to write in prison by studying Tom Wolfe's
      'Bonfire of the Vanities'.
    URL: "https://www.youtube.com/watch?v=-LYnXh3PMPQ"
