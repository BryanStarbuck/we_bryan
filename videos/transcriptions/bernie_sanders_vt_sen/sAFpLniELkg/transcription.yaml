      A short campaign-style clip from Senator Bernie Sanders' channel in
      which several borrowers, not the senator, do almost all of the talking
      about long-running student loan debt. One says they started school in
      1997 and have been paying for roughly thirty years, in and out of
      default, with wages garnished, and offers pay stubs as proof. Another
      says they borrowed close to $40,000 in the 1990s and describes the
      interest compounding faster than they can pay it down. A third breaks
      down describing what restarting garnishments would mean for their
