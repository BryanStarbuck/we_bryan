    Title: "China's Energy Problem and Dealing with the Taliban || Peter Zeihan"
    Description: >-
      A long-form argument that China cannot secure its energy supply, triggered by a regional commander of
      the TTP — the Pakistani Taliban — publicly offering to permit Chinese infrastructure work through
      Pakistan in exchange for 5% protection money, with an explicit threat to attack sites and workers
      otherwise. Zeihan uses this to make a structural point: earlier imperial powers and the US had multiple
      proximate energy sources and routes, whereas China arrived late, found Southeast Asia largely tapped,
      and is left with the Persian Gulf. He walks the route's chokepoints — having to choose between Iran and
      the far larger Saudi exporter, then passing India, Singapore, Australian missile range, Vietnam, the
      Philippines and Taiwan, under the reach of the US and Japanese navies — and argues a Pakistani overland
      pipeline over mountain passes is impractical. His conclusion is that China is the most strategically
      vulnerable major power in history, dependent on a security order it cannot protect, influence or
      replace. He closes with a qualification: the vulnerability is in oil-derived liquid fuels, while
      domestic low-quality coal can keep the lights on at severe environmental cost. The TTP statement is
      reported; the strategic conclusions are his analysis.
