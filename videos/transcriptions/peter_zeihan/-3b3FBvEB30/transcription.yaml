  Video:
    Title: "Joe Biden Finally Heads to Angola... (Video Repost) || Peter Zeihan"
    Description: >-
      A field commentary from Washington DC on a planned Joe Biden trip to Angola. Zeihan sketches the Cold
      War background — the US and the Soviets, Cubans and later Chinese on opposite sides of Angola's civil
      war, with American oil companies helping the Soviet-backed government produce crude for Europe — and
      argues the visit is not really about oil, since the US is now the world's largest crude producer and
      refined-product exporter. His thesis is that the interest is mining: the copper belt of southern Congo
      currently reaches port via a degraded rail spine through Zambia, Zimbabwe and Botswana to South Africa,
      and the Lobito Corridor and Benguela Railway across Angola would give that traffic an Atlantic outlet
      closer to the US and Europe than to China. He notes the Angolans are encouraging the competition for
      infrastructure money, that the civil war's winners are a minority, and expects the railway operational
      within a couple of years while asking whether it is 'too little, too late'. The judgement that post-
      apartheid South African government has become dysfunctional is his own assessment. A squirrel interrupts
      the recording.
