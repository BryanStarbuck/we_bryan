  Video:
    Title: "America’s Changing Republican Party || Peter Zeihan"
    Description: >-
      Recorded on the final day of the 2024 Republican National Convention, this is Zeihan's reading of a
      party in structural flux — part of what he calls the late stage of the sixth American party structure,
      in which factions realign every generation or two. He identifies three changes from the older Republican
      identity of social conservatism, internationalism, hawkishness and broad pro-business politics. First, a
      softer line on social issues such as abortion and gay rights, reframed as questions for the states,
      which he says has upset social conservatives but which Trump can absorb given his hold on the party.
      Second, a shift from international involvement toward isolationism — armed but disengaged — which he
      links to the first term's handling of Ukraine and of the unenforced phase-one China trade deal. Third,
      and the one he finds most striking, a turn from business toward organised labour, citing a Teamsters
      representative addressing the convention and criticising the Chamber of Commerce, and platform language
      against right-to-work laws; he connects this to a doubling of US industrial plant creating organisable
      blue-collar work. He notes Ron DeSantis's evident anger and Nikki Haley's awkward reception, and that
      Haley and Mike Pence have both formed think tanks. His characterisations of individual politicians are
      personal impressions, and he stresses the realignment is not settled.
