  Video:
    Title: "Winners and Losers of the Iran War: Ukraine and Russia || Peter Zeihan"
    Description: >-
      Part of a series on the consequences of a war involving Iran, this entry examines Russia and Ukraine.
      Zeihan sets the scene with regional crude exports falling from 22 million barrels a day to perhaps 10–12
      million, a shortfall he says will persist at least nine months after fighting stops and over two years
      for some Iraqi production, with the effect shifting from a throughput failure to a supply failure as the
      last pre-war tankers arrive in Asia and Europe. He states the initial conventional wisdom — Ukraine
      disadvantaged by Western distraction and diverted interceptors, Russia enriched by oil above $100
      against break-evens of $30–50 — and then argues five weeks in that it has become more nuanced. On
      Russia: providing intelligence and hardware to Iran to target US forces has, he says, shifted opinion in
      the Defense Department and on Capitol Hill, while Ukrainian long-range drones have removed 1.5–2 million
      barrels a day of Baltic export capacity with no backup pipeline. On Ukraine: a year operating without US
      assistance drove counter-drone innovation, and he describes a system costing $2,000–3,000 against
      $30,000–50,000 for a Shahed, with Zelensky signing multi-billion-dollar Gulf investment deals since
      Ukraine's constraint was cash rather than ideas. He closes by comparing the emerging
      European–Ukrainian–Gulf alignment to the 1985 Saudi production surge against the Soviet Union. The
      remark that Trump 'remains firmly in Putin's pocket' is an unevidenced characterisation of a named
      living person who is not represented here; the scenario as a whole is the speaker's analysis of a fast-
      moving situation.
