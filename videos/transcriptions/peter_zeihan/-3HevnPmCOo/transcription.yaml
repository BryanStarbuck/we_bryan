  Video:
    Title: "Myanmar Is More Important Than You Think || Peter Zeihan"
    Description: >-
      Recorded in Yosemite, with an appended Patreon question-time announcement, this clip argues that Myanmar
      matters more than its profile suggests, prompted by the ruling junta scheduling elections for 28
      December. Zeihan gives three reasons. First, supply chains: he holds that China is demographically
      finished, so manufacturing must be rebuilt elsewhere, and multi-step supply chains need a low-end
      assembly tier for which Myanmar is suited — comparable in skills to 1980s Mexico, and unusually for Asia
      served by a navigable river, the Irrawaddy, which makes cargo movement cheap. Second, narcotics:
      minority groups fund the civil war through the heroin trade, and past transfers from military to
      civilian rule have coincided with reduced production. Third, China directly: hemmed in by the First
      Island Chain and unable to break through it, China wants an overland route bypassing the Strait of
      Malacca, and historically loses its Myanmar investments when civilians take power. He cautions that
      Myanmar democracy is not comparable to elsewhere, noting the military is drawn from the Burman majority
      and that minority policy did not improve under Aung San Suu Kyi. The forecast of Chinese collapse and
      the election's outcome are his own predictions.
