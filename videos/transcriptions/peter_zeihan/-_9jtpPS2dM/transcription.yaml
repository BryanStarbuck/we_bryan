  Video:
    Title: "Can Immigration Solve China's People Problem? || Peter Zeihan"
    Description: >-
      Answering a Patreon question on whether immigration could solve China's demographic problem, Zeihan
      argues it cannot, at the required scale. He first notes China's actual practice is not immigration but
      sending students abroad for skills and recovering perhaps a third to a half. He then offers three
      comparisons: Canada, which admitted roughly four million mostly under-40 migrants over 15–17 years,
      stabilising its tax base and workforce but producing a housing shortage with political consequences he
      links to the Trudeau government's likely fall; and Germany, where he traces falling births to 130 years
      of industrialisation and especially post-1990 reunification, arguing the trillion-euro rehabilitation of
      the east failed, young people left, and that the roughly one million Syrian refugees admitted were about
      850,000 men and were taken in for moral rather than demographic reasons. He calculates Germany would
      need two million under-25s a year indefinitely, remarking it would then no longer be Germany, and sets
      out two conditions for immigration to work: start early, and preserve assimilative capacity. For China
      he cites official fertility near 1.2, probably below 1, and 0.4–0.5 in Shanghai and Beijing, and a
      population revised from 1.3 billion toward 1.1 billion or less, requiring perhaps 30 million under-25
      migrants a year. He forecasts workforce, financial and state-coherence collapse within a decade. These
      are the speaker's forecasts, and the population revisions he cites are contested.
