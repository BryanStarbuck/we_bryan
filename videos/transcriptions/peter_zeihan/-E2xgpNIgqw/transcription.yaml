    Title: "Magyar Tries to Rebuild the Visegrád Group || Peter Zeihan"
    Description: >-
      Filmed at an Italian monastery, this clip covers the new Hungarian prime minister's first foreign trip,
      to Warsaw to meet Poland's Donald Tusk. Zeihan is careful to say what the meeting is not: not an
      ideological alliance, since the Hungarian leader is firmly of the right while Tusk is centre-left and an
      avowed pan-Europeanist, and the two disagree on domestic questions. He characterises the Hungarian
      transition as one from corruption to conservatism rather than right to left, and reports that former
      ministers have left the country expecting prosecution. What he argues it is instead is strategic: a
      revival of the Visegrád Group of Poland, Hungary, the Czech Republic and Slovakia, dormant for a decade.
      Because the EU Council uses weighted majority voting requiring both a number of states and a population
      share, he calculates the four together carry more voting weight than France or Italy for a similar
      population, letting central Europe bargain on equal terms — with Russia and Ukraine the immediate issue
      and budgets the everyday one. The characterisations of Viktor Orbán as corrupt and pro-Russian, and of
      Robert Fico, are the speaker's own assessments of named living politicians who are not represented here.
      Note: the transcript renders the Hungarian prime minister's name as spoken and it is not independently
      verified in this record.
