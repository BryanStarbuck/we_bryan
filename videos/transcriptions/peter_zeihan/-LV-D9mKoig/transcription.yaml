  Video:
    Title: "Where in the World: Quartzite and Greentech"
    Description: >-
      A comparison of solar and wind power, recorded in the Sierra Nevada. Zeihan argues photovoltaic solar is
      oversold: silicon is common and quartz widely mineable, but refining to solar grade requires a blast
      furnace, nearly half is done in China using coal, and much panel assembly happens in Xinjiang-adjacent
      supply chains he describes as using slave labour — so the front-end carbon and human-rights costs are
      high. The decisive problem in his account is placement: panels in high-elevation sunny locations perform
      well but few people live there, while in Seattle, Toronto, New York, London, Stockholm, Shanghai or Hong
      Kong they generate under a fifth as much, meaning many such cities never repay the carbon debt, with
      transmission over 500 miles as a further cost. He rates wind materially better: non-toxic manufacturing
      largely in the US and Denmark, turbines grown from 100 feet to nearly 800 which quadrupled viable areas
      and reach stronger, more reliable currents, roughly three to four times the electricity per dollar, and
      — unlike solar, which generates nothing after sunset while peak demand is after 6pm — a contribution to
      baseload and peak. He concludes the 'mystique' around solar makes it part of the environmental problem
      in many locations. The comparative figures are his own and are contested.
