  Video:
    Title: "Copper Imports Slapped with 50% Tariff || Peter Zeihan"
    Description: >-
      Zeihan criticises a 50% US tariff on copper imports taking effect 1 August. He lays out the steps
      required to raise domestic copper output — exploration, heavy-freight road and rail, ore processing, an
      intermediate blister-copper facility at about 98% purity, then a full smelter — and puts the end-to-end
      timeline at ten to fifteen years, arguing a front-end tariff retards rather than accelerates it, and
      that tax credits for exploration plus infrastructure and smelter construction would be the sensible
      first step. His larger concern is that the US has limited time to roughly double its industrial plant
      before, on his forecast, China ceases to be a supplier, and that three of the four key inputs — copper,
      steel and aluminium — are each now 50% more expensive because of tariffs. The fourth input is
      construction labour, historically supplied by immigrants from Mexico and Central America; he argues the
      deportation programme targets people whose whereabouts are known — churches, court hearings, revoked
      humanitarian status — because pursuing those with criminal convictions is slower. He concludes the
      industrial boom he has forecast may be lost. He ends with a pointed insinuation that Trump is acting as
      though prompted by a Russian agent; that is rhetoric and an unevidenced accusation about a named living
      person who is not represented here.
