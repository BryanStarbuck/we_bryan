  Video:
    Title: "Kari To Newsmax: Gov. Newsom spends more time running his mouth than running his state."
    Description: >-
      A Newsmax interview (January 2025) with Kari Lake during the Los Angeles wildfires. Lake draws on
      Arizona's own fires, including the Yarnell fire that killed 19 wildland firefighters, and blames what
      she calls incompetence by California officials. She says Governor Gavin Newsom 'spends more time running
      his mouth than running the state' and cites empty fire hydrants, a lack of forest thinning and
      reservoirs, and his COVID-era mandates. She also criticises Los Angeles Mayor Karen Bass for being in
      Africa when the fires began. After a clip of Newsom warning of 'hurricane force winds' of
      disinformation, Lake rejects the disinformation framing and says officials should be voted out, and she
      questions California's mail-in voting. The host discusses State Farm's cancellation of 72,000 policies
      and argues that California's rate caps and lack of brush clearing drove insurers out. Lake blames
      environmentalists and says help will come from the incoming Trump administration. These criticisms of
      Newsom and Bass are the speakers' own, and neither official is present to respond.
