    Description: >-
      A Fox Business interview (April 2024) with Kari Lake as the Republican candidate for U.S. Senate in
      Arizona, focused on abortion after the Arizona Supreme Court revived the state's 1864 abortion ban. Lake
      describes herself as pro-life but says, in agreement with Donald Trump, that Arizona's law should be
      updated to include exceptions for rape, incest and the life of the mother. She accuses Kamala Harris and
      her Senate opponent Ruben Gallego of favouring abortion up to birth, a characterisation that is hers and
      is disputed, and argues Democrats emphasise abortion because of the border, drug addiction and
      homelessness in Tucson, and the economy. She responds to Governor Katie Hobbs, who on ABC's The View
      said Lake had praised the 1864 ban in 2022, by calling Roe v. Wade unconstitutional and urging support
      for mothers, adoption and family-friendly policy. Neither Harris, Gallego nor Hobbs is present to
      respond.
