    Title: '"Tish James will look really good in orange; it might be her color." Kari Talks Karmic Justice'
    Description: >-
      A short cable-news-style segment (October 2025) in which hosts interview Kari Lake about the federal
      indictment of New York Attorney General Letitia James over alleged mortgage-document irregularities.
      Lake says she does not see the charge as retribution but as 'law and order', predicts it will be 'an
      open and shut case', and jokes that James 'will look really good in orange.' A host argues the
      prosecution is justified payback for the New York cases against Donald Trump, and the conversation
      broadens into claims about crime in Democratic-run cities, Zohran Mamdani's New York mayoral bid, and
      Lake's call to end mail-in ballots and return to single-day voting, which she argues would produce
      'common sense' officeholders. The characterisations of James and of the cities are the speakers' own and
      are contested; James is not present to respond, and the charge was an unproven allegation at the time.
