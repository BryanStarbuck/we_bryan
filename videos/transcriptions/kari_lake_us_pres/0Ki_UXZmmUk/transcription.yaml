    Description: >-
      Kari Lake's stump speech opening her Make Arizona Grand Again bus tour
      in Prescott, Arizona, recorded in July 2024 during her U.S. Senate
      campaign; it is a single speaker addressing an outdoor crowd in the
      heat. She recounts arriving in Arizona as a journalist in 1994 and
      says she left that career because she saw it as 'fake news'. She
      argues life has become hard under what she calls the 'Biden regime'
      and her opponent Ruben Gallego, puts illegal border crossings at 12
      million, and proposes building the wall, reinstating Remain in Mexico
      and ending catch and release. She asserts Joe Biden is not fit to
      finish his term, says the media has been lying about this and about
      the economy, and warns that his foreign policy risks drawing the
      country toward World War III, while thanking veterans in the crowd.
      Most of the speech is organising: she asks supporters to talk to ten
      friends, check they are registered, reach out to independents and
      Democrats, vote in the July primary for Trump-endorsed candidates, and
      put a bumper sticker on their cars. She describes Gallego as a far-
      left Democrat from Chicago who supports open borders and sanctuary
      cities, marched at defund-the-police rallies and backed ending the
      filibuster, and says Democrats cut Medicare and will go after Social
      Security next; these characterisations of an absent opponent are hers
      and are contested. The ASR garbles several names ('Carrie Lake', 'Ruby
      Guy').
