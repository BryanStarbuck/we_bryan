    Description: >-
      A television interview in which Kari Lake, introduced as acting CEO of the U.S.
      Agency for Global Media, reacts to Nancy Pelosi's retirement and then discusses her
      agency's funding decisions. The Pelosi segment is hostile throughout: the host opens
      by calling her a vile creature, and he and Lake go on to mock her stock trading, her
      kente cloth appearance after George Floyd's death and her manner at news conferences.
      Lake says Pelosi framed patriotic Americans over January 6th, failed to protect the
      Capitol, blamed President Trump and attempted a coup, and suggests she could spend her
      retirement behind bars. Those are the speakers' assertions rather than findings, no
      evidence is offered for them, and Pelosi is absent and does not respond. In the second
      half Lake explains a formal congressional notification to defund U.S.-funded
      Hungarian-language radio, arguing American taxpayers should not pay for what she calls
      globalist programming meant to destabilise a NATO ally, timed to a meeting between
      President Trump and Prime Minister Viktor Orban.
