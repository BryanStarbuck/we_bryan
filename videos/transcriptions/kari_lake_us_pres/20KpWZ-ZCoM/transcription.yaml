  Video:
    Title: "Kari to Newsmax: Dems in Disarray, AZ GOP is UNITED!"
    Description: >-
      A Newsmax interview (August 2024) with Kari Lake, then the Republican candidate for U.S. Senate in
      Arizona, broadcast live from the campaign trail in Apache County on the Navajo Nation. Asked about
      Donald Trump's conversation with Elon Musk, Lake contrasts what she calls Trump's authenticity with
      Kamala Harris, whom she calls a 'phony' who changes her policies depending on her audience. After a clip
      of Congressman Eric Swalwell defending Harris, Lake repeats the allegation that Swalwell had an affair
      with a Chinese spy and says the Biden administration is too close to the CCP; Swalwell is not present
      and has denied wrongdoing. She criticises Harris's no-tax-on-tips position as late. The connection drops
      briefly, then Lake welcomes former Governor Doug Ducey's endorsement, says Arizona Republicans are
      united while Democrats are in disarray, and says her opponent supports sanctuary cities, open borders
      and defunding the police. That description of her opponent is her own campaign characterisation.
