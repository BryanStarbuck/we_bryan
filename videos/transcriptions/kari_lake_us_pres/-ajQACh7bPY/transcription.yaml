Transcription:

  Video:
    Title: '"Media More Interested in undermining Trump than Reporting" Kari Talks the Pentagon Press Fallout'
    Description: >-
      An October 2025 interview on OAN with host Chanel Rion and Kari Lake, then senior adviser to the U.S.
      Agency for Global Media, speaking in an unofficial capacity. The subject is the walkout of the Pentagon
      press corps over new credentialing rules. Lake says the rules, which require escorts and badges, are
      standard and comparable to the White House, and supports Defense Secretary Pete Hegseth. She accuses
      reporters of coercing staff at the Pentagon to leak information and says those who left want hit pieces
      rather than honest coverage. Rion argues that the walkout is cheered rather than feared because
      independent media can replace legacy outlets, and credits Chief of Staff Susie Wiles for fewer leaks.
      Both contrast this with what they call soft coverage of the Biden Pentagon, including the Defense
      Secretary's undisclosed hospitalisation, and cite a Gallup poll on low trust in media. Lake closes by
      calling the impeachment over Ukraine a hoax and questioning the departing reporters' motives. These
      characterisations of the journalists are the speakers' own, and the press outlets are not present to
      respond.
