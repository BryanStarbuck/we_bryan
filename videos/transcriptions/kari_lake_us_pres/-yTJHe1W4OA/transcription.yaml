  Video:
    Title: "Kari Lake’s One-On-One Interview with ABC 15 to Discuss Senate Campaign"
    Description: >-
      A sit-down interview of Kari Lake by an ABC15 Arizona reporter in
      March 2024, early in her U.S. Senate campaign for the seat Kyrsten
      Sinema was leaving; the reporter asks most of the questions and
      presses on several answers. Lake says she wants to go to Washington to
      get work done and come home rather than make a career of politics, and
      names the border and the economy as her priorities, blaming inflation
      on what she calls Biden and Ruben Gallego economics. On spending she
      says the country must cut and also grow its way out of debt by
      bringing manufacturing back; she says she supports the CHIPS Act but
      objects to the diversity, equity and inclusion conditions attached to
      it. Asked about corporate profits and inflation, she says there is
      corporate greed but focuses on lobbyists and on small-business Trump
      tax cuts she says will expire in 2025, and she describes her campaign
      as funded mainly by small donors. The reporter challenges her
      opposition to the bipartisan Senate border bill, citing border mayors
      who backed it; Lake calls the bill disastrous, says it would have
      codified what she calls an invasion, contains no money for a wall and
      was really about aid to Ukraine, and says she would vote no. On
      abortion she says she would not introduce or vote for a federal ban,
      that the question belongs to the states, and that she wants more
      support for families, including a child tax credit starting in
      pregnancy. Asked how she will win over moderates when her positions
      have not changed, she says her America First policies already appeal
      across parties. The last questions concern the defamation suit brought
      by Maricopa County Recorder Stephen Richer (the ASR writes 'Stephen
      Richard') and her legal team's move to let a default judgment be
      entered; Lake calls the case lawfare, says she stands by her
      statements that Arizona elections are run like a banana republic, and
      says she is skipping to damages to avoid a costly trial. Her claims
      about election administration and about Richer's motives are her own,
      are contested, and Richer is not present to respond.
