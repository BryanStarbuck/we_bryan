    Title: "Kari Joins Newsmax to Talk Spineless Politicians and Trump’s South Africa Showdown"
    Description: >-
      A Newsmax interview segment (May 2025) with Kari Lake. The host plays clips of Andrew Cuomo, then
      running for New York City mayor, and of Gavin Newsom criticising Democratic governance of big cities,
      and asks whether Democrats are changing lanes before 2028. Lake says the 'rats are fleeing the ship',
      argues that officials who say far-left factions forced them to govern as radicals lack the spine to
      lead, and blames Cuomo for nursing-home deaths during COVID; these characterisations are hers, and Cuomo
      and Newsom are not present to answer them. The second half concerns President Trump's Oval Office
      meeting with South African President Cyril Ramaphosa: Lake praises Trump for confronting him, asserts
      that people in South Africa are being killed because of their race (she says 'South America' at one
      point) and accuses the press, including NBC's Peter Alexander, of refusing to cover it. Those claims are
      her own and are contested; the South African government disputes them.
