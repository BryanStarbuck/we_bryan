      records relating to the 2020 Maricopa County audit, disclosed in a post by state
      Senate President Warren Petersen that the host reads on air. Lake says a day of
      reckoning is coming for Maricopa County, which she calls ground zero for the most
      corrupt elections in the country, and names Georgia, Michigan, Wisconsin and
      Pennsylvania as competitors for that description. She advocates the SAVE Act, proof of
      citizenship to vote, cleaned voter rolls, hand-counted paper ballots and mail voting
      limited to travel, military and emergency cases, and suggests members of Congress
      oppose the SAVE Act because they would lose their seats under honest elections. These
      are her assertions; no court has found the outcomes she describes, Governor Katie
      Hobbs's contrary statement is read on air and dismissed by the speakers, and the
      officials named do not appear to answer.
