  Video:
    Title: "Ruben Gallego Should Be Investigated For Mortgage Fraud: Kari Talks Accountability with Bolling"
    Description: >-
      An August 2025 interview on Eric Bolling's program with Kari Lake, then deputy CEO of the U.S. Agency
      for Global Media. Lake describes cutting the agency, which she calls 'right-sizing', and ending a J-1
      visa program that brought in foreign journalists for Voice of America, some from countries she calls
      adversarial. She says former employees whose jobs ended should leave the country and that ICE will find
      anyone who overstays. Bolling jokes about holding one at 'Alligator Alcatraz'. The main segment concerns
      Senator Ruben Gallego, who defeated Lake in the 2024 Arizona Senate race. Lake alleges that he listed
      different primary residences on mortgage applications in Arizona and Washington, D.C., and used a VA
      loan of about $900,000 for a D.C.-area home, and she says he should be investigated. Bolling likens this
      to allegations against Adam Schiff and Letitia James. These are allegations made by the speakers, none
      of these officials is present to respond, and none has been charged over them. The pair also complain
      that politicians escape accountability, criticise judges ruling against the administration, and voice
      hopes for prosecutions of Barack Obama and Hillary Clinton and for justice over what Lake calls rigged
      elections since 2020. These are the speakers' own contested claims, stated without evidence in the
      segment.
