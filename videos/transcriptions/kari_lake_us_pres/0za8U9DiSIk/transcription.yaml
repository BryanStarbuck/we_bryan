    Title: "LIVE - PBS Betrays Kari Lake, Clean Elections Commission & Arizona Voters -- BIG MISTAKE!"
    Description: >-
      A live address by Kari Lake during her Arizona governor's race after a scheduled PBS
      and Arizona State University debate was cancelled. She says her opponent Katie Hobbs
      refused to stand on a debate stage, calls her a coward, and accuses PBS and ASU of a
      backroom deal to give Hobbs airtime she does not deserve, arguing that taxpayers, not
      the DNC, own both institutions. She rejects Hobbs's stated reasons — that a debate would
      create a circus-like atmosphere and that Lake might yell at her or embarrass the state —
      and asks why no reporter has pressed Hobbs on missing the Democratic primary debate. She
      offers to appear with Hobbs the following Tuesday and says Hobbs should be denied the
      airwaves if she does not appear. The backroom-deal accusation and the characterisations
      of Hobbs's motives are Lake's own; Hobbs and the broadcasters are not present to answer.
