    Title: "Abuse of “Birthright Citizenship”"
    Description: >-
      St Onge argues in favour of ending birthright citizenship, following a Trump executive order on the
      subject. His legal claim is that the practice rests on a misreading of the Fourteenth Amendment: he
      focuses on the phrase 'subject to the jurisdiction thereof', cites historian Tom Wood quoting the
      amendment's authors to the effect that it excluded those 'owing allegiance to any foreign sovereignty',
      and notes that Native Americans were granted citizenship by act of Congress rather than by the
      amendment. On scale he says roughly 622,000 children a year are born to non-citizen parents, about
      400,000 of them to people in the country illegally, or one birth in six, and cites a study finding 75%
      of migrant families from Guatemala and Mexico with children receive federal welfare. He describes an
      estimated 40,000 'birth tourists' a year and pre-birthing centres serving Chinese and Taiwanese clients,
      and anticipates opponents relying on Wong Kim Ark. The constitutional reading is contested and is not
      the prevailing judicial interpretation; the claims about migrants' motives, including an anecdote about
      women in shelters, are the speaker's own characterisation and are not sourced in the recording.
