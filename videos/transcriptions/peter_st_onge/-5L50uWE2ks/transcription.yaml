  Video:
    Title: "How the Fed broke housing"
    Description: >-
      St Onge summarises an FX Hedgers analysis arguing that the Federal Reserve, acting on behalf of
      Congress, destroyed housing affordability. He traces a sequence: Lyndon Johnson's 1960s housing
      subsidies, which he says priced the poor out of their own neighbourhoods; 1970s inflation from Vietnam
      and Great Society spending, and the Fed's near-20% rate response; a reprieve under Reagan; George W.
      Bush's expansion of subsidies together with pressure on banks to lend to poor credits and permissive
      ratings treatment of products like interest-only mortgages, leading to the 2008 crash; then roughly
      fifteen years of near-zero rates and trillions of mortgage-bond purchases that inflated house prices and
      rewarded existing owners. He argues housing, not capitalism, is the main driver of the income inequality
      journalists write about, and that today's 8% mortgages have frozen the market. He predicts lower rates
      will not help because they would simply re-inflate prices, and endorses the source's phrase 'modern-day
      serfdom'. The historical causal chain is the argument of the speaker and his cited source, and is
      contested.
