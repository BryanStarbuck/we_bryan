    Title: "Biden’s McJobs economy"
    Description: >-
      St Onge picks apart a US June jobs report, crediting a Twitter thread by colleagues 'EJ and Tony'. He
      notes headline payrolls rose 209,000 — 30,000 below expectations and the lowest in two and a half years
      — with the prior two months revised down by 110,000, and remarks that repeated downward revisions mean
      either the statisticians are poor at their job or are publishing optimistic figures and quietly
      correcting them. Netting revisions and population growth he argues real job growth was roughly flat,
      that most net gains were government posts which he says do not grow the economy and describes as
      'parasites', and that composition worsened: multiple job holders up 233,000 and 452,000 more people
      working part-time for economic reasons, which he reads as a precursor to layoffs. He adds that over two
      million workers remain out of the labour force since COVID. He expects flat real wages to prompt further
      Fed tightening and predicts a full recession. The imputation of intent to government statisticians is an
      unevidenced accusation, and the characterisation of public employees is the speaker's own rhetoric.
