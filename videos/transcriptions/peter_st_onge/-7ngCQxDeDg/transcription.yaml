    Title: "China “will never catch up to US”"
    Description: >-
      St Onge discusses a Bloomberg economics report arguing China 'may never overtake' the US economy,
      alongside a US Commerce Secretary remark that China has become 'uninvestable' for foreign firms. He
      accepts the pessimism about China while insisting the US is also on an unsustainable path toward
      permanent stagflation, dating the problem to the 2008 crisis and to Richard Nixon. On China he argues Xi
      Jinping channelled trillions to politically favoured industries at the expense of dynamic sectors,
      leaving manufacturing and property — about half the economy — in decline, with rising youth joblessness
      and spreading bank failures. He notes Bloomberg's projection that China might briefly pass the US in the
      2040s before falling back as its population shrinks, citing a fertility rate of 1.09. He then dissents
      from Bloomberg, arguing Xi is not immortal and faces internal opposition, and that the Asian policy mix
      seen in Korea, Singapore and Taiwan will prevail unless the West reverses what he calls its plunge into
      socialism. The reports are attributed; the framing of Western policy and the predictions are his own.
