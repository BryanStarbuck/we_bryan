    Title: "78% of Americans say fast food a luxury"
    Description: >-
      A short monologue on a LendingTree survey of 2,000 Americans which St Onge says found 78% now regard
      fast food as a luxury and 62% are eating less of it because of price. He contrasts menu prices before
      and after the pandemic — a Big Mac from $3.99 to $8.29, a Chipotle chicken burrito from $6.50 to $10.70
      — and puts fast-food inflation at 41% by the Fed's data and up to 55% by actual menus, with staples such
      as nuggets and cheeseburgers up 200% or more. He attributes the rise to $6 trillion of Federal Reserve
      money printing and $8 trillion of federal deficits, with regulation, shoplifting and rioting as
      aggravating factors, and argues that if the Big Mac is the better inflation gauge then Americans are
      poorer than the official statistics suggest. He closes by claiming long-run living-standard indicators
      have stalled or reversed since 2000 and that elites cannot see it. The causal account and the motives he
      ascribes are his own and are contested; the officials and agencies he blames are not represented.
