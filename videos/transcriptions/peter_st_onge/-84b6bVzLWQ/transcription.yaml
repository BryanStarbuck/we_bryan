  Video:
    Title: "China “Slowing Sharply”"
    Description: >-
      St Onge reviews Chinese economic data in the fifth month of a trade conflict with the US, reporting
      slowing retail sales, industrial production below expectations, investment growth of half a percent,
      urban joblessness about a fifth higher than the US, and youth unemployment near 18%. He stresses that
      China is slowing but not crashing, cautions that the figures may be unreliable — noting China stopped
      publishing hundreds of statistics and quoting the New York Times on information control — and offers two
      explanations for the resilience: about $1.6 trillion of stimulus, including what he says is pressure on
      867,000 state-owned firms to buy their own shares, and the redirection of exports away from the US,
      partly through transhipment via Vietnam and partly by below-cost dumping into Europe and developing
      markets. He cites a 143% rise in Temu's Latin American shipments and pushback from the EU, India and
      Mexico, and frames a 40-day deadline before tariffs rise from 30% to 145%, noting conciliatory signals
      on both sides including rare earths and Taiwan. The tariff-evasion and dumping characterisations are his
      own reading of the trade data.
