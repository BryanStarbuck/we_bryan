  Video:
    Title: "National Debt hits $38 Trillion"
    Description: >-
      A monologue on the US national debt passing $38 trillion, which St Onge converts to $287,000 per
      household plus a further $140,000 of private debt, noting it came two months after the $37 trillion mark
      and implies an annualised $5.1 trillion of new borrowing — which he says is two and a half times the
      headline deficit. He argues the debt raises interest costs, crowds out private borrowing, and worries
      the investors who buy the bonds, and cites a Congressional Budget Office projection of $140 trillion by
      2054. He then walks through how such debts have historically been resolved: inflation (offering Weimar
      Germany and the Biden years as examples of the debt-to-GDP ratio falling through inflation), soft
      default, and hard default, citing California, Arizona, Illinois, 1970s New York, Venezuela, Sri Lanka
      and Greece in 2012. He concludes that the easy fixes will not happen and recommends gold, silver or
      Bitcoin. The projections are attributed to the CBO; the conclusion that default is near-certain, and the
      investment advice that follows from it, are his own.
