  Video:
    Title: "More Fed Rate Hikes Coming"
    Description: >-
      Recorded from California ahead of a Bitcoin conference, this clip covers Federal Reserve officials
      warning of further rate rises after two months of re-accelerating inflation. St Onge quotes Fed governor
      Michelle Bowman saying inflation 'continues to be too high' and notes similar remarks from Loretta
      Mester and John Williams, observing wryly that 'transitory' has been replaced by 'timely'. He
      distinguishes core inflation, which he says has been stuck for two and a half years, from the headline
      figure that moves voters, and argues the Fed has made no progress on what he considers the real driver —
      federal spending — citing CBO projections of $2 trillion deficits through 2050. His account is that 2021
      inflation came from pandemic spending, that falling energy prices then flattered the numbers, and that
      this 'freebie' is now reversing because of Western energy policy and OPEC production cuts. He expects
      further rate rises aimed at the real economy, and warns that with $33 trillion of debt a jump in bond
      yields could be destabilising. The attribution of inflation primarily to fiscal policy, and the
      characterisation of energy and climate policy, are the speaker's own contested positions.
