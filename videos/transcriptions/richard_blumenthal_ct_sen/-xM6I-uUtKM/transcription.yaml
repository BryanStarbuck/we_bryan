  Video:
    Title: "Blumenthal says Trump and Vance ambushed Zelenskyy in Oval Office"
    Description: >-
      A cable news interview recorded the day of the February 2025 Oval Office meeting between President
      Trump, Vice President Vance and Ukrainian President Volodymyr Zelenskyy. The host opens by saying Trump
      appears to be 'Putinizing' the American presidency. The senator, a former Connecticut attorney general
      and U.S. attorney, first addresses the Justice Department, saying the weaponization of justice 'smacks
      of Stalinist Russia' and invoking the line attributed to Stalin's secret police chief, 'show me the man
      and I'll show you the crime'; he says he has written to the acting U.S. attorney for D.C. and believes
      some conduct amounts to impeachable offenses. He then describes a bipartisan meeting of ten senators
      with Zelenskyy earlier that day as extremely positive, says Zelenskyy was hailed as a hero and was
      ready, willing and able to sign the minerals agreement, while stating he personally disagrees with the
      premise that Ukraine should be paying the United States. The interview plays Senator Lindsey Graham
      praising Zelenskyy at the Munich conference two weeks earlier alongside Graham's remarks after the Oval
      Office meeting calling it a disaster and suggesting Zelenskyy resign; the senator responds that Graham
      was right the first time. He calls the Oval Office meeting 'a pathetic ambush', 'a mugging, a bait and
      switch', and says demanding groveling is different from seeking gratitude. All of this is one
      participant's account and characterisation of a meeting he did not attend; the White House is not
      represented in the clip and does not answer it.
