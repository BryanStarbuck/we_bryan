  Video:
    Title: "Senator Blumenthal Shares Shutdown Stories"
    Description: >-
      Floor remarks relaying the stories of Connecticut veterans affected by the October 2013 government
      shutdown. The senator names veterans of Afghanistan and of earlier wars who met with him, and recounts
      specific cases: a Purple Heart recipient recently back from Walter Reed after further surgery to an arm
      wounded in combat, who came with his wife and three children fearing he will be denied the disability
      compensation he is due; another Purple Heart recipient who waited two years for approval of a disability
      claim and learned on October 1 that he will likely wait longer because the VA has furloughed staff; a
      veteran who credits the GI Bill with reconnecting him to civil society and has applied for a higher
      disability rating for post-traumatic stress; and a veteran whose vocational-rehabilitation pay and
      disability payments are due to run out at the end of October. He attributes the shutdown to 'a small
      fringe of extremist ideologues' in one house of Congress - a characterisation that is his own and is
      contested, and the other side is not heard here. The first 28 seconds of audio could not be transcribed:
      that chunk was rejected as a decode failure and the gap is marked in the transcript rather than papered
