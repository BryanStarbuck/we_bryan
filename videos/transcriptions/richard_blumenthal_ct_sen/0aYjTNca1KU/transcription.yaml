Transcription:

  Video:
    Title: "Senator  Blumenthal Stands Up for Workers' Rights"
    Description: >-
      A Senate floor speech in support of an amendment, numbered 4255 by the speaker, defending the Fair Pay
      and Safe Workplaces executive order against a provision in the National Defense Authorization Act then
      on the floor. He explains that the executive order requires companies doing business with the federal
      government to disclose determinations by a court or administrative body that they violated any of
      fourteen longstanding labor laws - not mere allegations - and names the Americans with Disabilities Act,
      the Family and Medical Leave Act and the Civil Rights Act among them. He argues most contractors comply
      and would only need to check a box, that a small subset with violations would have that taken into
      account during procurement without being barred, and that this is about following the law rather than
      blacklisting. He says contractors who cut corners create an unlevel playing field, submit low- ball
      offers and waste federal funds, and cites Department of Labor figures that one in five Americans work
      for companies doing business with the government. He notes his amendment will not be made pending, names
      Senator Patty Murray and a list of co-sponsoring senators, and says groups including Easter Seals and
      Paralyzed Veterans of America worry the NDAA language would harm veterans and constituents with
      disabilities. The characterisation of the NDAA provision as 'gutting' the order is his own and is
      contested; the opposing case is not heard here.
