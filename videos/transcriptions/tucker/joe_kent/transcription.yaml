Transcription:

  Video:
    Title: "Tucker Carlson interviews Joe Kent"
    Description: >-
      Tucker Carlson interviews Joe Kent one day after Kent resigned as Director of
      the National Counterterrorism Center. The show opens with a January 2024 clip
      of Kent on this same program warning that a war with Iran would be bloody,
      would trap the United States in the Middle East, and would leave China as the
      main beneficiary. Carlson then walks Kent through his resignation letter point
      by point: the U.S. strikes on Iran's nuclear facilities (Operation Midnight
      Hammer), whether Iran actually had an active nuclear weapons program, who is
      really setting American policy in the Middle East, and how much access Israeli
      officials have to the President compared with his own intelligence leadership.
      Kent also says the National Counterterrorism Center was stopped from
      continuing to investigate possible foreign ties to the murder of Charlie Kirk,
      and connects that to the Butler assassination attempt and other breaches of
      President Trump's security.
