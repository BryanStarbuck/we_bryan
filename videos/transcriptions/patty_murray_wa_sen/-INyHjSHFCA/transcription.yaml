  Video:
    Title: "Senator Murray Demands Racial and Economic Equity and Fair Compensation for College Athletes"
    Description: >-
      Opening remarks at a Senate committee hearing on compensating college athletes, delivered by the
      committee's ranking member. She begins with two asides: thanks to first responders fighting wildfires in
      Washington State and on the West Coast, and an extended tribute to the retiring chairman, naming
      bipartisan bills they passed together including the 21st Century Cures Act, ESSA, Perkins CTE and opioid
      legislation. Turning to the hearing, she argues that the roughly $15 billion college sports industry is
      a case of economic and racial inequity, saying the majority of athletes in Division I revenue-generating
      sports are black while mostly white coaches and NCAA officials earn millions, and that athletes are
      barred from any compensation. She relays an account from a former all-star black athlete in Washington
      who she says had to steal food because he was not allowed to work, and describes athletes losing
      scholarships and health coverage after injury. Her proposals are allowing athletes to profit from name,
      image and likeness, ensuring men and women share revenue fairly, enforceable health and safety
      standards, guaranteed affordable health care and coverage for lifelong injury- related conditions, and
      academic support - citing a graduation rate of 55 percent for black male athletes in the Power 5
      conferences against 70 percent for all college athletes. She calls the status quo immoral and says the
      NCAA failed to act. The figures and the characterisation of the system as exploitation are hers, are
      contested, and the NCAA is not heard in this clip. She closes by urging a further COVID relief package.
