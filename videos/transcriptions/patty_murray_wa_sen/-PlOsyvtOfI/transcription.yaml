  Video:
    Title: "Senator Murray on the Republican Shutdown"
    Description: >-
      A television news interview on day two of a government shutdown with the Democratic senator from
      Washington, who is identified by the interviewer as Vice Chair of the Senate Appropriations Committee.
      Asked whether there is an off-ramp, she says Democrats have told Republicans for weeks that they want to
      be part of a bill their votes are being sought for, that Republicans sent over a partisan bill instead,
      and that the sticking point is extending health-care tax credits, without which she says hundreds of
      thousands of constituents will see insurance bills double. Pressed on the Republican position that the
      government should reopen first and negotiate after, she answers that the government was already open
      while those talks were refused, so there is no basis for trust. Asked about the president's threats to
      lay off federal workers, she calls it horrendous and says he is trying to hurt people. She is asked to
      respond to Senator Catherine Cortez Masto, who voted for the Republican bill and said the pain of one
      group should not be swapped for another; she says they have spoken and both want a solution. She says
      resolution requires President Trump and leaders Thune and Johnson to come to the table, expresses
      confidence her caucus will hold, and is asked about polling showing more people blaming Republicans with
      about a quarter undecided. Every characterisation of Republican motives here is hers, is contested, and
      no Republican is present to answer it. The clip is a two-person interview, but diarization returned
      eighteen clusters.
