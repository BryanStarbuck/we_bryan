    Description: >-
      A Senate floor speech urging passage of the Paycheck Fairness Act ahead of the vote. The speaker states
      that a wage gap still exists in every state, that women in the United States earn on average 82 cents
      for every dollar their male counterparts make, that the gap is more pronounced for women of color, and
      puts the gap for Latina women at almost $30,000 a year compared with what a white man earns - figures
      she asserts and does not source in the clip. She argues the pandemic set women, and women of color in
      particular, further back. She describes the bill as closing loopholes that allow pay discrimination,
      protecting workers from retaliation for discussing their pay, limiting the use of prior wage history in
      hiring so discrimination cannot follow a worker between jobs, and increasing transparency and
      accountability. She notes it passed the House with bipartisan support and every Democrat, and appeals
      directly to Senate Republicans to vote for it. The opposing case is not heard in this clip.
