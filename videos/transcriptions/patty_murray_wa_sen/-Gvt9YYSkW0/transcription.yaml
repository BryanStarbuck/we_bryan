    Description: >-
      A Senate floor speech urging Senate Republicans to restore net neutrality rules. The speaker says she is
      lifting up the voices of families in Washington State and argues that the internet should be free and
      open, that the country should back small business owners, entrepreneurs, students and middle-class
      families rather than large corporations and special interests, and that consumers rather than broadband
      providers should choose the sites and applications they use - without providers blocking content or
      charging for prioritized access. Drawing on her stated background as a former preschool teacher, she
      argues that students from early education through workforce training need high-speed internet, that
      teachers need it to collaborate and to reach students with disabilities and English learners, and that
