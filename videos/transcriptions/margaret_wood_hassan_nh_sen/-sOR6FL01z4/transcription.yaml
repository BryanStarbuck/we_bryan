    Description: >-
      Senator Maggie Hassan questions witnesses in a Senate Finance Committee hearing on
      clean energy tax policy. She notes a year-end package carried her bipartisan bill
      on capital access for residential and commercial energy storage and that she
      supports a storage tax-incentive effort led by Senator Heinrich. A witness, Ms.
      Pope, explains battery storage as critical to grid reliability — storing solar and
      wind for when the wind is not blowing and the sun is not shining — and cites a
      Portland General and NextEra project in eastern Oregon. Hassan then asks about net
      metering, and finally about deductions for oil drilling; the witness declines to
      take a position on repealing them, and she states her own view that they should be
      eliminated. The reliability claims are the witnesses'.
