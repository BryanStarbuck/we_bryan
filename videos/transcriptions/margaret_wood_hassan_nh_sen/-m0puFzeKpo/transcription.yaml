  Video:
    Title: "Senator Hassan Highlights Need to Hold Those Responsible of Olympic Abuse Accountable"
    Description: >-
      Senator Maggie Hassan questions survivor witnesses at a Senate hearing on abuse in
      Olympic sport. She thanks them for revisiting "some of the most painful moments of
      your life", calls them world-class athletes and survivors, and asks two questions:
      who they hold most responsible for allowing the abuse to continue, and what
      cultural factors in their training let it begin and persist. One witness says she
      has never felt brave, only that she was doing the right thing, and that another
      witness's testimony made her cry. She states that Larry Nassar — a convicted
      offender — saw coaches' abuse almost daily and did not report it, and that they
      protected each other; she asks whether the leadership of USA Gymnastics would have
      reacted differently had it been their own children. The accounts of who knew what
      are the witnesses' own testimony as given at the hearing.
