    Description: >-
      Senator Maggie Hassan questions a panel on children's mental health during the
      COVID-19 pandemic. She relays that New Hampshire K-12 students, from fifth graders
      to high schoolers, spoke to her about mental health without hesitation, and says
      paediatric mental-health emergency department visits rose sharply in 2020 while
      access to primary care and in-school supports fell. She asks Dr. McDougall what
      Congress can do to prepare paediatricians and primary care providers. The witnesses
      describe an interprofessional model, training non-specialists including dentists and
      OBGYNs to recognise behavioural health problems, and note that non-pharmacological
      treatments have improved over thirty years but are still under-used because "it's
      much easier to just give somebody a pill". Hassan closes on linking primary care to
      community health workers on social determinants of health. The 2020 increase is
      stated by her without a source named in the clip.
