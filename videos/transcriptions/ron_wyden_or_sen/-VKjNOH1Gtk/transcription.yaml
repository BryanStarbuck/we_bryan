  Video:
    Title: "Ahead of Final Floor Vote, Wyden Opposes the Nomination of RFK Jr. to be HHS Secretary"
    Description: >-
      A Senate floor speech opposing the confirmation of Robert F. Kennedy
      Jr. as Secretary of Health and Human Services, delivered ahead of the
      final vote. The speaker calls him the least qualified nominee ever
      tapped as America's chief health officer and says he has shown a
      profound lack of knowledge at best and deeply dangerous views at worst
      on vaccine safety, women's reproductive health, drug pricing and
      affordable health care. He recounts two Oregon medical students
      telling him their greater worry is long-term damage to science rather
      than the immediate term. He says that at the Finance Committee hearing
      the nominee cited his own children's vaccinations as proof he is not
      anti-vaccine, and contrasts this with an earlier statement that he
      would 'do anything and pay anything to go back in time' to prevent
      those vaccinations, and with a podcast remark about 18 months earlier
      that 'no vaccine is safe and effective'. He accuses the nominee of the
      tactics of a conspiracy theorist and says Republican colleagues have
      bowed to pressure from Donald Trump. The speech then turns at length
      to Medicaid, citing 81 million people covered by Medicaid and CHIP and
      two of three nursing home residents covered by Medicaid, and walks
      through an extended hypothetical of a mother in a nursing home losing
      staff attention and then coverage after federal cuts, leaving the
      family to pay out of pocket or take her home. He urges a no vote. All
      characterisations of the nominee and of Republican motives are the
      speaker's own advocacy; the nominee is not present to answer them.
