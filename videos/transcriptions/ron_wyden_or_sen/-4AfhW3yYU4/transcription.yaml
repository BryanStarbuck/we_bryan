      A short exchange at a congressional hearing. The questioner tells the
      chair he will submit other questions for the record but needs to ask
      the agency witnesses one question relevant to a matter that has taken
      up much of the committee's time, and asks each in turn whether it
      would be appropriate for their agency to secretly search Senate files
      without seeking external authorization or approval. The witnesses
      answer no. One notes that by definition his agency is not permitted to
      conduct a search that is not properly authorized in some fashion;
      another qualifies that because his agency involves the Attorney
      General not every approval would have to be external, but the
      appropriate legal approvals would be required in every instance, which
      the questioner accepts as the right answer. The underlying controversy
