Transcription:

  Video:
    Title: "Wyden Chairs Energy Subcommittee with BLM Director Part 1"
    Description: >-
      An opening statement by the chair of the Senate Subcommittee on Public
      Lands and Forests, taking testimony on five bills under Bureau of Land
      Management and Forest Service jurisdiction: S.1024 designating
      wilderness in New Mexico, S.1090 designating lands in the Cherokee
      National Forest in Tennessee as wilderness, S.1144 extending the
      reduced royalty rate for soda ash, S.1149 expanding geothermal
      production, and S.1344 directing wildfire recovery in Arizona. He
      notes the Senate has adjourned so the hearing will be abbreviated and
      written statements will be included in the record, and introduces BLM
      Director Bob Abbey and Forest Service Chief Tom Tidwell along with
      industry witnesses Edward T. Flynn of FMC Wyoming Corporation and
      Scott Nichols of U.S. Geothermal. He discusses the geothermal bill,
      which would let the Interior Secretary issue non-competitive leases so
      an existing project can expand its boundaries while ensuring fair
      market value and rental payments, and the soda ash bill, arguing that
      international competitors are gaming the market and describing Chinese
      value-added-tax rebates to exporters of a synthetic substitute,
      resumed in 2009 after being abandoned in 2007. He closes by raising
      what he calls extremely serious errors by the BLM in estimating 2011 O
      and C county payments, which he says will leave counties in his state
      about 11.6 million dollars short, and says the agency recognised the
      error in March but failed to notify the congressional delegation or
      the counties. The trade characterisation and the account of the BLM
      error are his own statements to the hearing.
