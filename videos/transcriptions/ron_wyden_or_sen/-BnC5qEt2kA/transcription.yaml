Transcription:

  Video:
    Title: "Wyden Senate Floor Statement on Medicare's Physician Payments"
    Description: >-
      A Senate floor statement urging action before a March 31 deadline on
      Medicare physician payments. The speaker frames Medicare as a lifeline
      for 50 million older Americans and warns that access to primary care
      doctors, nurse practitioners and specialists depends on Congress
      acting. He credits Senator Orrin Hatch's leadership for the bipartisan
      path, and names Senator Baucus, House Ways and Means Chair Dave Camp,
      Ranking Member Levin, House Energy and Commerce Chair Fred Upton and
      Ranking Member Henry Waxman for their work. He introduces the Medicare
      SGR Repeal and Beneficiary Access Improvement Act of 2014, which would
      repeal and replace the sustainable growth rate formula: physicians
      would receive annual payment increases of 0.5 percent for five years,
      then performance-based increases, with a shift toward quality, value
      and accountability, improved payment accuracy, care coordination for
      chronic conditions and alternative payment models. It also carries
      health care extenders covering low-income seniors' premiums and access
      to therapies, rural provider access, and an expansion of Medicare
      payment-data transparency he credits to years of work with Senator
      Grassley. He argues the 16 previous short-term patches have already
      cost 150 billion dollars, the same as full repeal plus extenders, and
      have been paid for by cuts to other providers, with hospitals
      producing nearly 30 billion in two years. He quotes Wall Street
      Journal editors of February 19 saying to 'simply pass the bill as is
      and forgo the pretense of fake paying for it', and calls the status
      quo 'Medicare make-believe'. The cost figures and characterisations
      are his own as presented to the chamber.
