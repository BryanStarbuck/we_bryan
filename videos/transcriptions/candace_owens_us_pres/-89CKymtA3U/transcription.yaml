    Description: >-
      A speech by conservative author and filmmaker Dinesh D'Souza at the BLEXIT event in Dallas (April 2019),
      introduced by Candace Owens as the author whose history of the Democratic Party changed her life.
      D'Souza opens with his arrival in America from India at 17 and the American dream as the chance to write
      one's own life. He then argues that the Democratic Party has historically been the main obstacle for
      minorities, as the party of slavery, segregation and the Ku Klux Klan. He makes several claims of his
      own that historians dispute: that Nazi officials modelled the Nuremberg Laws directly on Democratic
      segregation laws, that no Republican owned a slave in 1860, and that the 'big switch' of the parties on
      race is a myth, arguing that only two of about 150 Dixiecrats became Republicans. He criticises
      Princeton historian Kevin Kruse, who disputes his account and is not present. He closes with a 'ladder
      versus rope' metaphor contrasting Republican opportunity with Democratic dependency, and mentions
      teaching English to immigrants as part of a sentence imposed during the Obama years.
