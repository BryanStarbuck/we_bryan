  Video:
    Title: "BLEXIT DALLAS - Rogan O'Handley"
    Description: >-
      A speech at a BLEXIT event in Dallas (April 2019), posted on Candace Owens' channel. Owens briefly
      introduces Rogan O'Handley, the lawyer and Instagram commentator known as DC Drano, and a clip plays of
      his video walking through Compton in a MAGA hat. O'Handley then speaks for most of the video: he
      describes growing up with a single mother on welfare, studying at Northeastern and the University of
      Chicago, and working as an entertainment lawyer in Los Angeles; argues that Trump's economic, trade and
      prison-reform policies are helping Black Americans and cites record-low Black and Hispanic unemployment;
      praises Ben Carson's proposal to bar undocumented immigrants from federal public housing; accuses
      Democrats and Hollywood of hypocrisy and of keeping Black Americans dependent on government; says he
      turned down a law-firm partnership to move to Florida and campaign; recounts a conversation with Black
      Lives Matter protesters at Towson University; and calls Candace Owens 'our Martin Luther King.' The
      policy claims and characterisations of Democrats are his own and are contested; the people he criticises
      are not present.
