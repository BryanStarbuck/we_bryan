    Title: "Everything We Learned About World War 2 Is A Lie | Candace Ep 7"
    Description: >-
      Episode 7 of Candace Owens' show 'Candace' (June 2024), a solo monologue with clips and viewer comments.
      Owens opens by praising Boston Celtics coach Joe Mazzulla for publicly praying the rosary before the NBA
      championship. The main segment argues that the World War II story taught in American schools is
      propaganda: citing Thomas Sowell on public education, she says schools indoctrinate children, quotes
      generals Henry Arnold and Dwight Eisenhower to argue the atomic bombings of Japan were unnecessary,
      plays Tucker Carlson calling the bombings evil and Lindsey Graham defending them in the context of
      Israel, and describes the post-war expulsion of ethnic Germans from Eastern Europe and the Allied
      alliance with Stalin. She says the media is 'slow-walking' the U.S. into a third world war, criticises
      U.S. focus on Israel, cites a Jerusalem Post report that Israeli intelligence had advance knowledge of
      Hamas's October 7 plans, and says she will host a pro-Israel guest for balance. She also promotes the
      foster-care film Sound of Hope, answers viewer comments, including ones endorsing her claims about
      Brigitte Macron, and advises young people against college debt. The historical interpretations and
      claims are Owens' own and many are contested by historians; her claims about Brigitte Macron are denied
      by the Macrons, who have sued her over them, and none of the people she criticises are present to
      respond.
