  Video:
    Title: "This Is Why I Choose Not To Vaccinate My Kids | Candace Ep 82"
    Description: >-
      Episode 82 of the 'Candace' show, published 9 October 2024: a roughly hour-long studio interview in
      which Candace Owens speaks with historian and author Tom Woods about his book 'Diary of a Psychosis' on
      COVID-era public health. Owens opens by defending her remark that she has 'left the Church of Science'.
      Woods argues that lockdown and mask measures made no measurable difference, citing state, county and
      country comparisons (Florida versus California, Sweden) and his sites diaryofcovid.com and
      covidchartsquiz.com. Owens describes what she says was a reaction to the Gardasil vaccine at 20, calls
      herself an anti-vaxxer, says she does not vaccinate her children, and disputes the value of the tetanus
      vaccine; these views are contrary to established medical consensus on vaccine safety and effectiveness.
      Both criticise 'scientism', and Woods relays a claim he attributes to Yale's Harvey Risch that Anthony
      Fauci is a 'sociopath' who lied; Fauci, who is not present, has denied lying to Congress. They also
      criticise Jay Varma, Andy Slavitt and Sam Harris, none present to respond. Later they turn to history,
      praising Daryl Cooper's World War II revisionism and the documentary 'Savage Peace', characterising the
      Civil War and World War II as 'founding myths'; the framing is theirs and disputed by mainstream
      historians. The episode closes on homeschooling, Ron Paul's curriculum and Woods's free history courses.
