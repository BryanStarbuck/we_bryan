    Description: >-
      Episode 184 of Candace, guest-hosted by Ian Carroll while Owens is on maternity leave
      with her newborn. The main segment follows a mother's multi-year fight against the
      private equity owners of Urban Air Adventure Parks after her seven-year-old daughter was
      severely injured on the Skyrider attraction, suffering what Carroll describes as a
      punctured lung, a traumatic brain injury, broken bones and permanent disability
      including learning deficits and hearing loss, with the dispute held in private
      arbitration until now. Video from the day is played with a warning to parents. Carroll
      also previews segments on President Trump going after the pharmaceutical industry, the
      opening of Sean Combs's trial and the defence that the encounters were consensual, and
      online claims about Emmanuel Macron. The allegations about the park operator, its owners
      and the individuals named are the show's own characterisations; several concerned matters
      that were unresolved or before a court at the time, and none of those parties appear.
