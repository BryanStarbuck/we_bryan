      A speech by Brandon Tatum, a former police officer and conservative commentator, at the BLEXIT event in
      Dallas (April 2019). Candace Owens introduces him briefly, calling father absence the number one issue
      facing every community and criticising what she calls radical feminism. Tatum addresses young Black men
      directly. He argues that fatherless households, which he puts at 22% in the 1960s and 70% now, are the
      responsibility of men. He rejects discrimination and 'white privilege' as excuses, urges men to pull
      their pants up, go to church and lead their homes, and tells the story of his father, who rose from Fort
      Worth firefighter to battalion chief and then Waco fire chief despite discrimination. He describes his
      religious conversion and his 'awakening' as a conservative, criticises Al Sharpton for saying Black
      Trump supporters at a White House event were paid, and compares President Trump's sacrifice to Martin
      Luther King Jr.'s and, with a stated caveat, to Jesus'. He closes with a Wolverine analogy about
      perseverance. The figures and characterisations are Tatum's own.
