    Title: "This Man Helped Kamala Harris. Then He Mysteriously Died. | Candace Ep 92"
    Description: >-
      Episode 92 of Candace, an interview with Yoichi Clark Shimatsu, a journalist and former
      editor of the Japan Times who says he moved in the same Berkeley circles as Kamala
      Harris's late mother, Shyamala Gopalan. Owens states his claims at the top: that Gopalan
      was part of the CIA's MKUltra program, and that Harris was previously married to a
      wealthy Canadian and that the record of the marriage was removed. She tells viewers she
      will let them decide whether he is telling the truth. Shimatsu also recounts the death
      of a friend and protege he names as Jeff Adachi, which he says was treated as
      mysterious and which he dates to the early 1990s. Nothing in the episode establishes
      any of this: it is the recollection and assertion of a single guest speaking about
      people who do not appear and, in Gopalan's case, has died, no documentation is
      presented, and the dates and details are not corroborated on air. Owens closes by
      framing the conversation as exposing elites who control through media and psychiatric
      brainwashing programs, ahead of an election.
