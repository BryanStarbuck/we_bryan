  Video:
    Title: "What Is A Cease and Desist Letter?"
    Description: >-
      A comedy sketch presented as episode 19 of a mock legal series called
      'Law for All', in which a narrator introducing herself as a lawyer
      explains what a cease and desist letter is. The explanation itself is
      broadly accurate: a formal written notice requesting that someone stop
      an activity, typically sent by an attorney, identifying the conduct at
      issue, the legal basis for the claim and the requested action, and not
      in itself a court order; receiving one does not necessarily establish
      liability, though continuing the conduct would be ill-advised. The
      illustrative example is pointed rather than neutral, describing a
      former company asking someone to stop making public insinuations,
      allegations 'or dream interpretations' of conspiracies to kill or
      cover up the killing of an employee. No party to that example is
      named, and the sketch asserts nothing about it as fact. It closes with
      an extended comic disclaimer that this is not legal advice, that
      dreams are not admissible in court, and that the narrator is not a
      real lawyer.
