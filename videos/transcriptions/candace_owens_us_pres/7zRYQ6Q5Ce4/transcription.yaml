    Title: "LEXIT AT BLEXITLA"
    Description: >-
      A panel discussion from a BLEXIT event in Los Angeles, billed as the first LEXIT panel
      and focused on the Latino and Hispanic American community. Candace Owens introduces the
      format; panelists open with religious testimony and say that Jim Acosta, Ana Navarro and
      Jorge Ramos do not speak for Latinos, then take a question on how illegal immigration
      has affected the Hispanic community. One panelist ties open borders to drugs harming
      poor communities including his own family, and asserts that 16,000 children have been
      victims of human trafficking at the U.S.-Mexico border while arguing the media does not
      cover it. The trafficking figure is that speaker's own and is not sourced on the panel;
      the journalists named do not appear to respond.
