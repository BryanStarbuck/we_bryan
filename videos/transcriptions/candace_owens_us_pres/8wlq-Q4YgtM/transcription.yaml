  Video:
    Title: "Why I Left This Religion | Candace Ep 16"
    Description: >-
      Episode 16 of Candace Owens' show 'Candace' (July 1, 2024), a solo monologue with sponsor reads. Owens
      says she has left what she calls the 'cult' or 'pagan faith' of science. She cites a viewer's account of
      harm from an IUD, plays an Andrew Tate clip dismissing data, and lists climate change, childhood
      vaccines, abortion, transgenderism and school history as tenets of that faith. She also claims that
      about 12 million Germans were tortured in Allied camps after World War II, a figure historians do not
      support. She argues that Pride Month has become a 'fetish month' and says the people running society
      deliberately invert the Bible. On the first round of the French snap election, she calls Emmanuel Macron
      a 'psychopath', suggests that masked Paris rioters are government-backed, and repeats her claim that
      Brigitte Macron is a man. That claim is false: the Macrons deny it and have sued Owens for defamation
      over it, and neither is present. She criticises actress Tia Mowry (transcribed 'Laurie') for describing
      her divorce as self-love, calls Jill Biden a 'monster' and 'sociopath' after the Biden–Trump debate,
      asks for prayers for Rep. Thomas Massie's family after his wife's death, and says she believes the Moon
      landing was faked while saying she is not a flat-earther. The characterisations of named people are
      Owens' own.
