    Description: >-
      Episode 186 of 'Candace' (May 2025), guest-hosted rather than presented by Candace Owens: the host
      introduces himself as someone viewers may not recognise, and viewer comments read on air thank 'Ian',
      indicating commentator Ian Carroll. The first segment argues that Red Lobster's bankruptcy followed a
      private-equity sale-leaseback and then ownership by Thai Union, which the host alleges used the 'endless
      shrimp' promotion to benefit itself as sole supplier; he then describes forced labour in the Thai shrimp
      industry, reading at length from the book The Secret Life of Groceries about a Burmese migrant held for
      14 years on a fishing boat and citing AP reporting on shrimp-peeling sheds, which a Thai Union
      subsidiary denied any link to. A second segment on Sean 'Diddy' Combs' federal trial argues the
      prosecution is 'the wrong case', repeating Suge Knight's allegation that Combs was an FBI informant and
      raising questions about his former head of security. The final segment revisits the host's early TikTok
      work tracing grocery and personal-care brands to parent companies and large institutional shareholders,
      cites a U.S. House report on heavy metals in baby food, and previews an app for identifying brand
      ownership. The corporate and criminal allegations are the host's own or attributed to others and are
      contested; the companies and people named are not present to respond.
