    Description: >-
      A satirical audio piece styled as cassette 4 of an adult reading
      curriculum, working through the alphabet with mock phonics examples.
      The entries are loaded with allusions to conspiracy-theory method and
      to themes from the speaker's own public disputes: 'C is for cease and
      desist', 'D is for delegitimatize', 'F is for French - the French
      woman is a female', 'Q is for questions - just asking questions is a
      clever way to make implications', 'R is for red yarn', 'T is for thumb
      - the thumbtacks hold the red yarn in place', 'S is for sleep pictures
      - while you sleep, mind movies give you secrets', 'U is for
      unsubstantiated - an unsubstantiated claim can be solved by a hunch,
      vibe, or instinct', and 'V is for victim - it is never too late to
      play the victim'. One entry, 'J is for juicy', puns on a stereotype
      about Jewish people, and another refers to Ye having apologised. The
      piece is comedic in form and makes no assertion in a straightforward
      voice; the audio itself does not settle whether it is self-parody or
      mockery of the speaker's critics.
