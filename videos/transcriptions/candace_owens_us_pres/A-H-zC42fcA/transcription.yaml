    Title: "KingFace - Entire Presentation @ #BLEXITFL"
    Description: >-
      A stage presentation by the conservative social-media personality KingFace at a BLEXIT event in Florida
      (March 2020), posted on Candace Owens' channel. It opens with a montage of his street videos, in which
      he argues with passers-by about Donald Trump's record for minorities, citing low Black, Asian and Latino
      unemployment and the First Step Act, and uses coarse language. On stage he delivers a mock
      'presidential' speech built around rejecting the word 'can't': he describes his own past as a gang
      member and eighth-grade dropout whose teacher told him he would amount to nothing, urges an 'I can win'
      mindset, community responsibility and family, cites Ben Carson, Robert Johnson, Oprah Winfrey, Madam
      C.J. Walker and Frederick Douglass as examples, jokes about Trump as 'our first black president', and
      criticises Al Sharpton and Dr. Umar Johnson for what he calls race-baiting. He thanks Larry Elder,
      mentions the film Uncle Tom, and closes by bringing on rapper Bryson Creates, whose anti-abortion song
      'Save the Baby' ends the video. The claims about Trump's record and about named critics are the
      speaker's own; the people he criticises are not present.
