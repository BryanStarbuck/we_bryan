    Title: "Brandon Tatum at BLEXIT Greenville"
    Description: >-
      A speech by former Tucson police officer and radio host Brandon Tatum at a BLEXIT event in Greenville
      (September 2020), posted on Candace Owens' channel. Tatum tells how he joined the Tucson Police
      Department after a ride-along in which an officer saved a suicidal teenager, and describes serving as a
      field training officer, SWAT member and department spokesman. He argues that the narrative of widespread
      police brutality against Black Americans is 'a lie', says the public was misled about the cases of
      Breonna Taylor, Jacob Blake and George Floyd, objects to athletes displaying Jacob Blake's name, and
      urges young people to comply during police stops and to consider becoming officers. He then rejects the
      idea of white privilege in favour of 'Christ's privilege', urges personal responsibility and a service
      mindset, and says Christians should take positions on abortion, marriage and church closures from
      scripture rather than party. His account of those specific cases is his own and is disputed by others;
      the people involved are not present.
