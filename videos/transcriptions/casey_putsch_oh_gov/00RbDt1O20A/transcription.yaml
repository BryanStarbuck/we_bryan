    Title: "Stanford BANS these OFFENSIVE Automotive Phrases and Words!"
    Description: >-
      A commentary video in which Casey Putsch responds to Stanford University's
      published list of language it recommends avoiding. He credits the university
      for explaining its reasoning and offering alternatives, then argues it
      overreached on several engineering and aviation terms dating from the
      Industrial Revolution whose origins he says are unrelated to the offence
      attributed to them. He ties his criticism to the cost of a Stanford education.
      This is one commentator's cultural-politics opinion delivered on a car
      channel; Stanford's own reasoning is characterised by him rather than quoted
      at length.
