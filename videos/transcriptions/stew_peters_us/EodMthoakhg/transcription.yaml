  Video:
    Title: "Stew Peters News Today | Breaking News & Latest Updates"
    Description: >-
      A twenty-nine-minute compilation episode stitching together several unrelated segments with no single
      host. It opens with audio from a congressional hearing in which a questioner presses Anthony Fauci on
      whether he was involved in undermining hydroxychloroquine and ivermectin, citing a CNN interview of
      August 29th 2021 and holding up a stack of papers he says show sixty to seventy percent efficacy, and
      asks whether the aim was to preserve the emergency use authorisation for COVID vaccines, which requires
      that no effective treatment exist. The narrator characterises Fauci's response as pleading the fifth.
      That framing and the efficacy figures are the questioner's and the narrator's; large randomised trials
      have not found ivermectin effective against COVID-19, the exchange as presented is one-sided, and the
      segment is immediately followed by an advertisement read selling ivermectin with the promo code 'petty',
      which is a direct commercial interest in the claim being made. A second segment is a monologue mocking
      people still wearing masks, calling it psychosis, describing Fauci as power-hungry and referring to his
      diary, and asserting the Democratic Party has convinced its supporters to isolate themselves from other
      information. A third covers Hunter Biden attacking Chuck Schumer and Nancy Pelosi in profane terms on a
      Barstool appearance, with a narrator arguing this will resonate with young men and that being
      deplatformed makes him look dangerous. The episode closes with an unrelated theological discussion of
      saving faith, walking through the Latin categories notitia, assensus and fiducia and using Judas, demons
      and the apostle Peter as illustrations, ending with a pastor's warning that two-thirds faith is not
      saving faith. Speaker identification is poor throughout and the transcriber did not resolve who is
      speaking in most segments.
