  Video:
    Title: "'It was horrible to watch': Saskatchewan students speak out on explicit drag field trip"
    Description: >-
      A twenty-two-minute Rebel News segment, reported by Lee Smart in Regina and reposted on the Stew Peters
      Network channel, in which five Saskatchewan students describe a school field trip to a production of
      'Little Red Warrior and His Lawyer' at the Globe Theatre. All five are eighteen and their identities are
      obscured; they are presented as a sample of roughly 400 students from fourteen classrooms who attended.
      They say the show contained sexual content they found distressing, that some classmates cried and that
      religious students were disturbed, that permission slips did not describe what the play contained, that
      some classes left early, and that a refund of the ticket price was an inadequate response. One student
      says punishment is warranted for those responsible. The segment opens with a long narrated list of the
      content the reporter says the permission slip should have disclosed, covering simulated sex acts,
      bondage, fetishism, depictions of Premier Danielle Smith and Queen Elizabeth II, drug and alcohol use,
      and anti-oil and anti-Western themes. THAT CHARACTERISATION IS REBEL NEWS'S OWN and is presented in the
      segment's advocacy voice; the report itself notes that mainstream coverage described the play as a
      trickster fable and that Regina Public Schools and the Globe Theatre each denied wrongdoing while
      attributing responsibility to the other. Neither the school board nor the theatre is represented in the
      audio by anyone speaking for them, so their account of what the play contained and what parents were
      told is absent. The students' descriptions of their own reactions are firsthand; the framing, the
      content list and the conclusions drawn from them belong to the outlet.
