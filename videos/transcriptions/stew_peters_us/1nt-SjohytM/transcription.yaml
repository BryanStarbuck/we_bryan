  Video:
    Title: "Who Could Have Possibly Built This in 1779? Stew Peters"
    Description: >-
      An seventeen-minute narrated essay arguing that the individual craftsmen who executed the ornamental
      stonework and plasterwork on grand nineteenth-century buildings were systematically left out of the
      historical record, and that this gap is suspicious rather than mundane. The narrator opens at the
      Kunsthistorisches Museum in Vienna, completed in 1891, where an information board credited only
      'craftsmen from across Europe', and builds his case through Philadelphia City Hall, begun 1871 and
      completed 1901 with more than 250 exterior sculptural figures credited to architect John McArthur Jr and
      sculptor Alexander Milne Calder while the masonry workforce is recorded only in aggregate, and the 1893
      World's Columbian Exposition in Chicago. He contrasts this with the survival of Roman legion payrolls,
      medieval English tax records, and named masons and glaziers at Chartres, arguing the documentary gap
      widens precisely as record-keeping generally improves. He quotes an unnamed academic labour historian
      giving the conventional explanation, that workers simply were not named in records because of class,
      credits it as partially true, and then sets it aside as insufficient. The video stops short of stating
      an alternative explanation in the portion transcribed, but the title's framing and the argument's shape
      place it in the Tartaria and alternative-architectural-history genre. The premise is the narrator's own
      and is contested: the class-based explanation he quotes and rejects is the mainstream historical
      account, and differential documentation of named commissioners versus anonymous wage labour is well
      attested without requiring a suppressed history.
