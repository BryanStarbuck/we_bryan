      moves between clips with no narration tying them together: Obama calling for medical help when someone
      faints at an event and directing them to the doctors office; a White House tribute to an injured soldier
      identified in the audio as Sergeant First Class Cory Remsburg; encounters with veterans, a job-site
      safety manager, and children, including a boy who writes him a letter and another who tells him many
      people hate him, to which Obama replies that he did get elected, that credit and blame are both part of
      the job, and that criticism is bearable so long as the work is done for other people. Sound quality is
      poor throughout and several passages are garbled by the transcriber. The channel that posted it is
