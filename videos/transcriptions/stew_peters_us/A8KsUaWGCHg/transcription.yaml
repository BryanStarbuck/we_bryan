    Description: >-
      A fourteen-and-a-half-minute episode of The Hot Zone presented by Chuck Holden, reporting on the
      deteriorating security situation in Mali and arguing that Western media has ignored it. Holden describes
      the al-Qaeda affiliate JNIM, Jamaat Nusrat al-Islam wal-Muslimin, as close to controlling a country for
      the first time since the Taliban, and recounts its fuel blockade of the landlocked capital Bamako:
      convoys ambushed and burned, with more than 130 tankers destroyed in the first two months per Bellingcat
      and over 300 by a Wikipedia tally, NASA satellite imagery showing the city of three million going dark,
      schools closed, and the US and UK withdrawing personnel. He reports an April 25th car bombing that
      killed defence minister General Sadio Camara, who had invited Russian forces in, along with his second
      wife and two grandchildren, and a coordinated assault on Bamako airport destroying three helicopters. He
      profiles JNIM leader Iyad Ag Ghali as a former Tuareg rebel following an explicit Taliban playbook,
      notes France, the United States and the United Nations have all withdrawn and that ECOWAS fractured when
      Mali, Burkina Faso and Niger left, and closes by drawing an analogy to Osama bin Laden's pre-2001
      presence in Afghanistan. Roughly two minutes in the middle are an unrelated advertisement read for a
      testosterone supplement sold by The Wellness Company, with a discount code. Names and figures are as
      Holden states them and several are transcribed phonetically; the framing and the threat assessment are
      his own.
