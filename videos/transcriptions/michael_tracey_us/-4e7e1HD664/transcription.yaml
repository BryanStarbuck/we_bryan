    Title: "Michael Tracey interviews leader of the Proud Boys"
    Description: >-
      A short street interview at a rally (March 2026) in which Michael Tracey questions Enrique Tarrio
      (transcribed 'Terrio'), former leader of the Proud Boys. Tarrio was convicted of seditious conspiracy
      over January 6 and pardoned on Trump's first day back in office. Tarrio says he was about 80 miles away
      in Baltimore that day and calls the charges wrongful; that is his own account. Both men argue that
      January 6 defendants were overcharged, including with terrorism enhancements. Tarrio, who is
      Cuban-American, says he supports the president's actions in Venezuela and would support military action
      or regime change in Cuba, calling hemispheric dominance 'America First'. He says he opposes boots on the
      ground in Iran but trusts the president, while Tracey pushes back that the campaign is already
      extensive. On Epstein, Tarrio blames Attorney General Pam Bondi's shifting statements rather than Trump,
      predicts she will leave after the midterms, says he believes Epstein ran a trafficking ring, and reads
      the 'pizza' references in released emails as coded; he says he is not an expert. Tracey questions
      whether the responsibility stops with Trump.
