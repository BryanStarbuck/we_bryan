      Raw on-the-ground footage, posted by Michael Tracey in June 2020, of a community rally in Bloomfield,
      New Jersey held in the days after George Floyd's killing, which the uploader titled a 'pro police
      protest'. An organiser named Matthew thanks the police director for joining the event. The Bloomfield
      police director then speaks: he calls what happened in Minneapolis a disgrace to the profession, pledges
      swift and harsh discipline for any officer who acted similarly, describes the department's youth,
      community and senior police academies, and responds to a question about an earlier Vice documentary by
      saying it relied on skewed data and that Bloomfield tracks the race of every motor-vehicle stop to flag
      problem officers early. The clip ends with the crowd chanting 'No justice, no peace' and the names of
      George Floyd and Breonna Taylor. Michael Tracey is recording rather than speaking.
