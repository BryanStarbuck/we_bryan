Transcription:

  Video:
    Title: "Debate: Did Israel trick Trump into war with Iran?"
    Description: >-
      A 2-hour-40-minute moderated debate between Curt Mills, executive director
      of The
      American Conservative, and independent journalist Michael Tracey, on two
      stated
      questions: what role, if any, Israel played in Trump's decision to wage
      war on
      Iran, and whether MAGA is genuinely anti-war or anti-interventionist. The
      video
      opens with a montage of the sharpest exchanges before the host introduces
      both
      guests. The disagreement is one of causation rather than of facts. Mills
      argues
      that an Israel lobby exists and is highly influential, points to
      Netanyahu's
      visit to Mar-a-Lago shortly before the Iran crisis, and treats Trump as
      driven
      substantially by popularity, self-enrichment and outside pressure rather
      than by
      conviction — asking why else Trump would absorb high gas prices and
      criticism
      from his own earliest media supporters. Tracey argues the causation runs
      the
      other way: that Trump holds a decipherable and genuinely hawkish ideology
      of his
      own, formed over the first term, the interregnum and the campaign, and
      that the
      lobby operates in synergy with it rather than steering it. For evidence he
      cites
      Trump's second inaugural invocation of William McKinley as a
      foreign-policy
      model, the talk of taking Greenland and Canada, the declaration about
      ruling
      Gaza, the Venezuela oil policy, and Trump's long-standing 'take the oil'
      critique
      of the Iraq war which Tracey says became actual policy in Syria in the
      first
      term. A long second section disputes what 'anti-war' means in Republican
      politics: Tracey argues the American First branding absorbed figures like
      Mike
      Waltz, Joni Ernst, Lindsey Graham, Mike Pompeo and Newt Gingrich, so the
      Bush-era
      yardstick for 'hawkish' no longer discriminates; and he argues the
      Afghanistan
      withdrawal exposes the rhetoric, since Republicans opposed it on principle
      while
      claiming to object only to its execution, and Trump later said he never
      intended
      to withdraw at all despite the Doha agreement, whose conditions Tracey
      says were
      designed never to be met. The opening stretch is a prickly exchange about
      media
      incentives, in which Tracey accuses journalists of softening criticism to
      protect
      podcast invitations and describes being cut off by people over his
      positions on
      antisemitism claims after October 7 and on the Epstein case. Both men also
      discuss J.D. Vance, Joe Rogan's pre-election Trump interview, and Dave
      Smith,
      about whom Tracey says he made a remark that murdering Tracey would be
      justifiable. IMPORTANT: this is an argument, not a finding. Every claim
      about any
      official's private motives — Trump's, Netanyahu's, Pompeo's — is the
      speakers'
      own inference and is contested between them on camera; no person
      characterised
      here appears to answer, and the subject matter is live, disputed and
      politically
      charged. The recording ends with scheduling chatter about a forthcoming
      Ron
      Johnson episode.
    URL: "https://www.youtube.com/watch?v=-aZeP9xRHxk"
