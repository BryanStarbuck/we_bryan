Transcription:

  Video:
    Title: "Are the Democrats ignoring foreign policy?"
    Description: >-
      A podcast conversation posted in October 2019 on journalist Michael Tracey's channel, in which Tracey
      interviews a guest the transcript calls Branko, a New Zealand-born foreign-policy writer for Jacobin and
      In These Times (apparently Branko Marcetic; the surname is not spoken), about how the 2020 Democratic
      presidential candidates handle foreign policy. After small talk about Marcetic's interest in US politics
      from abroad and New Zealand's Jacinda Ardern, the two agree foreign policy gets little attention in the
      primary and discuss how, in their view, the anti-war movement faded under Obama, plus the 2008 health
      care and Iraq vote fights. Marcetic identifies Afghanistan withdrawal, Israel and aid conditionality,
      and critiques of the War on Terror as emerging dividing lines, and says he now views Sanders' foreign
      policy more favourably than in 2017; Tracey raises Sanders' 1998 Iraq Liberation Act vote. Both argue
      that Joe Biden misrepresents his role in the run-up to the Iraq War, a characterisation that is their
      own. They then disagree at length over Tulsi Gabbard, with Marcetic doubting her anti-interventionism
      and raising her ties to Indian nationalist groups, and Tracey calling those criticisms overstated. The
      episode closes with scepticism from both about the Ukraine-related impeachment push, Hunter Biden and
      Elizabeth Warren. Biden, Gabbard, Warren and the other living figures discussed are not present to
      respond.
    URL: "https://www.youtube.com/watch?v=0AGaqRcwsyA"
    Video_ID: "0AGaqRcwsyA"
    Show: "M. Tracey"
    Runtime: "01:39:17"
