  Video:
    Title: "Bernie mocks NYT reporter for asking dumb questions"
    Description: >-
      A 19-minute solo commentary responding to a New York Times article about
      Bernie
      Sanders' foreign-policy activity as mayor of Burlington, Vermont in the
      1980s.
      The speaker says he already knew much of the material, having spent time
      in 2015
      in the University of Vermont archive holding Sanders' mayoral papers, and
      grants
      that some of the reporting is genuinely interesting. His objection is to
      the
      framing: he argues the article presents the 1980s activity as unserious or
      disqualifying while omitting context. He works through the specifics the
      article
      raises — Sanders' 1985 trip to Managua and meeting with Daniel Ortega,
      where he
      opposed the Reagan administration's CIA-backed effort against the
      Nicaraguan
      government and complained that American media had 'not reflected fairly
      the goals
      and accomplishments of your administration'; his reported line to CBS
      journalist
      George Creel, 'You are worms'; the 1988 sister-city relationship between
      Burlington and a Soviet city on the Volga and the accompanying trip; his
      remark
      that Soviet health care was free or nearly so; his call to 'reduce the
      obscene
      federal military budget'; his stated view that aspects of Cuban governance
      were
      laudable; and a 1982 pamphlet and ballot initiative opposing US support
      for the
      government of El Salvador. Against each he offers a defence: that
      Republicans
      were themselves embracing Gorbachev in that era, that the health-care
      remark was
      a statement of fact, that municipal anti-war resolutions are commonplace
      and
      symbolic, and that the Times does not mention what he calls the disastrous
      results of Reagan's Central America policy — which he argues can be
      traced, with
      caveats about the looseness of the link, to the instability now driving
      migration
      north. He also defends Sanders' record on ordinary municipal functions. A
      second
      strand attacks the journalists: he says Chuck Todd asking whether Sanders
      regrets
      his Vietnam-era anti-war activism is shameful, and recommends Nick Turse's
      book
      'Kill Anything That Moves' on systematic civilian killing in Vietnam. He
      transcribes portions of Sanders' contentious follow-up interview with
      Times
      reporter Sydney Ember about anti-American chants at the Managua rally,
      endorses
      Sanders' rudeness ('she deserved it... Bernie should have been ruder'),
      and
      accuses Ember of having previously confabulated a sexism controversy about
      the
      2016 campaign out of thin air. He closes by arguing that being pressed
      this way
      is actually good for Sanders, because consistency is his main political
      asset and
      the pressure makes it harder for him to jettison old positions to court
      the
      Democratic establishment — while noting he thinks Sanders blundered by
      towing the
      mainstream line on Trump and Russia, and saying he voted for him in 2016
      but is
      not a 'fanboy'. Every judgement here — about the Times' motives, about
      Ember,
      about Reagan's policy and its consequences — is the speaker's own and is
      contested; none of the journalists he criticises appears to answer.
