Transcription:

  Video:
    Title: "Interviewing MAGA supporters on Staten Island about Trump bombing Iran"
    Description: >-
      Street interviews Michael Tracey recorded at the Fourth of July 2025 parade on Staten Island, New York.
      He asks mostly Trump supporters what they thought of Trump's recent bombing of Iran. In a short opening
      monologue he argues that online talk of a MAGA 'civil war' over Iran was exaggerated and that polls show
      strong Republican support for the strikes. One interviewee is a Republican New York City mayoral
      candidate (the transcript does not name him; the context suggests Curtis Sliwa). He supports the strike
      and backing Ukraine, says anti-Semitism must be addressed while cost of living and crime are voters'
      main issues, and refuses to drop out in favour of Eric Adams against Zohran Mamdani. Parade-goers,
      several of them veterans, overwhelmingly back the bombing: some defer to Trump's judgement, some fear an
      Iranian nuclear attack on New York, and some call Israel America's closest ally. A few voice doubts
      about wider war or regime change. Tracey pushes back on factual points: that Israel struck first, the
      JCPOA and the zero-enrichment demand, disputed intelligence on an Iranian bomb, and the public's right
      to see war evidence. He also discusses Russia and Ukraine and a 9/11-intelligence digression with one
      woman. The views are those of the individual interviewees.
    URL: "https://www.youtube.com/watch?v=2NCm4hFqnOc"
