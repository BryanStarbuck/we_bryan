Transcription:

  Video:
    Title: "Michael Tracey talks to Mike Gravel about his 2020 campaign"
    Description: >-
      A 77-minute interview with former US Senator Mike Gravel (Alaska,
      1969-1981),
      recorded 14 May during his 2020 presidential run at the age of 89. The
      interviewer frames it in an introduction, noting Gravel's 2008 primary
      debate
      appearances and that this campaign began when a group of New York
      teenagers
      recruited him to run. Gravel's central argument throughout is his
      'legislature of
      the people': he holds that elected representatives have a monopoly on
      lawmaking,
      that this monopoly is what sustains the elites, and that a constitutional
      amendment plus a federal Legislative Procedures Act would let citizens
      enact laws
      in partnership with officials. He says he has been working on this for
      25-30
      years and is finishing a book on it, 'Human Governance'. He is explicit
      that this
      is why he doubts a progressive agenda can pass even if Sanders wins, given
      Senate
      arithmetic. On the other candidates, all of these are his stated opinions:
      he is
      supportive of Bernie Sanders, Tulsi Gabbard and Elizabeth Warren, and
      would like
      a Sanders-Gabbard ticket; he credits Gabbard's committee experience and
      says only
      she and Sanders address the military-industrial complex; he praises
      Alexandria
      Ocasio-Cortez and the Green New Deal; he argues Pete Buttigieg's media
      rise was
      'engineered' because he poses no threat to Wall Street or the
      military-industrial
      complex and that he 'articulates a lot of mush'; and he objects to
      Buttigieg's
      remarks about Chelsea Manning's clemency, correcting the record that it
      was a
      commutation rather than a pardon. He rejects the Trump-Russia narrative as
      'crap'
      and 'the conventional wisdom of the establishment', pointing to US funding
      and
      management of Yeltsin's re-election as his counter-example. On Venezuela
      he
      defends a Sanders statement the interviewer raises, arguing Maduro is a
      problem
      but that US sanctions are the greater cause of dysfunction, and citing a
      report
      that 40,000 children would die as a result. He calls the whole sanctions
      approach
      immoral because it empowers the leaders it targets while harming the poor,
      and
      recalls Madeleine Albright's 'collateral damage' answer about Iraqi child
      deaths
      as murder. He explains his famous 2008 debate exchange calling Joe Biden
      arrogant,
      extending the charge to Biden's handling of the Anita Hill hearings and to
      the
      Iraq partition plan, and calls the Iraq war probably the worst foreign
      policy
      mistake in American history. He states as fact that a psychiatrist has
      charted
      Trump's declining mental acuity and predicts Trump will lose the
      presidency within
      18 months — a claim he attributes to that psychiatrist, not to any
      examination of
      his own, and one the subject is not present to answer. He advises
      Democrats
      against impeachment as a distraction. A long biographical stretch covers
      his move
      to Alaska before statehood, his rise from freshman legislator to Speaker,
      his
      1980 primary defeat after alienating fishing and Native constituencies,
      his AGSOC
      stock-ownership proposal, and his affection for the state's landscapes. He
      closes
      supporting drug decriminalisation on the Portuguese model, research into
      cannabis and psychedelics, criticising Brexit as a referendum taken
      without
      informing people of the consequences, and reporting his campaign stood at
      35,000
      of the 65,000 donors the DNC required for debate entry. Every political
      characterisation here is Gravel's own and is contested; the people he
      criticises
      do not appear. The video ends with the host's Patreon and podcast promo.
