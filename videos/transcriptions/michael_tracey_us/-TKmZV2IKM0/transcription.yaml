  Video:
    Title: 'AOC says Trump is running "concentration camps"'
    Description: >-
      A 13-minute solo commentary arguing that Alexandria Ocasio-Cortez was
      wrong to
      describe US immigration detention centres as 'concentration camps'. The
      speaker's
      case is about consistency of language rather than about conditions. He
      argues
      that in American political usage the term necessarily invokes the
      Holocaust, so
      anyone who does not intend that comparison should choose a different word,
      and
      that the intent has to be questioned if they do not. He is explicit that
      this is
      separate from the substance: he grants there is a serious influx of
      migrants
      driven by instability and destitution in Central America, and that the
      conditions
      people are held in are a legitimate subject of scrutiny. He notes that
      Bernie
      Sanders, asked on CNN, said he does not use the term, and argues that
      unless one
      is willing to call Sanders a denier of fascism, the objection to the
      wording has
      to be conceded. His central argument turns on an article Ocasio-Cortez
      herself
      circulated to justify the term, which he says states that the detention
      network
      has existed for decades — begun under Clinton in the 1990s and built up
      under
      Bush, Obama and then Trump. From that he poses the question he returns to
      repeatedly: either Clinton and Obama also presided over concentration
      camps, or
      something changed on 20 January 2017, and if the latter, the label tracks
      who is
      in office rather than how the facilities operate. He cites a thread by
      Andy
      Grewal, a law professor at the University of Iowa, for supporting
      instances under
      Obama: the administration's successful 2016 argument in the Ninth Circuit
      case
      Flores v. Lynch that it could separate parents from children immediately,
      and
      reports of children held in cages so crowded they were 'forced to sleep
      standing
      up or not at all', plus an ACLU study finding pervasive abuse and neglect
      of
      unaccompanied children in CBP custody. He says this is not a 'but Obama
      did it'
      point but a demand for a consistent standard. He declines to take a side
      on the
      scholarly debate over whether the Holocaust is historically unique or can
      be
      analogised, saying only that invoking it requires a well-made argument. He
      closes
      by arguing that Ocasio-Cortez should be held to a high standard because of
      her
      influence, that right-wing obsession with her is nonetheless excessive,
      and that
      histrionic rhetoric crowds out rational inquiry into real problems —
      followed by
      a Patreon and podcast promo. Every judgement here is the speaker's own;
      neither
      Ocasio-Cortez nor anyone he criticises appears to answer, and his reading
      of her
      motives is inference rather than established fact.
