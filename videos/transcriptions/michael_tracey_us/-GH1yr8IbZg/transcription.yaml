Transcription:

  Video:
    Title: "Michael Tracey interviewed by John Ziegler on Epstein and media malpractice"
    Description: >-
      An 83-minute interview in which John Ziegler, on his 'Death of Journalism'
      podcast, questions independent journalist Michael Tracey about press
      coverage of
      the Jeffrey Epstein case following a release of government files. The
      framing is
      media criticism rather than new reporting: Tracey's thesis, stated at the
      outset,
      is that this is the worst-reported story in decades, and both men spend
      the
      interview arguing that mainstream, alternative and social media have
      converged on
      a picture they consider unsupported. Tracey opens by rejecting both labels
      Ziegler gives him, 'expert' and 'contrarian', arguing the latter is used
      to
      diagnose a personality flaw in place of engaging his arguments. His media
      critique centres on an example he reads out: a Wall Street Journal news
      article
      about Epstein conspiracy profiteers which, while debunking outlandish
      claims,
      itself asserts as 'proved true' that dozens of girls were abused on the
      private
      island — which Tracey says has not been established. He argues the effect
      of the
      coverage is that audiences now read unrelated political events, such as US
      strikes on Iran, through an Epstein-blackmail lens. Ziegler argues the
      legacy
      press abandoned its usual scepticism because of a convergence of
      incentives — the
      story's popularity, MAGA media invested for one reason and liberal media
      for
      another. Substantial portions concern named living and deceased
      individuals, and
      EVERY claim in them is the speakers' own contested opinion rather than an
      established finding: they argue an email exchange in which Epstein first
      tells
      Prince Andrew of Virginia Giuffre's allegation reads as inconsistent with
      guilt,
      with Ziegler asserting the files have 'proven his innocence' and Tracey
      declining
      to call it dispositive; they attack the credibility of Giuffre and of
      Miami
      Herald reporter Julie K. Brown; Tracey traces what he calls the mythology
      to a
      December 2014 motion for joinder filed by lawyers Bradley Edwards and Paul
      Cassell, which he characterises as legitimising her account and as
      leverage for
      settlements; and he recounts that Giuffre retracted her claims against
      Alan
      Dershowitz and, at a 2021 French pre-trial session, against Jean-Luc
      Brunel. On
      Epstein's death, Ziegler argues the evidence remains far more consistent
      with
      suicide and notes Dan Bongino and Kash Patel reached that conclusion
      against
      their prior public position; Tracey says only that he holds more
      'epistemic
      humility' on the manner of death than on other parts of the story, citing
      a
      DOJ interview with the New York City pathologist who was unequivocal that
      the
      injuries indicated suicide but who appeared to realise years later she had
      been
      shown a different ligature than the one likely used. Tracey separately
      criticises
      Rep. Thomas Massie for saying on a podcast that Epstein is not dead at
      all, which
      both men reject. The interview closes on the drafting of the Epstein Files
      Transparency Act and its redaction provisions, and on Ziegler pressing
      Tracey to
      examine the Penn State Sandusky case, which he considers a parallel
      injustice.
      READER CAUTION: this is two commentators arguing a revisionist position
      about an
      ongoing, heavily litigated matter involving allegations of sex crimes.
      Their
      characterisations of named accusers, reporters, lawyers and public figures
      are
      assertions of opinion, are strongly contested, and none of those people
      appears
      here to answer. Nothing described above should be read as established
      fact.
