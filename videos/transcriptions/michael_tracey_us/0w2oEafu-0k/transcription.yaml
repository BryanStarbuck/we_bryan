  Video:
    Title: "Ross Perot dead at 89!"
    Description: >-
      A solo commentary by Michael Tracey recorded on the day Ross Perot died (July 9, 2019). Tracey reflects
      on Perot's legacy and the 2016 comparisons of Perot with Donald Trump. He notes that Trump sought
      Perot's Reform Party nomination in 2000, yet Perot never commented publicly on Trump. Tracey speculates
      that Perot's strict personal moral code, including his stance on adultery, may explain that silence. He
      argues that Trump has largely governed as a conventional Republican, apart from some foreign-policy and
      trade deviations. He draws an electoral line between Perot beating George H.W. Bush's vote share in
      Maine in 1992 and Trump winning Maine's second district in 2016, and questions the common claim that
      Perot cost Bush the 1992 election. He recounts Perot's mid-1992 withdrawal, which he attributes to a
      fabricated dirty-tricks story from a former police officer named Scott Barnes, and praises Perot as the
      only major 1992 candidate to question the Gulf War. The assessments are Tracey's own.
