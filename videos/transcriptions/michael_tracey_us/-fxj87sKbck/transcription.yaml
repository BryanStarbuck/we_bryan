  Video:
    Title: '"Today''s News" with Michael Tracey and Matt Taibbi -- 3/16/2026'
    Description: >-
      A two-hour episode of the livestream 'Today's News' (March 16, 2026) co-hosted by journalists Matt
      Taibbi and Michael Tracey. The main thread is Tucker Carlson's announcement that the CIA was monitoring
      his texts in order to set him up for a crime: the hosts compare it with his 2021 claim that the NSA was
      spying on him, say the account may be accurate but is so far unverified, and caution against both
      instant denunciations and instant belief, including on Foreign Agents Registration Act questions. From
      there they criticise what they see as a turn in independent and podcast media toward demons, UFOs,
      Epstein and Israel-centred conspiracy content, argue that mainstream outlets helped legitimise
      'dot-connecting' in the Russiagate era, and defend editorial fact-checking. Taibbi recounts a personal
      spiritual experience and his undercover months in John Hagee's Cornerstone Church. They also discuss
      Conan O'Brien's Epstein jokes at the Oscars, a UK misconduct-in-public-office case they say involves
      Peter Mandelson and Prince Andrew, Tracey's view that Carlson deflects responsibility for the Iran war
      away from President Trump, RFK Jr.'s expectations of Trump, a viral conspiracy post about the Trump
      assassination attempt, and a planned 'worst podcaster' bracket. The characterisations of Carlson and
      others are the hosts' own opinions; the people discussed are not present.
