Transcription:

  Video:
    Title: "Michael Tracey and Richard Hanania on Trump and the Iran war"
    Description: >-
      A long, informal conversation (June 2025) between journalist Michael Tracey and writer Richard Hanania,
      recorded during the Israel-Iran war before the U.S. strikes on Iranian nuclear sites. They discuss
      whether President Trump will join the Israeli bombing campaign: Tracey argues Trump's pre-strike post
      promising diplomacy amounted to public disinformation and that Trump was not 'dragged' into the
      conflict, citing his earlier Time interview, while Hanania is more open to the war and argues regime
      collapse in Iran could turn out well, pointing to Iran's secular middle-class protest movements and the
      fall of the Soviet Union. Tracey counters with Libya and the risk of loose enriched uranium after a
      government collapse. They also cover Trump's Federal Reserve remarks, continued Biden-era arms drawdowns
      to Ukraine under Pete Hegseth, the multilateral negotiation of the 2015 Iran nuclear deal and Trump's
      withdrawal from it, differing Obama and Republican views of Iran, Trump's Gaza proposals, the influence
      of pro-Israel donors and advisers, Steve Bannon's role in the MAGA movement, and their own experiences
      on Tucker Carlson's and Rush Limbaugh's shows. The views are each speaker's own, and they disagree
      openly; the officials discussed are not present.
    URL: "https://www.youtube.com/watch?v=1RoRtMs8vqg"
