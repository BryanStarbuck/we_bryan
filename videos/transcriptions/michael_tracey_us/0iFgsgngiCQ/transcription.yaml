    Title: "Eric Swalwell, the most dimwitted presidential candidate"
    Description: >-
      A solo commentary video by journalist Michael Tracey (July 2019) mocking then-presidential candidate
      Rep. Eric Swalwell, whom he describes as emblematic of an MSNBC-style elite liberalism. Tracey
      criticises Swalwell's proposal for a new federal statute protecting journalists after the assault on
      Andy Ngo as redundant, argues that Swalwell's call for a mandatory assault-weapon buyback would provoke
      extreme unrest, and calls his 'pass the torch' line against Joe Biden in the first Democratic debate a
      contentless generational attack. Most of the video targets Swalwell's Trump-Russia rhetoric: his
      comparison of 2016 election interference to Pearl Harbor and 9/11, his statement that Trump was a
      Russian agent, and his claim that Trump likely faced sealed indictments, which Tracey says the Mueller
      report dispelled. Tracey argues Trump's actual Russia policy was belligerent, citing arms to Ukraine and
      withdrawal from the INF Treaty, and recounts briefly questioning Swalwell in South Carolina for a
      Spectator column. The characterisations of Swalwell, including the title's insult, are Tracey's own;
      Swalwell is not present to respond beyond the quotes Tracey paraphrases.
