Transcription:

  Video:
    Title: "Alan Dershowitz on Mueller and impeachment"
    Description: >-
      A roughly 38-minute podcast interview (May 2019) in which journalist Michael Tracey questions Harvard
      Law professor emeritus Alan Dershowitz about Robert Mueller's public statement closing the special
      counsel investigation. Dershowitz argues that Mueller's line that he could not clear the president
      'reversed the presumption of innocence' and confused a prosecutor's role with that of a fact-finder; he
      agrees with Mueller that a sitting president cannot be indicted, while Tracey pushes back that this
      rests on an untested Office of Legal Counsel memo. Dershowitz says appointing a special counsel was a
      mistake and proposes barring special counsels from issuing reports on people they do not charge,
      questions the political leanings of some of Mueller's staff, and says Democrats pursuing impeachment
      would be 'a guaranteed loser'. The conversation also covers commercial editions of the Mueller report,
      the Clinton and Nixon precedents, Harvard's removal of Ronald Sullivan as a faculty dean after he joined
      Harvey Weinstein's defence, the Me Too movement and due process, Dershowitz's refusal to support Bernie
      Sanders over his backing of Jeremy Corbyn, and his denial of a claim in a Michael Wolff book that he
      sought a retainer from Trump, which he calls false and says he may sue over. Tracey states several
      disagreements during the interview; the opinions about named individuals are Dershowitz's own and those
      people are not present.
    URL: "https://www.youtube.com/watch?v=-QKJYD0PbRM"
    Video_ID: "-QKJYD0PbRM"
    Show: "M. Tracey"
    Runtime: "00:38:38"
