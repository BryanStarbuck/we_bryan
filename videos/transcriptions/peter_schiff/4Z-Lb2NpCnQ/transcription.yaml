  Video:
    Title: "The Bond Buybacks Doubled... And Now There's a Military Option"
    Description: >-
      A fifty-nine-minute episode, the last Peter Schiff recorded from his boat in Maine before flying home to
      his Puerto Rico studio, built around a speech that day by Federal Reserve Chairman Kevin Warsh. Schiff
      argues the speech was hawkish theatre: that Warsh will talk tough about returning inflation to two
      percent without acting on it, that Trump conspicuously refrains from criticising Warsh in the way he
      criticised Powell, and that the whole arrangement is staged to make later inaction look economically
      justified rather than politically motivated. He notes markets took it as genuinely hawkish, with gold
      and silver hit hard and the dollar rallying. His sharper complaint is what Warsh omitted: no mention of
      the forty trillion dollar national debt, which Schiff says is itself a principal cause of the inflation
      being discussed, and no reaction at all to what the Treasury is doing with its bond-buying programme,
      which Schiff says Warsh acted as though were not happening. He then flags a separate remark from a Trump
      Fox News interview about Operation Twist in which Trump, having acknowledged the market intervention,
      said there is also a military option for getting bond yields down. Schiff reacts with open incredulity,
      asking what a military intervention in the bond market would even mean and paraphrasing it as 'buy these
      treasuries or we're going to bomb you'. He closes arguing the administration should cut government
      spending and use the veto rather than pursue symbolic gestures such as renaming lakes. The
      characterisation of Warsh's motives, the reading of the Trump remark, and the causal account of
      inflation are all Schiff's own and are contested; Warsh and Trump are not represented in the audio and
      the Trump quotation is Schiff's paraphrase of an interview not played in full. The episode carries an
      advertisement read for Ground News with a discount link, and promotion for the Investor Summit at Sea
      and Schiff's own Schiff Sovereign Plan B conference in Panama City.
