  Video:
    Title: "Everything I Warned You About Just Happened... All in One Week"
    Description: >-
      A fifty-four-minute solo episode recorded aboard Peter Schiff's boat off Rhode Island while cruising up
      the Atlantic toward Maine, covering two stories he presents as vindicating forecasts he says he has made
      for roughly twenty months. The first is the July non-farm payroll report, released that first Friday of
      August, which he reads as continued weakness following the prior month's miss, and which he says has
      pushed the odds of any Federal Reserve rate hike for the remainder of 2026 to roughly a coin toss. The
      second, which he treats as the more important, is an intervention involving Japan: he describes the
      Federal Reserve creating dollars and supplying them to the Bank of Japan so Japan could buy back yen
      without selling its holdings of US Treasuries, on the reasoning that Japanese selling would push
      Treasury prices down. He characterises this as unacknowledged quantitative easing conducted on Japan's
      behalf, and notes the Fed's balance sheet rose by more than ten billion dollars in the most recent week
      through its own open-market Treasury purchases, separate from the Japan operation. He frames all of it
      as the opening stage of a brewing Japanese financial crisis rather than a resolution, and closes by
      contrasting his account with what he calls government propaganda in the mainstream media. The mechanism
      he describes, his characterisation of it as covert QE, and the inflationary consequences he draws from
      it are his own analysis and are contested; he is a long-standing Federal Reserve critic who sells
      precious metals. The episode includes an extended advertisement read for Drip Drop hydration products
      with the promo code GOLD.
