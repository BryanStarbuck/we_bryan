  Video:
    Title: "The Bond Market Breakdown Has Started... Stocks, Housing, Crypto Are Next"
    Description: >-
      An hour-long weekly wrap episode of Peter Schiff's podcast covering housing affordability, a quiet but
      in his reading deceptive week in equities, the collapse of a Gulf peace deal, and the state of Bitcoin-
      linked equities. He opens by arguing American housing has never been less affordable and that this is
      the predictable consequence of ninety years of federal policy intended to make homes easier to buy
      rather than a failure of it, and dismisses a 21st Century Road to Housing bill before Congress as
      addressing a problem Congress itself created. On markets he reports the Dow snapping a four-week winning
      streak with a fall of about three quarters of a percent and the Russell 2000 down about one percent,
      while the S&P 500 and Nasdaq rose roughly 75 and 82 basis points on what he calls the AI bubble powering
      tech stocks. He notes a memorandum of understanding collapsed and the war is back on, and expresses
      surprise that only precious metals reacted: gold down about one percent to close at 4,119.40, silver
      down 3.5 percent to 59.76, and the miners hit harder with GDX off five percent and GDXJ six percent,
      which he argues is backwards because renewed conflict should be bullish for metals. He devotes an
      extended passage to Bitcoin rising about four percent to just above 64,000 while Strategy's common stock
      fell 1.7 percent, widening its discount to near forty percent, which he argues makes further share
      issuance to buy Bitcoin impossible; he makes a parallel argument about the Stretch instrument trading at
      87.48 with a 13.7 percent yield, reading that yield as the market pricing in a dividend cut because
      investors do not believe Bitcoin can appreciate twelve percent a year. He notes that no Wall Street firm
      covering Bitcoin holds a bearish view. He closes on Benjamin Franklin's 'a republic, if you can keep
      it', adding that in his view it was not kept, and on channel-growth housekeeping. All figures and every
      causal claim are as Schiff states them; his housing, Federal Reserve and Bitcoin positions are long-
      standing, contested, and held by someone whose business sells precious metals.
