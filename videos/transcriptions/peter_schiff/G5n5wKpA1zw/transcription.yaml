  Video:
    Title: "The Iran Deal Just Collapsed | Here's What Happens Next"
    Description: >-
      A sixty-two-minute episode opening with an extended argument that Americans are worse off than medieval
      serfs, on the reasoning that a free person owns the fruits of his labour, that serfs kept roughly
      seventy-five percent of what they produced, and that the average American keeps less; Schiff frames
      government claims on labour as a claim of ownership. That framing and the seventy-five percent figure
      are his own rhetorical comparison rather than established economic history. The substance of the episode
      is the collapse of the Iran ceasefire: Schiff says Trump has declared the ceasefire over with strikes
      expected imminently, and claims vindication for having called the underlying memorandum of understanding
      much ado about nothing, a non-binding deal to make a deal whose only real content was a sixty-day pause
      and the reopening of the Strait of Hormuz. He notes oil fell from above ninety dollars a barrel to below
      seventy on the partial reopening, and cites Trump saying the country was perhaps two weeks from running
      out of oil. He then argues AI-infrastructure borrowing has made interest rates newly relevant to
      technology valuations, because the payback on those investments lies far in the future and must be
      discounted, and covers FOMC minutes from the first meeting chaired by Kevin Warsh with Powell still
      attending, which he says equity traders wrongly dismissed. The episode carries an advertisement read for
      Drip Drop with the promo code GOLD. All figures, forecasts and causal claims are as Schiff states them
      and are contested; he is a long-standing Federal Reserve critic whose business sells precious metals,
      and the Trump remarks are his paraphrase rather than played audio.
