  Video:
    Title: "The Bond Market Is About to Break... And Stocks Go With It"
    Description: >-
      A sixty-two-minute episode recorded after a weekend escalation of the Iran war, tracking the resulting
      commodity surge and arguing it makes the Federal Reserve's two percent inflation target unreachable.
      Schiff reports Brent crude touching about 99.50 dollars a barrel intraday and West Texas closing above
      94, diesel continuing a record run, and copper hitting another all-time high around 6.82 to 6.85 dollars
      a pound, which he notes is up close to sixty percent since Trump took office. He argues copper remains
      cheap priced in gold rather than dollars, and inverts the common reading of the gold-copper ratio: where
      others expect gold to fall toward copper, he expects copper to rise toward gold, calculating that with
      gold near 4,400 dollars copper would have to exceed eleven dollars a pound to restore its historic
      average. His inflation argument is that after roughly sixty-five consecutive months above two percent, a
      target that could not be reached while oil was falling cannot be reached while oil is rising, and that
      government will keep generating inflation because it has no politically acceptable alternative. He
      forecasts serious carnage in the bond market followed by equities. The episode also contains an extended
      passage asserting that the government lies routinely about economic statistics to flatter Trump's
      record, and reasoning from there that its statements about the Iran situation should not be trusted
      either, on the general principle that a liar lies about everything convenient. THAT INFERENCE IS
      SCHIFF'S OWN and is an argument from character rather than from evidence about Iran specifically; he
      explicitly concedes he is not a military expert. All price levels, ratios and forecasts are as he states
      them and are contested, and he sells precious metals. The episode closes with personal remarks about
      spending Yom Kippur in Panama City and promotion of his Schiff Sovereign Plan B conference.
