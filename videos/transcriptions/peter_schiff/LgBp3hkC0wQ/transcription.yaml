  Video:
    Title: "Inflation Is About to Rise Again... On Purpose!"
    Description: >-
      A sixty-two-minute episode given over mostly to Kevin Warsh's first congressional testimony as Federal
      Reserve chairman, before the House with a Senate appearance to follow the next morning. Schiff sets it
      against June inflation data released that morning, and against a bond sell-off the previous session in
      which the ten-year Treasury yield reached about 4.62 percent and the thirty-year about 5.11, both new
      highs for that leg, alongside a roughly hundred-dollar-an-ounce fall in gold that took it below 4,000
      intraday without closing there. His reading of the hearing is that Congress and the chairman are
      discussing a problem they created while pretending an external solution exists, and that Warsh speaks of
      doing things differently without specifying what would actually be required, which Schiff takes as
      evidence it will not be done. The episode opens with a separate and substantial argument that AI capital
      expenditure is a disaster in the making: that the equipment becomes obsolete and must be continually
      replaced in an arms race, that companies are being rewarded by share prices for how much they spend
      rather than what they earn, that the real winners for now are the vendors selling the hardware, and that
      even those will suffer when customers can no longer borrow. He predicts the bond market will break. All
      figures, readings of the hearing and forecasts are Schiff's own and contested; Warsh is characterised
      rather than quoted at length and is not represented in the audio. The episode contains an advertisement
      read for Rockwell Automation citing its eleventh annual State of Smart Manufacturing report surveying
      more than 1,500 decision makers across 17 countries, and closes with channel-growth housekeeping.
