  Video:
    Title: "Bond Yields Just Hit a 2007 High... Every Buyer Became a Seller"
    Description: >-
      A sixty-two-minute Labor Day weekend episode, Peter Schiff's first back in his Puerto Rico studio after
      a summer of travel, arguing that a major and long-running bear market in bonds is underway because every
      former buyer of Treasuries has become a seller while issuance keeps growing, leaving the Federal Reserve
      as the eventual buyer of last resort and inflation as the only way it can fund that. He opens on the
      August non-farm payroll report, which headlines called a huge beat at roughly four standard deviations
      above expectations, and argues the beat is an artefact of a low bar: consensus was about 55,000 jobs
      against a range of 12,000 to 100,000, following a prior month that came in at negative 23,000. He
      dismisses the figures as meaningless on the grounds that payroll numbers are routinely revised downward,
      sometimes a year later and across many months, yet markets react to the initial print as though it were
      authoritative. The episode's analytical core is a credit-risk argument: that the United States is a
      worse credit risk than at any previous point not because default is likely but because inflating the
      debt away is now the likely repayment mechanism, the tax base being too small relative to the debt, and
      he disputes comparisons to Switzerland's low rates. Every claim, figure and forecast is Schiff's own and
      is contested by mainstream economists; he is a long-standing Federal Reserve critic whose business sells
      precious metals. The episode closes with an appeal for listeners to repost him on X toward a two-
      million-follower goal.
