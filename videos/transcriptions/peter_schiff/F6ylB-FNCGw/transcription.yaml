  Video:
    Title: "The Fed Just Chose Inflation... And the Bond Market Called Its Bluff"
    Description: >-
      An hour-long episode reacting to an FOMC decision that left the policy rate unchanged at three and a
      half to three and three quarters percent, and to Kevin Warsh's second press conference as Federal
      Reserve chairman. Schiff notes the vote was not unanimous, with three FOMC members favouring a quarter-
      point hike and Warsh not among them, and that markets had priced roughly a thirty percent chance of a
      hike. His argument is that Warsh is all bark and no bite: that even the hike on offer would have been
      far too small and too late to reach the two percent target, and that a serious effort would require
      shrinking the balance sheet and the money supply, which he says has continued growing since Warsh took
      over. He walks through the press conference, dwelling on an exchange with CNBC's Steve Liesman, who
      pressed Warsh on what the markets he says he listens to are actually telling him given that they are
      pushing rates higher; Schiff says Warsh sidestepped the question. He agrees with Warsh's stated dislike
      of forward guidance, arguing that markets pricing off Fed expectations rather than fundamentals corrupts
      the very signal the Fed wants to read. His broader thesis is that the Fed is trapped: the debt load and
      what he calls a massive bubble mean a Volcker-style response would cause worse damage than the inflation
      it treats, so markets crash if the Fed hikes and crash anyway if it does not. He closes on Bitcoin,
      arguing that repeated apparent bottoms are a sign the bottom has not arrived and that buyers are being
      lured in before a further fall. Every forecast and characterisation is Schiff's own, contested, and made
      by a long-standing Fed critic whose business sells precious metals; Warsh and Liesman are represented
      only through Schiff's summary rather than played at length.
