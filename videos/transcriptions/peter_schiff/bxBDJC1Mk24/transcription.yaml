  Video:
    Title: "The Treasury Just Admitted It... The Bond Market Is Broken"
    Description: >-
      A forty-eight-minute solo episode of Peter Schiff's podcast, recorded while he was travelling at sea
      before returning to his Puerto Rico studio, reacting to a same-day Treasury announcement that the
      government will buy long-dated Treasury bonds in order to hold down long-term yields. Schiff
      characterises the move as a panic measure and a hail mary rather than a considered policy, argues it
      amounts to using taxpayer money to buy what the market is selling, and says its cost is a shortening of
      the average maturity of the national debt from just under six years. He reports the thirty-year yield
      reaching about 5.32 percent, a nineteen-year high, the ten-year around 4.7, the national debt passing
      forty trillion dollars, and gold rallying roughly 185 dollars to close above 4,500 after a sharp fall
      the previous session, which he reads as the market confirming his interpretation. He also covers FOMC
      minutes he describes as more hawkish than expected, and argues the Fed and the deficits are the cause of
      inflation rather than AI, the stock market or the war, since the war was financed by borrowing rather
      than by taxes or spending cuts. He states that about thirty percent of the national debt was added
      during Trump's presidency and that Trump has now presided over the largest increase of any president,
      previously Obama. All of the above are Schiff's own figures and interpretations, offered by a long-
      standing critic of the Federal Reserve who sells precious metals; the causal claims in particular are
      contested by mainstream economists. The episode contains a lengthy advertisement read for Noom's GLP-1
      weight-loss programme and a promotion for Schiff's own Schiff Sovereign Plan B conference in Panama
      City. Several passages are garbled by the transcriber, including 'debt' rendered as 'dead'.
