    Title: "WATCH: Senator Booker Delivers Remarks on the Child Tax Credit"
    Description: >-
      Senator Cory Booker speaks on the Senate floor in support of extending the expanded
      Child Tax Credit, alongside Senators Brown and Bennet whom he credits with years of
      work on it. His frame is moral — "if you want to see how a nation is doing... just
      look at children" — but he also relays economic claims attributed to Bennet: that
      the United States ranks 38th of the top 41 countries on child poverty, that child
      poverty costs the country over a trillion dollars as measured by economists, and
      that every dollar invested in lifting children out of poverty returns eight. He
      argues GDP does not measure well-being, antidepressant use or child deaths, calls
      the credit a lifeline for grandparents raising grandchildren, and asks whether the
      Senate will make full refundability permanent and keep the monthly payments. The
      figures are as he states them; no study is named in the clip.
